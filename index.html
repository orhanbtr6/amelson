<script>
    // ... (Önceki tüm fonksiyonlar ve CSS yapısı aynı kalacak şekilde)

    window.showYearlyReport = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const yil = raporTarih.getFullYear();
        
        document.getElementById('statTitle').innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <button class="nav-btn" onclick="window.yilDegis(-1)">❮</button>
                <b>${yil} ÖZET RAPORU</b>
                <button class="nav-btn" onclick="window.yilDegis(1)">❯</button>
            </div>`;

        let kazaSayıları = { "Sabah": 0, "Öğle": 0, "İkindi": 0, "Akşam": 0, "Yatsı": 0 };
        let arsivAmeller = {};

        // Tüm yılı tara
        for (let m = 0; m < 12; m++) {
            let son = new Date(yil, m + 1, 0).getDate();
            for (let d = 1; d <= son; d++) {
                let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(yil, m, d))));
                if (!v) continue;

                // 1. Kazaya Kalan Namazları Say (Sadece Farz ve Kırmızı/s3 olanlar)
                v.vakitler.forEach((vk) => {
                    if (vk.durumlar[0] === 3) { // Farz (0) ve Kırmızı (3)
                        kazaSayıları[vk.ad]++;
                    }
                });

                // 2. Arşivlenmiş Özel Amelleri Say
                if (v.ozeller) {
                    v.ozeller.forEach(vo => {
                        // Global listede arşivlenmiş mi kontrol et
                        const globalListe = getGlobalOzeller();
                        const isArsiv = globalListe.find(g => g.id === vo.id && g.arsiv);
                        
                        if (isArsiv) {
                            if (!arsivAmeller[vo.ad]) arsivAmeller[vo.ad] = { t: 0, tip: vo.tip };
                            arsivAmeller[vo.ad].t += (vo.tip === 'sayi' ? parseFloat(vo.durum || 0) : (vo.durum > 0 ? 1 : 0));
                        }
                    });
                }
            }
        }

        // Tablo Oluşturma
        let h = `
        <div style="max-height:65vh; overflow-y:auto; padding:5px;">
            <table style="width:100%; border-collapse: collapse; font-size:12px; margin-bottom:15px;">
                <thead>
                    <tr style="background:rgba(255,255,255,0.1); color:var(--red);">
                        <th style="padding:8px; text-align:left; border-bottom:2px solid var(--red);">KAZA NAMAZLARI</th>
                        <th style="padding:8px; text-align:right; border-bottom:2px solid var(--red);">TOPLAM</th>
                    </tr>
                </thead>
                <tbody>`;
        
        Object.keys(kazaSayıları).forEach(v => {
            h += `<tr>
                    <td style="padding:8px; border-bottom:1px solid rgba(255,255,255,0.05);">${v}</td>
                    <td style="padding:8px; border-bottom:1px solid rgba(255,255,255,0.05); text-align:right; font-weight:bold;">${kazaSayıları[v]}</td>
                  </tr>`;
        });

        h += `</tbody></table>
            <table style="width:100%; border-collapse: collapse; font-size:12px;">
                <thead>
                    <tr style="background:rgba(255,255,255,0.1); color:var(--blue);">
                        <th style="padding:8px; text-align:left; border-bottom:2px solid var(--blue);">ARŞİVLENEN AMELLEER</th>
                        <th style="padding:8px; text-align:right; border-bottom:2px solid var(--blue);">TOPLAM</th>
                    </tr>
                </thead>
                <tbody>`;

        const arsivKeys = Object.keys(arsivAmeller);
        if (arsivKeys.length === 0) {
            h += `<tr><td colspan="2" style="padding:20px; text-align:center; opacity:0.5;">Arşivlenmiş amel bulunamadı.</td></tr>`;
        } else {
            arsivKeys.sort().forEach(k => {
                h += `<tr>
                        <td style="padding:8px; border-bottom:1px solid rgba(255,255,255,0.05);">${k}</td>
                        <td style="padding:8px; border-bottom:1px solid rgba(255,255,255,0.05); text-align:right; font-weight:bold;">
                            ${arsivAmeller[k].t} ${arsivAmeller[k].tip === 'sayi' ? '' : 'Gün'}
                        </td>
                      </tr>`;
            });
        }

        h += `</tbody></table></div>`;
        grid.innerHTML = h;
        modal.style.display = 'block';
    };

    // ... (Geri kalan kodlar V.19.6 ile aynı şekilde devam eder)
</script>
