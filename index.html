<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri V.27.0</title>
    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        .main-title { text-align: center; font-size: 20px; font-weight: 800; color: #a5d3ff; margin: 15px 0; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 8px 10px; border-radius: 20px; margin-bottom: 8px; }
        .date-display-box { text-align: center; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); min-width: 110px; position: relative; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 12px; }
        
        /* Kartlar */
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 5px; border: 1px solid rgba(255,255,255,0.08); }
        .vakit-isim-box { padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 95px; text-align: center; cursor: pointer; position: relative; }
        .vakit-ad { font-weight: bold; font-size: 11px; }
        .warning-icon { position: absolute; top: -10px; right: -5px; font-size: 15px; animation: blink 0.8s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* Daireler */
        .circles-row { display: flex; gap: 6px; align-items: center; }
        .circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; }
        .s0 { background: rgba(255,255,255,0.05); } .s1 { background: var(--dark-green); } .s2 { background: var(--light-green); } .s3 { background: var(--red); } .s4 { background: var(--orange); }

        /* Başarım */
        .progress-zone { width: 70px; text-align: center; }
        .progress-bg { background: rgba(255,255,255,0.1); height: 5px; border-radius: 10px; margin: 4px 0; overflow: hidden; }
        .progress-bar { height: 100%; transition: width 0.3s; background: var(--light-green); }
        
        /* Modal ve Tablo */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; padding: 10px; }
        .modal-content { background: #082d42; margin: auto; padding: 15px; width: 100%; max-width: 480px; border-radius: 15px; border: 1px solid var(--blue); position: relative; }
        .genel-table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
        .genel-table td { height: 40px; border-radius: 4px; text-align: center; font-size: 11px; font-weight: bold; position: relative; vertical-align: middle; }
        .day-num { position: absolute; top: 2px; left: 2px; font-size: 7px; opacity: 0.4; color: white; }

        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 8px; border-radius: 15px 15px 0 0; z-index: 1000; }
        input[type="text"] { flex: 1; border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title" onclick="window.gitBugun()">Amel Defteri</div>
    
    <div class="nav-header">
        <button class="nav-btn" onclick="window.degistirTarih(-1)">❮</button>
        <div class="date-display-box">
            <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
            <div id="isToday" style="font-size: 9px; color: var(--light-green);"></div>
            <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
        </div>
        <button class="nav-btn" onclick="window.degistirTarih(1)">❯</button>
        <div style="display:flex; gap:5px;">
            <button class="nav-btn" style="background:var(--blue); width:35px;" onclick="window.showGeneralReport()">📊</button>
            <button class="nav-btn" style="background:var(--orange); width:35px;" onclick="window.showYearlyReport()">📅</button>
        </div>
    </div>

    <div id="vakitList"></div>
    <div id="ozelList" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px; margin-top:5px;"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <button class="nav-btn" style="position:absolute; top:10px; right:10px; background:var(--red);" onclick="window.closeModal()">✕</button>
        <div id="statTitle" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#a5d3ff; text-transform:uppercase;"></div>
        <div id="calGrid"></div>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel ekle...">
    <button class="nav-btn" style="background:var(--dark-green); font-weight:bold;" onclick="window.yeniEkle()">EKLE</button>
</div>

<script>
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let gunlukVeriler = {};

    window.getLocalKey = (t) => `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;

    // GELİŞMİŞ UYARI SİSTEMİ: Herhangi biri (Farz-Sünnet-Tesbih) 3 gün üst üste boş mu?
    window.checkWarning = (vIdx) => {
        let fStreak = 0, sStreak = 0, tStreak = 0;
        for(let i=1; i<=3; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(window.getLocalKey(d)));
            if(val) {
                const dur = val.vakitler[vIdx].durumlar;
                if(dur[0] === 0 || dur[0] === 3) fStreak++;
                if(dur[1] === 0) sStreak++;
                if(dur[2] === 0) tStreak++;
            } else {
                fStreak++; sStreak++; tStreak++; // Veri yoksa boş say
            }
        }
        return (fStreak === 3 || sStreak === 3 || tStreak === 3);
    };

    window.veriYukle = () => {
        const key = window.getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const globalListe = JSON.parse(localStorage.getItem('amel_global_ozeller')) || [];
        if (kaydedilmis) {
            gunlukVeriler = kaydedilmis;
            gunlukVeriler.ozeller = gunlukVeriler.ozeller.filter(o => !globalListe.find(g => g.id === o.id && g.arsiv));
        } else {
            gunlukVeriler = { 
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
                ozeller: globalListe.filter(g => !g.arsiv).map(g => ({ ...g, durum: 0 })) 
            };
        }
        window.render();
    };

    window.render = () => {
        localStorage.setItem(window.getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
        document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        document.getElementById('isToday').innerText = (window.getLocalKey(new Date()) === window.getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' });
        
        const vDiv = document.getElementById('vakitList'); vDiv.innerHTML = '';
        gunlukVeriler.vakitler.forEach((v, vIdx) => {
            let f = v.durumlar[0], p = 0;
            if (f === 1) p += 30; else if (f === 2) p += 50; else if (f === 4) p += 20;
            if (v.durumlar[1] > 0) p += 25; if (v.durumlar[2] > 0) p += 25;

            let nClass = "vakit-isim-box";
            if (f === 3) nClass += " s3"; else if (f === 4) nClass += " s4"; else if (f === 2) nClass += " cemaat-glow"; else if (p >= 80) nClass += " s1";
            
            let warn = window.checkWarning(vIdx) ? '<span class="warning-icon">⚠️</span>' : '';

            vDiv.innerHTML += `<div class="habit-card">
                <div class="${nClass}" onclick="window.showHeatmap(${vIdx}, 'vakit', 0)">
                    ${warn}<span class="vakit-ad">${vakitler[vIdx]}</span>
                </div>
                <div class="circles-row">
                    ${basliklar.map((b, bI) => `<div class="circle s${v.durumlar[bI]}" onclick="window.degis(${vIdx}, ${bI}, 'vakit')"></div>`).join('')}
                </div>
                <div class="progress-zone">
                    <div style="font-size:10px; font-weight:bold;">%${p}</div>
                    <div class="progress-bg"><div class="progress-bar" style="width:${p}%"></div></div>
                </div>
            </div>`;
        });

        const oDiv = document.getElementById('ozelList'); oDiv.innerHTML = "";
        gunlukVeriler.ozeller.forEach((o, oIdx) => {
            let ctrl = o.tip === 'sayi' ? `<input type="number" value="${o.durum||""}" style="width:100%; background:rgba(255,255,255,0.1); border:none; color:white; text-align:center; border-radius:5px; font-size:12px;" onchange="window.sayiGuncelle(${oIdx}, this.value)">` : `<div class="circle s${o.durum}" style="width:24px; height:24px; margin:auto;" onclick="window.degis(${oIdx}, 0, 'ozel_renk')"></div>`;
            oDiv.innerHTML += `<div style="background:var(--card); padding:5px; border-radius:10px; text-align:center;"><span style="font-size:9px; font-weight:bold; cursor:pointer; display:block; margin-bottom:3px;" onclick="window.showHeatmap('${o.ad}', 'ozel')">${o.ad}</span>${ctrl}</div>`;
        });
    };

    window.showHeatmap = (id, tip, bI = 0) => {
        let sonGun = new Date(seciliTarih.getFullYear(), seciliTarih.getMonth() + 1, 0).getDate();
        document.getElementById('statTitle').innerText = (tip==='vakit'?vakitler[id]:id);
        let h = `<table class="genel-table"><tr>`;
        for(let d=1; d<=sonGun; d++) {
            let val = JSON.parse(localStorage.getItem(window.getLocalKey(new Date(seciliTarih.getFullYear(), seciliTarih.getMonth(), d))));
            let c = "s0", txt = "";
            if(val) {
                if(tip==='vakit') c = `s${val.vakitler[id].durumlar[bI]}`;
                else { 
                    let o = val.ozeller.find(x => x.ad === id); 
                    if(o) { c = o.tip==='sayi'?(o.durum>0?'s1':'s0'):`s${o.durum}`; txt = o.tip==='sayi' ? o.durum : ""; }
                }
            }
            h += `<td class="${c}"><span class="day-num">${d}</span>${txt}</td>`;
            if(d%7===0) h += `</tr><tr>`;
        }
        document.getElementById('calGrid').innerHTML = h + `</tr></table>`;
        document.getElementById('statModal').style.display = 'block';
    };

    window.showGeneralReport = () => {
        let dObj = new Date(); let day = dObj.getDay(); 
        let monday = new Date(dObj.setDate(dObj.getDate() - (day === 0 ? 6 : day - 1)));
        let wHTML = "<b>HAFTALIK KALİTE</b><br><br>";
        vakitler.forEach((v, vIdx) => {
            wHTML += `<div style="margin-bottom:10px;"><span style="font-size:11px;">${v}</span><div style="display:flex; gap:3px; height:8px; margin-top:3px;">`;
            for (let i = 0; i < 7; i++) {
                let curD = new Date(monday); curD.setDate(monday.getDate() + i);
                let vData = JSON.parse(localStorage.getItem(window.getLocalKey(curD)));
                let col = 'rgba(255,255,255,0.05)';
                if(vData) {
                    let d = vData.vakitler[vIdx].durumlar;
                    if(d[0]>0 && d[1]>0 && d[2]>0) col = 'var(--light-green)';
                    else if(d[0]>0) col = 'var(--orange)';
                }
                wHTML += `<div style="flex:1; background:${col}; border-radius:2px;"></div>`;
            }
            wHTML += `</div></div>`;
        });
        document.getElementById('calGrid').innerHTML = wHTML;
        document.getElementById('statModal').style.display = 'block';
    };

    window.degis = (i, s, t) => {
        if (t === 'ozel_renk') gunlukVeriler.ozeller[i].durum = (gunlukVeriler.ozeller[i].durum + 1) % 5;
        else {
            let d = gunlukVeriler.vakitler[i].durumlar[s];
            if (s === 0) d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 4 : (d === 4) ? 3 : 0;
            else if (s === 1) d = (d === 0) ? 1 : (d === 1) ? 3 : 0;
            else d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 3 : 0;
            gunlukVeriler.vakitler[i].durumlar[s] = d;
        } window.render();
    };

    window.gitBugun = () => { seciliTarih = new Date(); window.veriYukle(); };
    window.degistirTarih = (n) => { seciliTarih.setDate(seciliTarih.getDate() + n); window.veriYukle(); };
    window.tarihSec = (v) => { if(v) { seciliTarih = new Date(v); window.veriYukle(); } };
    window.closeModal = () => document.getElementById('statModal').style.display = 'none';
    window.sayiGuncelle = (i, v) => { gunlukVeriler.ozeller[i].durum = v; window.render(); };
    window.yeniEkle = () => { const ad = document.getElementById('habInp').value; if(!ad) return; let g = JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; g.push({ id: 'id_'+Date.now(), ad, tip: confirm("Sayısal mı?")?'sayi':'renk', arsiv: false }); localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); document.getElementById('habInp').value=""; window.veriYukle(); };

    window.veriYukle();
</script>
</body>
</html>
