<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri V.21.33</title>
    
    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        
        .main-title-container { text-align: center; margin: 18px 0; cursor: pointer; transition: transform 0.1s; }
        .main-title-container:active { transform: scale(0.98); }
        .main-title { display: inline-block; font-size: 22px; font-weight: 800; color: #a5d3ff; letter-spacing: 1.8px; text-transform: uppercase; text-shadow: 0 0 15px rgba(165,211,255,0.5); }
        .version-tag { font-size: 9px; opacity: 0.4; vertical-align: super; margin-left: 4px; font-weight: normal; letter-spacing: 0; }

        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px; border-radius: 20px; margin-bottom: 8px; }
        .date-nav { display: flex; align-items: center; gap: 5px; }
        .date-display-box { text-align: center; cursor: pointer; padding: 5px 12px; border-radius: 10px; position: relative; background: rgba(255,255,255,0.05); min-width: 100px; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 14px; }
        .info-btn { background: var(--blue); width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .vakit-isim-box { padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 95px; text-align: center; }
        .vakit-ad { font-weight: bold; font-size: 11px; color: #fff; }
        .circles-row { display: flex; gap: 8px; align-items: center; }
        
        .progress-zone { width: 85px; text-align: right; font-size: 9px; opacity: 0.9; margin-left: 5px; }
        .progress-bg { background: rgba(255,255,255,0.1); height: 5px; border-radius: 10px; overflow: hidden; margin-top: 2px; }
        .progress-bar { height: 100%; width: 0%; border-radius: 10px; transition: width 0.3s ease-in-out; }
        
        .bar-red { background: var(--red); }
        .bar-orange { background: var(--orange); }
        .bar-green { background: var(--dark-green); }
        .bar-full { background: var(--light-green); }

        .progress-percent { font-weight: bold; font-size: 10px; color: #fff; }
        .progress-label { color: #ccc; font-size: 9.5px; font-weight: 500; }
        
        .ozel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 5px; }
        .ozel-card { background: var(--card); border-radius: 10px; padding: 8px 4px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .sayi-input { width: 85%; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); text-align: center; padding: 6px 0; border-radius: 8px; margin: 5px auto; outline: none; }
        .circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .label-text { font-size: 10px; font-weight: 600; opacity: 0.9; margin-top: 4px; color: #a5d3ff; cursor: pointer; display: block; }
        
        .s0 { background: rgba(255,255,255,0.05); } 
        .s1 { background: var(--dark-green); } 
        .s2 { background: var(--light-green); } 
        .s3 { background: var(--red); } 
        .s4 { background: var(--orange); }
        .box-default { background: rgba(127, 187, 255, 0.15); }
        .box-success { background: rgba(144, 238, 144, 0.25); border-color: rgba(144, 238, 144, 0.4); }
        .box-danger { background: rgba(231, 76, 60, 0.25); border-color: rgba(231, 76, 60, 0.4); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; overflow-y: auto; padding: 20px 10px; }
        .modal-content { background: #082d42; margin: 0 auto; padding: 15px; width: 100%; max-width: 420px; border-radius: 15px; border: 1px solid var(--blue); position: relative; }
        .close-x { position: absolute; top: 5px; right: 5px; background: #e74c3c; border: none; color: white; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-weight: bold; z-index: 2100; display: flex; align-items: center; justify-content: center;}
        
        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 8px; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1); border-radius: 15px 15px 0 0; }
        input[type="text"] { flex: 1; border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; }
        .add-btn { background: var(--dark-green); color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-box { aspect-ratio: 1; border-radius: 6px; font-size: 9px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); position: relative; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title-container" onclick="window.gitBugun()">
        <span class="main-title">Amel Defteri</span><span class="version-tag">V.21.33</span>
    </div>
    <div class="nav-header">
        <div class="date-nav">
            <button class="nav-btn" onclick="degistirTarih(-1)">❮</button>
            <div class="date-display-box">
                <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
                <div id="isToday" style="font-size: 9px; color: var(--light-green); font-weight:bold;"></div>
                <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
            </div>
            <button class="nav-btn" onclick="degistirTarih(1)">❯</button>
        </div>
        <div style="display:flex; gap:5px; align-items:center;">
            <button class="nav-btn" style="background:var(--blue); font-size: 10px;" onclick="showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 10px;" onclick="showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>
    <div id="vakitList"></div>
    <div id="ozelList" class="ozel-grid"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal()">✕</button>
        <div id="statTitle"></div>
        <div id="calGrid"></div>
        <button class="add-btn" style="width:100%; background:var(--blue); margin-top:20px;" onclick="closeModal()">KAPAT</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeSettings()">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
        <button class="add-btn" style="width:100%; margin-bottom:10px; background:rgba(255,255,255,0.1);" onclick="exportData()">💾 Verileri Yedekle</button>
        <button class="add-btn" style="width:100%; margin-bottom:10px; background:rgba(255,255,255,0.1);" onclick="importData()">📂 Yedekten Geri Yükle</button>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel yaz...">
    <button class="add-btn" onclick="yeniEkle()">EKLE</button>
    <button onclick="openSettings()" style="background:none; border:none; font-size:22px;">⚙️</button>
    <input type="file" id="fileInp" style="display:none" onchange="processFile(this)">
</div>

<script>
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let genRaporTipIdx = 0;

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }
    function saveGlobalOzeller(l) { localStorage.setItem('amel_global_ozeller', JSON.stringify(l)); }

    function veriYukle() {
        const key = getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const globalListe = getGlobalOzeller();
        if (kaydedilmis) {
            gunlukVeriler = kaydedilmis;
            const kaydedilmisIdler = (kaydedilmis.ozeller || []).map(o => o.id);
            globalListe.filter(g => !g.arsiv && !kaydedilmisIdler.includes(g.id)).forEach(g => {
                gunlukVeriler.ozeller.push({ ...g, durum: 0 });
            });
        } else {
            gunlukVeriler = { 
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
                ozeller: globalListe.filter(g => !g.arsiv).map(g => ({ ...g, durum: 0 }))
            };
        }
        render();
    }

    function render() {
        localStorage.setItem(getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
        document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('isToday').innerText = (getLocalKey(new Date()) === getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' }).toUpperCase();
        
        const vDiv = document.getElementById('vakitList');
        vDiv.innerHTML = '';
        gunlukVeriler.vakitler.forEach((v, vIdx) => {
            let boxClass = "box-default";
            const farz = v.durumlar[0], sunnet = v.durumlar[1], tesbih = v.durumlar[2];
            let percent = 0;
            if (farz === 1) percent += 30; else if (farz === 2) percent += 50; else if (farz === 4) percent += 20;
            if (sunnet === 1 || sunnet === 2) percent += 25;
            if (tesbih === 1 || tesbih === 2) percent += 25;
            let barColorClass = percent >= 100 ? "bar-full" : (percent > 50 ? "bar-green" : (percent >= 26 ? "bar-orange" : "bar-red"));
            if (percent >= 100) { percent = 100; boxClass = "box-success"; }
            if (farz === 3) boxClass = "box-danger";

            let row = `<div class="habit-card"><div class="vakit-isim-box ${boxClass}"><span class="vakit-ad">${vakitler[vIdx]}</span></div><div class="circles-row">`;
            basliklar.forEach((b, bIdx) => {
                row += `<div style="text-align:center"><div class="circle s${v.durumlar[bIdx]}" onclick="window.degis(${vIdx}, ${bIdx}, 'vakit')"></div><span class="label-text" onclick="window.showStats('${vakitler[vIdx]} ${b}', 'vakit', ${vIdx}, ${bIdx})">${b}</span></div>`;
            });
            vDiv.innerHTML += row + '</div><div class="progress-zone"><div class="progress-percent">${percent}%</div><div class="progress-bg"><div class="progress-bar ${barColorClass}" style="width: ${percent}%;"></div></div><div class="progress-label">Başarım</div></div></div>';
        });

        const oDiv = document.getElementById('ozelList');
        oDiv.innerHTML = "";
        gunlukVeriler.ozeller.forEach((o, oIdx) => {
            const globalListe = getGlobalOzeller();
            if (globalListe.find(g => g.id === o.id && g.arsiv) && (o.durum == 0 || o.durum == "")) return;
            let displayValue = (o.durum === 0 || o.durum === "0") ? "" : o.durum;
            let ctrl = o.tip === 'sayi' ? `<input type="number" value="${displayValue}" placeholder="0" class="sayi-input" onchange="window.sayiGuncelle(${oIdx}, this.value)">` : `<div style="display:flex; justify-content:center; padding:5px;"><div class="circle s${o.durum}" onclick="window.degis(${oIdx}, 0, 'ozel_renk')"></div></div>`;
            oDiv.innerHTML += `<div class="ozel-card"><b style="font-size:11px; cursor:pointer;" onclick="window.showStats('${o.ad.replace(/'/g,"\\'")}', 'ozel', 0, 0, '${o.id}')">${o.ad}</b>${ctrl}<br><small onclick="window.silSecenekleri('${o.id}')" style="opacity:0.3; font-size:9px; cursor:pointer;">Arşivle</small></div>`;
        });
    }

    window.gitBugun = () => { seciliTarih = new Date(); veriYukle(); };
    window.showHelp = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        document.getElementById('statTitle').innerHTML = `<h2 style="text-align:center; color:#7fbbff; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">Renklerin Anlamı</h2>`;
        grid.innerHTML = `<div style="font-size:12.5px; line-height:1.5; color:#eee;"><p><b style="color:var(--orange)">[ FARZ ]</b><br>s1:Vakit s2:Cemaat s4:Kaza s3:Kaza Kaldı</p><p><b style="color:var(--light-green)">[ SÜNNET ]</b><br>s1:Kılındı s3:Kılınmadı</p><p><b style="color:var(--blue)">[ TESBİHAT ]</b><br>s1:Tam s2:Nafile s3:Yapılmadı</p></div>`;
        modal.style.display = 'block';
    };

    window.showGeneralReport = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;"><button class="nav-btn" onclick="window.ayRaporuDegis(-1)">❮</button><span>${ayYilStr}</span><button class="nav-btn" onclick="window.ayRaporuDegis(1)">❯</button></div><div style="display:flex; justify-content:center; gap:5px; margin-bottom:10px;">${basliklar.map((b,i)=>`<button class="nav-btn" style="font-size:10px; background:${genRaporTipIdx===i?'var(--blue)':'rgba(255,255,255,0.1)'}" onclick="window.setGenRaporTip(${i})">${b}</button>`).join('')}</div>`;
        let table = `<table style="width:100%; border-spacing:1px; table-layout:fixed;"><thead><tr><th style="width:25px; font-size:10px; opacity:0.5;"></th><th>S</th><th>Ö</th><th>İ</th><th>A</th><th>Y</th></tr></thead><tbody>`;
        let son = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= son; d++) {
            let t = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d);
            let v = JSON.parse(localStorage.getItem(getLocalKey(t)));
            table += `<tr><td style="text-align:center; font-size:10px; opacity:0.5;">${d}</td>`;
            for (let i = 0; i < 5; i++) {
                let dur = (v && v.vakitler[i]) ? (v.vakitler[i].durumlar[genRaporTipIdx] || 0) : 0;
                table += `<td style="height:12px; border-radius:2px;" class="s${dur}" onclick="window.gitTarih(${d})"></td>`;
            }
            table += `</tr>`;
        }
        grid.innerHTML = table + `</tbody></table>`;
        modal.style.display = 'block';
    };

    window.showYearlyReport = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const yil = raporTarih.getFullYear();
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><button class="nav-btn" onclick="window.yilDegis(-1)">❮</button><b style="font-size:15px;">${yil} ÖZETİ</b><button class="nav-btn" onclick="window.yilDegis(1)">❯</button></div>`;
        let kaza = { "Sabah": 0, "Öğle": 0, "İkindi": 0, "Akşam": 0, "Yatsı": 0 };
        let arsiv = {};
        for (let m = 0; m < 12; m++) {
            for (let d = 1; d <= 31; d++) {
                let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(yil, m, d))));
                if (!v) continue;
                v.vakitler.forEach((vk, i) => { if(vk.durumlar[0] === 3) kaza[Object.keys(kaza)[i]]++; });
                (v.ozeller || []).forEach(vo => {
                    if (getGlobalOzeller().find(g => g.id === vo.id && g.arsiv)) {
                        if (!arsiv[vo.ad]) arsiv[vo.ad] = { toplam: 0, tip: vo.tip };
                        if (vo.tip === 'sayi') arsiv[vo.ad].toplam += parseFloat(vo.durum || 0);
                        else if (vo.durum > 0) arsiv[vo.ad].toplam += 1;
                    }
                });
            }
        }
        let h = `<div style="max-height:60vh; overflow-y:auto; font-size:13px;"><table style="width:100%; margin-bottom:20px;"><thead><tr style="color:var(--red); border-bottom:1px solid rgba(255,255,255,0.1);"><th style="text-align:left;">KAZA</th><th style="text-align:right;">TOPLAM</th></tr></thead><tbody>`;
        Object.keys(kaza).forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right;">${kaza[k]}</td></tr>`; });
        h += `</tbody></table><table style="width:100%;"><thead><tr style="color:var(--blue); border-bottom:1px solid rgba(255,255,255,0.1);"><th style="text-align:left;">ARŞİV</th><th style="text-align:right;">SONUÇ</th></tr></thead><tbody>`;
        Object.keys(arsiv).sort().forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right;">${arsiv[k].toplam}${arsiv[k].tip==='sayi'?'':' G'}</td></tr>`; });
        grid.innerHTML = h + `</tbody></table></div>`;
        modal.style.display = 'block';
    };

    window.showStats = (ad, tip, vIdx, bIdx = 0, id = '') => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;"><button class="nav-btn" onclick="window.ayDegis(-1,'${ad.replace(/'/g,"\\'")}','${tip}',${vIdx},${bi},'${id}')">❮</button><span style="font-size:13px;">${ad}</span><button class="nav-btn" onclick="window.ayDegis(1,'${ad.replace(/'/g,"\\'")}','${tip}',${vIdx},${bi},'${id}')">❯</button></div><div style="text-align:center; font-size:12px; color:var(--blue); margin-bottom:10px;">${ayYilStr}</div>`;
        let gridHtml = `<div class="calendar-grid">`;
        let son = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= son; d++) {
            let t = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d);
            let v = JSON.parse(localStorage.getItem(getLocalKey(t)));
            let val = "", cls = "s0";
            if (v) {
                if (tip === 'vakit') cls = "s" + (v.vakitler[vIdx].durumlar[bIdx] || 0);
                else { 
                    // DÜZELTME: Hem ID hem de isim üzerinden arama yapılarak veri kaybı engellendi
                    let o = (v.ozeller || []).find(x => x.id === id) || (v.ozeller || []).find(x => x.ad === ad);
                    if (o) {
                        if (o.tip === 'sayi' && o.durum && o.durum != 0) { cls = 's2'; val = `<b>${o.durum}</b>`; }
                        else if (o.tip !== 'sayi' && o.durum > 0) { cls = 's' + o.durum; }
                    }
                }
            }
            gridHtml += `<div class="cal-box ${cls}" onclick="window.gitTarih(${d})"><small style="position:absolute; top:2px; left:2px; opacity:0.4; font-size:8px;">${d}</small>${val}</div>`;
        }
        grid.innerHTML = gridHtml + `</div>`;
        modal.style.display = 'block';
    };

    window.ayDegis = (n, ad, t, vi, bi, id) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showStats(ad, t, vi, bi, id); };
    window.ayRaporuDegis = (n) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showGeneralReport(); };
    window.yilDegis = (n) => { raporTarih.setFullYear(raporTarih.getFullYear()+n); window.showYearlyReport(); };
    window.gitTarih = (d) => { seciliTarih = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d); closeModal(); veriYukle(); };
    window.setGenRaporTip = (idx) => { genRaporTipIdx = idx; window.showGeneralReport(); };
    window.degistirTarih = (n) => { seciliTarih.setDate(seciliTarih.getDate() + n); veriYukle(); };
    window.tarihSec = (v) => { if(v) { seciliTarih = new Date(v); veriYukle(); } };
    window.closeModal = () => { document.getElementById('statModal').style.display = 'none'; raporTarih = new Date(); };
    window.openSettings = () => { document.getElementById('settingsModal').style.display = 'block'; };
    window.closeSettings = () => { document.getElementById('settingsModal').style.display = 'none'; };
    window.degis = (i, s, t) => {
        if (t === 'ozel_renk') gunlukVeriler.ozeller[i].durum = (gunlukVeriler.ozeller[i].durum + 1) % 5;
        else {
            let d = gunlukVeriler.vakitler[i].durumlar[s];
            if (s === 0) { if (d === 0) d = 1; else if (d === 1) d = 2; else if (d === 2) d = 4; else if (d === 4) d = 3; else d = 0; }
            else if (s === 1) { if (d === 0) d = 1; else if (d === 1) d = 3; else d = 0; }
            else { if (d === 0) d = 1; else if (d === 1) d = 2; else if (d === 2) d = 3; else d = 0; }
            gunlukVeriler.vakitler[i].durumlar[s] = d;
        }
        render();
    };
    window.sayiGuncelle = (i, v) => { gunlukVeriler.ozeller[i].durum = v === "" ? 0 : v; render(); };
    window.yeniEkle = () => { const ad = document.getElementById('habInp').value; if(!ad) return; let g = getGlobalOzeller(); g.push({ id: 'id' + Date.now(), ad, tip: confirm("Sayısal veri mi?") ? 'sayi' : 'renk', arsiv: false }); saveGlobalOzeller(g); document.getElementById('habInp').value = ""; veriYukle(); };
    window.silSecenekleri = (id) => { if(confirm("Arşivlensin mi?")) { let g = getGlobalOzeller(); let idx = g.findIndex(x => x.id === id); if(idx > -1) g[idx].arsiv = true; saveGlobalOzeller(g); veriYukle(); } };
    window.exportData = () => { let all = {}; for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); if(k && k.startsWith('amel_')) all[k] = localStorage.getItem(k); } let b = new Blob([JSON.stringify(all)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `amel_yedek.json`; a.click(); };
    window.importData = () => { document.getElementById('fileInp').click(); };
    window.processFile = (inp) => { let fr = new FileReader(); fr.onload = () => { let d = JSON.parse(fr.result); Object.keys(d).forEach(k => localStorage.setItem(k, d[k])); location.reload(); }; fr.readAsText(inp.files[0]); };
    veriYukle();
</script>
</body>
</html>
