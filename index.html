        document.getElementById('statModal').style.display = 'flex';
    }
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let signalsActive = localStorage.getItem('amel_signals_active') !== 'false';
    let pendingName = "";
    let currentHeatmapId = null;
    let currentHeatmapType = null;
    let currentHeatmapSubIdx = null;

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }
    function toggleSignals(val) { signalsActive = val; localStorage.setItem('amel_signals_active', val); render(); }
    function isTodayCheck(d, m, y) { let today = new Date(); return d === today.getDate() && m === today.getMonth() && y === today.getFullYear(); }
    function isFuture() { let today = new Date(); today.setHours(0,0,0,0); let check = new Date(seciliTarih); check.setHours(0,0,0,0); return check > today; }

    function getWarningData(vIdx) {
        if(!signalsActive || isFuture()) return null;
        const bugunDurum = gunlukVeriler.vakitler[vIdx].durumlar;
        let streaks = [0, 0, 0];
        for(let i=1; i<=3; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.vakitler[vIdx]) {
                const dur = val.vakitler[vIdx].durumlar;
                if(dur[0] === 0 || dur[0] === 3) streaks[0]++;
                if(dur[1] === 0) streaks[1]++;
                if(dur[2] === 0) streaks[2]++;
            } else { streaks[0]++; streaks[1]++; streaks[2]++; }
        }
        let fWarn = (streaks[0] >= 3 && (bugunDurum[0] === 0 || bugunDurum[0] === 3));
        let sWarn = (streaks[1] >= 3 && bugunDurum[1] === 0);
        let tWarn = (streaks[2] >= 3 && bugunDurum[2] === 0);
        return (fWarn || sWarn || tWarn) ? {streaks, fWarn, sWarn, tWarn} : null;
    }

    function getOzelWarning(ozelIdx) {
        if(!signalsActive || isFuture()) return false;
        const ozelBugun = gunlukVeriler.ozeller[ozelIdx];
        if(!ozelBugun || (ozelBugun.durum != 0 && ozelBugun.durum !== "")) return false;
        let count = 0;
        for(let i=1; i<=2; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.ozeller) {
                let o = val.ozeller.find(x => x.ad === ozelBugun.ad);
                if(!o || o.durum == 0 || o.durum === "" || o.durum === 0) count++;
            } else { count++; }
        }
        return count >= 2;
    }
window.analizEt = function() {
    let ilkGiris = localStorage.getItem('ilkGiris');
let gunFarki = (new Date().getTime() - ilkGiris) / (1000 * 60 * 60 * 24);

if (gunFarki < 3) {
    // Henüz 3 gün dolmadıysa analiz yerine teşvik mesajı göster
    yorumlar.push("🌟 **Yolculuk Başlıyor:** Manevi rehberine hoş geldin! Analizlerin sağlıklı oluşabilmesi için ilk 3 gün verilerini girmeye odaklan.");
}
    let veriler = [];
    let bugun = new Date();
    const vakitAdlari = ["Sabah", "Öğle", "İkindi", "Akşam", "Yatsı"];
    let baslangicGunu = (bugun.getHours() < 23) ? 1 : 0;

    for (let i = baslangicGunu; i < (14 + baslangicGunu); i++) {
        let d = new Date(); d.setDate(bugun.getDate() - i);
        let k = getLocalKey(d);
        let v = JSON.parse(localStorage.getItem(k));
        if (v) veriler.push({ fark: i - baslangicGunu, veri: v });
    }

    if (veriler.length < 3) { alert("Analiz için en az 3 günlük veri gerekiyor."); return; }

    let stats = {
        son: { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0, vakitler: [], ozeller: {} },
        once: { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0, vakitler: [], ozeller: {} }
    };

    for(let i=0; i<5; i++) {
        stats.son.vakitler[i] = { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0 };
        stats.once.vakitler[i] = { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0 };
    }

    veriler.forEach(item => {
        let s = (item.fark < 7) ? stats.son : stats.once;
        item.veri.vakitler.forEach((v, idx) => {
            let farzVal = parseInt(v.durumlar[0]); 
            
            // 0:boş, 1:yeşil, 2:açık yeşil, 3:turuncu, 4:kırmızı
            switch(farzVal) {
                case 1: s.vaktinde++; s.vakitler[idx].vaktinde++; break;
                case 2: s.cemaat++; s.vakitler[idx].cemaat++; break;
                case 3: 
                case 0: // Boş bırakılan da borçtur, kaza sayıldı
                    s.kaza++; s.vakitler[idx].kaza++; break;
                case 4: 
                default: s.hic++; s.vakitler[idx].hic++; break;
            }

            if (parseInt(v.durumlar[1]) > 0) { s.sunnet++; s.vakitler[idx].sunnet++; }
            if (parseInt(v.durumlar[2]) > 0) { s.tesbihat++; s.vakitler[idx].tesbihat++; }
        });

        if (item.veri.ozeller) {
            item.veri.ozeller.forEach(o => {
                if (!s.ozeller[o.ad]) s.ozeller[o.ad] = { yapildi: 0 };
                if (parseInt(o.durum) > 0) s.ozeller[o.ad].yapildi++;
            });
        }
    });

    let yorumlar = [];
    const hadislerNamaz = {
        0: "Sabah namazının iki rekatı, dünyadan ve dünyadaki her şeyden daha hayırlıdır. (Müslim)",
        1: "Kim öğle namazından önce dört, sonra da iki rekat kılmaya devam ederse Allah onu cehenneme haram kılar. (Nesâî)",
        2: "İkindi namazını terk edenin ameli boşa gider. (Buhârî)",
        3: "Akşam namazı gündüzün vitridir; acele ediniz. (Tirmizî)",
        4: "Yatsı ve sabah namazlarındaki sevabı bilselerdi, emekleyerek de olsa gelirlerdi. (Buhârî)"
    };
    // --- NAMAZ ANALİZİ ---
    let sorunluVakitler = stats.son.vakitler.map((v, i) => (v.kaza > 0 || v.hic > 0) ? vakitAdlari[i] : null).filter(n => n);
    
    if (sorunluVakitler.length > 0) {
        let vakitIndeks = vakitAdlari.indexOf(sorunluVakitler[0]);
        yorumlar.push(`⚠️ **Namaz Analizi:** Son hafta **${sorunluVakitler.join(", ")}** vakitlerinde aksamalar görülüyor. Efendimiz (sav) buyuruyor: *"${hadislerNamaz[vakitIndeks]}"*`);
    } else {
        yorumlar.push(`✅ **Maşallah:** Tüm namazlar vaktinde ikame edildi. "Namaz dinin direğidir." İstikrarın daim olsun.`);
    }

    // --- ÖZEL AMEL ANALİZİ (Gelişime Dayalı) ---
    let gevseyenler = [];
    let gelisenler = [];
    for (let ad in stats.son.ozeller) {
        let sonHafta = stats.son.ozeller[ad].yapildi;
        let oncekiHafta = (stats.once.ozeller[ad]) ? stats.once.ozeller[ad].yapildi : 0;

        if (sonHafta < oncekiHafta) {
            gevseyenler.push(ad);
        } else if (sonHafta > oncekiHafta || (sonHafta === 7 && oncekiHafta === 7)) {
            gelisenler.push(ad);
        }
    }
    if (gevseyenler.length > 0) {
        yorumlar.push(`📉 **Dikkat:** Geçen haftaya oranla **${gevseyenler.join(", ")}** amellerinde bir gevşeme var. Amellerin hayırlısı, az da olsa devamlı olanıdır.`);
    } 
    if (gelisenler.length > 0) {
        yorumlar.push(`🌟 **Gelişim:** **${gelisenler.join(", ")}** amellerindeki gayretin artmış veya tam puanla devam ediyor. Rabbimiz buyuruyor: *"İnsan için ancak çalıştığının karşılığı vardır." (Necm, 39)*`);
    }
    // --- GÖRSEL RAPOR ---
    let h = `<div style="text-align:left; color:#eee; max-height:80vh; overflow-y:auto; padding-right:10px;">`;
    h += `<h3 style="color:#2ecc71; text-align:center; font-size:20px; border-bottom:1px solid #333; padding-bottom:10px;">📊 HAFTALIK MANEVİ ANALİZ</h3>`;

    h += `<div style="background:rgba(52,152,219,0.1); padding:15px; border-radius:18px; border:1px solid #3498db; margin-bottom:20px; font-size:15px; line-height:1.6;">
            ${yorumlar.join(" <hr style='opacity:0.1; margin:10px 0;'> ")}
          </div>`;
    vakitAdlari.forEach((ad, i) => {
        let sn = stats.son.vakitler[i];
        let on = stats.once.vakitler[i];
        h += `<div style="background:var(--card); padding:12px; border-radius:15px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.1);">
                <b style="color:#3498db; font-size:17px;">${ad.toUpperCase()}</b>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:8px;">
                    <div style="font-size:12px; color:#2ecc71;">Cemaat: <b>${sn.cemaat}</b> ${getF(sn.cemaat, on.cemaat)}</div>
                    <div style="font-size:12px; color:#a3e4d7;">Vaktinde: <b>${sn.vaktinde}</b> ${getF(sn.vaktinde, on.vaktinde)}</div>
                    <div style="font-size:12px; color:#e74c3c;">Kazaya Kalmış: <b>${sn.kaza}</b> ${getF(sn.kaza, on.kaza, true)}</div>
                    <div style="font-size:12px; color:#f39c12;">Kaza Edilmiş: <b>${sn.hic}</b> ${getF(sn.hic, on.hic, true)}</div>
                </div>
              </div>`;
    });
    h += `<b style="color:#f1c40f; font-size:17px; display:block; margin:20px 0 10px 5px;">🌟 Özel Amel Durumu</b>`;
    for (let ad in stats.son.ozeller) {
        let d = stats.son.ozeller[ad];
        let ed = stats.once.ozeller[ad] || { yapildi: 0 };
        h += `<div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:15px;">${ad}</span>
                <span style="color:#2ecc71; font-weight:bold;">${d.yapildi}/7 Gün ${getF(d.yapildi, ed.yapildi)}</span>
              </div>`;
    }
    h += `</div>`;

    function getF(s, e, t = false) {
        let f = s - e; if(f === 0) return `<small style="color:#777;">(0)</small>`;
        let r = (f > 0) ? (t ? '#e74c3c' : '#2ecc71') : (t ? '#2ecc71' : '#e74c3c');
        return `<small style="color:${r}; font-weight:bold;">(${f > 0 ? '+' : ''}${f})</small>`;
    }
    document.getElementById('statTitle').innerText = "DETAYLI ANALİZ";
    document.getElementById('calGrid').innerHTML = h;
    modalAcildi(); 
    document.getElementById('statModal').style.display = 'flex';

Gemini ile sohbet
mavi tonları daha iyi olurdu mavi tonuna çeviriip uygun bir çerçeve tonu yapar mısın yeşil pek olmadı

Genel temayı yeşil tonlarından modern ve ferah mavi tonlarına taşımak için CSS dosyanızdaki renk değişkenlerini (:root) ve ilgili sınıfları şu şekilde güncelleyebilirsiniz.

Mavi tonları, uygulamanın derinlik hissini artırırken gözü daha az yoran bir "Soft UI" deneyimi sunacaktır.

1. Renk Değişkenlerini Güncelle (Mavi Tema)
CSS dosyanızın en üstündeki :root kısmını bu yeni "Gece Mavisi ve Buz Mavisi" paletiyle değiştirin:

CSS
:root { 
    --bg: #0d1b2a; /* Derin gece mavisi arka plan */
    --card: rgba(27, 38, 59, 0.7); /* Şeffaf lacivert kartlar */
    --glass-border: rgba(165, 211, 255, 0.2); /* Buz mavisi ince çerçeve */
    --light-blue: #a5d3ff; /* Parlak buz mavisi */
    --dark-blue: #1b263b; /* Koyu lacivert */
    --accent-blue: #3498db; /* Ana aksiyon mavisi */
    --text-main: #e0e1dd; /* Açık gri/beyaz metin */
    --success-blue: #00b4d8; /* Tamamlananlar için turkuaz mavi */
}

Nasıl Çalışacak?
Otomatik Geçiş: Sen "Sabah Namazı" dairesine tıklayıp farzı işaretlediğin an (durum 0'dan 1 veya 2'ye geçtiğinde), render() fonksiyonu tekrar tetiklenir.

Sıradaki Vakit: findIndex fonksiyonu artık sabah namazını değil, bir sonraki durumu 0 olan vakti (Öğle) bulur.

Görsel Odak: Sadece o anki vaktin çerçevesi parlak mavi yanar. Tüm vakitler dolduğunda veya geçmiş/gelecek bir güne bakıldığında parlama otomatik olarak kapanır.

İpucu: Eğer vaktin Farzı "Kılınmadı" (durum 3) olarak işaretlendiğinde de mavinin sönmesini istiyorsan, findIndex içindeki kontrolü v.durumlar[0] === 0 olarak bırakman yeterlidir (çünkü 3 artık 0 değildir).

Burada veri tabanı boş mu kontrolünü hangi kod ile öğrenebilirim

Veri tabanının (bu durumda localStorage üzerindeki kayıtların) boş olup olmadığını anlamak için, kodunda daha önce kullandığın amel_data_ ile başlayan anahtarları (key) sayma yöntemini kullanabilirsin.

Bunu kontrol etmek için en temiz yöntem şudur:

JavaScript
// localStorage'da "amel_data_" ile başlayan kaç tane kayıt olduğunu sayar
const veriTabaniBosMu = Object.keys(localStorage).filter(key => key.startsWith('amel_data_')).length === 0;

if (veriTabaniBosMu) {
    console.log("Veri tabanı henüz boş, hiç kayıtlı gün yok.");
} else {
    console.log("Veri tabanında kayıtlı günler mevcut.");
}
Kodun İçinde Nereye Bakmalısın?
Senin paylaştığın render() fonksiyonunda zaten buna benzer bir kontrol satırı vardı:

const toplamKayitliGun = Object.keys(localStorage).filter(key => key.startsWith('amel_data_')).length;

Buradaki toplamKayitliGun değişkeni:

0 (Sıfır) ise: Veri tabanı boştur.

0'dan büyük ise: İçeride en az bir günlük veri vardır.

Daha Hızlı Bir Kontrol (Performanslı)
Eğer sadece "içeride en az bir tane bile veri var mı?" diye bakmak istersen (tüm listeyi saymadan), şu kod daha hızlı çalışır:

JavaScript
const veriVarMi = Object.keys(localStorage).some(key => key.startsWith('amel_data_'));

if (!veriVarMi) {
    // Veri tabanı boşsa yapılacak işlemler
}
Neden some kullanmalıyız?
filter yöntemi tüm localStorage'ı tarayıp her şeyi sayar. some ise ilk bulduğu amel_data_ anahtarında durur ve "evet, veri var" der. Eğer veri tabanın çok büyürse bu yöntem uygulamayı yormaz.

Amel data diye bir şeyi nereden buldun

Haklısın, bir önceki cevabımda kullandığım amel_data_ ifadesi senin kodundaki küçük bir detayla karışmış olabilir. Kodlarını incelediğimde aslında anahtarlarını (key) şu fonksiyonla oluşturduğunu görüyorum:

function getLocalKey(t) { return 'amel_' + t.getFullYear() + ... }

Yani senin veri tabanı anahtarların amel_data_ değil, doğrudan amel_ ön ekiyle başlıyor (Örn: amel_2026-05-08).

Bir verinin olup olmadığını kontrol etmek için senin sistemine tam uyumlu kod şudur:

JavaScript
// localStorage içindeki anahtarlardan "amel_" ile başlayanları bulur
const veriVarMi = Object.keys(localStorage).some(key => key.startsWith('amel_'));

if (!veriVarMi) {
    console.log("Henüz hiçbir namaz veya amel kaydı girilmemiş.");
}
Neden amel_ kullanmalısın?
Kodunda localStorage.getItem(getLocalKey(d)) diyerek veri çekiyorsun. getLocalKey fonksiyonun da başına amel_ eklediği için, tarayıcının hafızasında başka uygulamalara ait veriler olsa bile (örneğin başka bir sitenin ayarları), biz sadece senin uygulamana ait olanları bu ön ek sayesinde ayırt edebiliyoruz.

Paylaştığın kodlarda genel yapı doğru olsa da, uygulamanın çalışmasını engelleyen veya hatalı davranmasına sebep olan 4 kritik hata ve birkaç mantıksal eksiklik var.

İşte düzeltmen gereken noktalar:

1. render() İçindeki veriler Değişkeni Hatası (En Kritik Olan)
render() fonksiyonu içinde let wData = (veriler.length > 0) ? ... satırını kullanmışsın. Ancak veriler dizisi render içinde tanımlı değil, sadece analizEt fonksiyonu içinde yerel (local) bir değişken. Bu durum, render çalıştığında uygulamanın çökmesine neden olur.

Çözüm: render içinde getWarningData'yı kontrol etmeden önce verilerin varlığını localStorage üzerinden kontrol etmelisin.

2. Sözdizimi (Syntax) Hatası: degis Fonksiyonu
Kodunda window.degis fonksiyonunun eski satırı yorum satırı yapılmış ama araya bir ; ve hatalı parantez girmiş.

Hatalı satır: if (t === 'ozel_renk') ;gunlukVeriler.ozeller[i].durum = ...

Doğru satır: if (t === 'ozel_renk') { gunlukVeriler.ozeller[i].durum = ... }

3. toplamKayitliGun ve amel_data_ Çelişkisi
Kodun başında getLocalKey fonksiyonu anahtarları amel_ ile başlatıyor. Ancak render içinde toplamKayitliGun kontrolünde .includes('amel_data_') araması yapıyorsun. Eğer anahtarların amel_2026-05-08 şeklindeyse, amel_data_ içeren bir anahtar asla bulunamaz ve uyarılar (wData) hiç görünmez.

4. modalAcildi() Fonksiyonunun Tanımsız Olması
analizEt ve showGeneralReport fonksiyonları içinde modalAcildi(); komutunu çağırmışsın ama paylaştığın kodlarda bu fonksiyonun tanımı yok. Bu da konsolda hata verecektir.

Düzeltilmiş render() ve Diğer Fonksiyonlar (Hatasız Versiyon)

    window.exportData = () => { let all = {}; for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); if(k.startsWith('amel_')) all[k] = localStorage.getItem(k); } let b = new Blob([JSON.stringify(all)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `amel_yedek.json`; a.click(); };

    veriYukle();
    window.tamamenSil = (amelAd) => { if(confirm(`'${amelAd}' her yerden silinecek. Emin misiniz?`)) { let g = JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; g = g.filter(a => a.ad.trim() !== amelAd.trim()); localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); for (let i = 0; i < localStorage.length; i++) { let key = localStorage.key(i); if (key && key.startsWith('amel_')) { let gunlukVeri = JSON.parse(localStorage.getItem(key)); if (gunlukVeri && gunlukVeri.ozeller) { gunlukVeri.ozeller = gunlukVeri.ozeller.filter(o => o.ad.trim() !== amelAd.trim()); localStorage.setItem(key, JSON.stringify(gunlukVeri)); } } } veriYukle(); closeModal(); } }

// Yardımcı Fonksiyonlar
function hesaplaPuan(v, hedefTarihKey) {
    if (!v) return 0;
    let p = 0;
    let toplamPuanPayi = 0;

    let simdi = new Date();
    let suAnkiSaat = simdi.getHours();
    let bugunStr = getLocalKey(simdi); 

    v.vakitler.forEach((vk, index) => {
        let f = Number(vk.durumlar[0]);
        let s = Number(vk.durumlar[1]);
        let t = Number(vk.durumlar[2]);

        // Vaktin gelip gelmediğini kontrol et
        let vakitGeldiMi = (hedefTarihKey < bugunStr) || (index === 0) || (hedefTarihKey === bugunStr && suAnkiSaat >= vakitSaatleri[index]);

        if (vakitGeldiMi) {
            // KRİTİK DÜZELTME: Vakit geldiyse bu 18 puan mutlaka paydaya eklenmeli!
            toplamPuanPayi += 18; 

            // Farz Puanı (12 üzerinden)
            if (f === 1 || f === 2) p += 12; 
            else if (f === 4) p += 6; // Kaza ise yarım puan (6)
            
            // Sünnet Puanı (4 üzerinden)
            if (s === 1 || s === 2) p += 4; 
            else if (s === 4) p += 2; // Sünnet kaza/sonradan ise 2
            
            // Tesbihat Puanı (2 üzerinden)
            if (t === 1 || t === 2) p += 2; 
            else if (t === 4) p += 1; // Tesbihat sonradan ise 1
        }
    });

    // Özel Ameller (10 Puanlık Sabit Pay)
    toplamPuanPayi += 10;
    let ozeller = v.ozeller || [];
    let yapilanOzel = ozeller.filter(o => {
        let d = String(o.durum).trim();
        return d !== "" && d !== "0" && d !== "null";
    }).length;

    if (ozeller.length > 0) {
        p += (yapilanOzel / ozeller.length) * 10;
    }

    if (toplamPuanPayi === 0) return 0;
    // Matematiksel olarak (Alınan Puan / Olması Gereken Puan) * 100
    return Math.min(Math.round((p / toplamPuanPayi) * 100), 100);
}
    function getEksikler(v) {
    let e = [];
    let simdi = new Date();
    let suAnkiSaat = simdi.getHours();
    
    let bugun = new Date(); bugun.setHours(0,0,0,0);
    let secili = new Date(seciliTarih); secili.setHours(0,0,0,0);

    // Eğer bakılan gün gelecek bir günse hiçbir eksik gösterme
    if (secili > bugun) {
        return "<span style='color:#3498db;'>⏳ Bu gün henüz başlamadı.</span>";
    }

    v.vakitler.forEach((vk, index) => {
        let f = Number(vk.durumlar[0]);
        let s = Number(vk.durumlar[1]);
        let t = Number(vk.durumlar[2]);
        
        // Geçmiş gün mü yoksa bugün mü kontrolü
        let vakitGeldiMi = (secili < bugun) || (index === 0) || (suAnkiSaat >= vakitSaatleri[index]);

        if (vakitGeldiMi) {
            if (f === 0 || f === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(231,76,60,0.2); border:1px solid #e74c3c; border-radius:8px; margin:2px; font-size:11px; color:#ff7675;">🚨 ${vk.ad.split(' ')[0]} Farz</span>`);
            if (s === 0 || s === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(243,156,18,0.1); border:1px solid #f39c12; border-radius:8px; margin:2px; font-size:11px; color:#fab1a0;">🔸 ${vk.ad.split(' ')[0]} Sünnet</span>`);
            if (t === 0 || t === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); border-radius:8px; margin:2px; font-size:11px; opacity:0.8;">📿 ${vk.ad.split(' ')[0]} Tesbihat</span>`);
        }
    });

    // getEksikler fonksiyonu içindeki özel amel kısmı
    let ozeller = v.ozeller || [];
    ozeller.forEach(o => {
        // DURUM KONTROLÜ: Sadece boş veya 0 ise eksik say, 3 ise yapıldı say!
        let d = o.durum;
        let yapildiMi = (d !== 0 && d !== "0" && d !== "" && d !== null && d !== undefined);

        if (!yapildiMi) {
            e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(52,152,219,0.1); border:1px solid #3498db; border-radius:8px; margin:2px; font-size:11px; color:#74b9ff;">✨ ${o.ad}</span>`);
        }
    });
    return e.length > 0 ? e.join('') : "<span style='color:#2ecc71; font-weight:bold;'>🌟 Harika! Eksik görünmüyor.</span>";
}
const vakitSaatleri = {
