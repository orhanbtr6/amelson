<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri V.22.70</title>
    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        
        /* Başlıklar */
        .main-title-container { text-align: center; margin: 18px 0; cursor: pointer; }
        .main-title { display: inline-block; font-size: 22px; font-weight: 800; color: #a5d3ff; letter-spacing: 1.8px; text-transform: uppercase; text-shadow: 0 0 15px rgba(165,211,255,0.5); }
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 8px 10px; border-radius: 20px; margin-bottom: 8px; position: relative; }
        
        /* Takvim Girişi Fix */
        .date-display-box { text-align: center; cursor: pointer; padding: 4px 10px; border-radius: 12px; position: relative; background: rgba(255,255,255,0.05); min-width: 110px; z-index: 5; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; }
        
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .info-btn { background: var(--blue); width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; }
        
        /* Kart Yapısı */
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .vakit-isim-box { padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 95px; text-align: center; background: rgba(255,255,255,0.05); cursor: pointer; }
        .vakit-ad { font-weight: bold; font-size: 11px; color: #fff; }
        .ozel-ad { font-size: 12px; font-weight: bold; color: #a5d3ff; margin-bottom: 4px; display: block; cursor: pointer; }
        
        /* Renk Durumları */
        .kaza-bg { background: var(--orange) !important; border-color: #fff !important; }
        .eksik-bg { background: var(--red) !important; border-color: #fff !important; }
        .cemaat-glow { background: rgba(144, 238, 144, 0.25) !important; border-color: var(--light-green) !important; box-shadow: 0 0 8px rgba(144, 238, 144, 0.2); }
        .basari-bg { background: var(--dark-green) !important; }
        .low-quality { opacity: 0.45; filter: grayscale(0.7); }

        .circles-row { display: flex; gap: 8px; align-items: center; }
        .circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .s0 { background: rgba(255,255,255,0.05); } .s1 { background: var(--dark-green); } .s2 { background: var(--light-green); } .s3 { background: var(--red); } .s4 { background: var(--orange); }

        /* Kaydırmalı Buton */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dark-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Modal & Tablo */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; overflow-y: auto; padding: 20px 10px; }
        .modal-content { background: #082d42; margin: 0 auto; padding: 15px; width: 100%; max-width: 480px; border-radius: 15px; border: 1px solid var(--blue); position: relative; }
        .close-x { position: absolute; top: 10px; right: 10px; background: var(--red); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
        .genel-wrapper { width: 100%; overflow-x: auto; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 10px; }
        .genel-table { border-collapse: separate; border-spacing: 2px; width: 100%; }
        .genel-table td { height: 18px; border-radius: 2px; text-align: center; font-size: 8px; }
        
        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 8px; z-index: 1000; border-radius: 15px 15px 0 0; }
        input[type="text"] { flex: 1; border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title-container" onclick="window.gitBugun()">
        <span class="main-title">Amel Defteri</span>
    </div>
    
    <div class="nav-header">
        <button class="nav-btn" onclick="window.degistirTarih(-1)">❮</button>
        <div class="date-display-box">
            <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
            <div id="isToday" style="font-size: 9px; color: var(--light-green);"></div>
            <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
        </div>
        <button class="nav-btn" onclick="window.degistirTarih(1)">❯</button>
        <div style="display:flex; gap:5px;">
            <button class="nav-btn" style="background:var(--blue); font-size: 10px;" onclick="window.showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 10px;" onclick="window.showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>

    <div id="vakitList"></div>
    <div id="ozelList" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px; margin-top:5px;"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="window.closeModal()">✕</button>
        <div id="statTitle" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#a5d3ff;"></div>
        <div id="calGrid"></div>
        <button class="nav-btn" style="width:100%; margin-top:15px; background:var(--red);" onclick="window.closeModal()">KAPAT</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="window.closeSettings()">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
        <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:15px;">
            <span>Farkındalık Sinyalleri (⚠/🎨)</span>
            <label class="switch">
                <input type="checkbox" id="signalToggle" onchange="window.toggleSignals(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button class="nav-btn" style="width:100%; margin-bottom:10px;" onclick="window.exportData()">💾 Yedekle</button>
        <button class="nav-btn" style="width:100%;" onclick="window.importData()">📂 Geri Yükle</button>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel...">
    <button class="nav-btn" style="background:var(--dark-green); font-weight:bold;" onclick="window.yeniEkle()">EKLE</button>
    <button onclick="window.openSettings()" style="background:none; border:none; font-size:22px; cursor:pointer;">⚙️</button>
</div>

<script>
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let signalsActive = localStorage.getItem('amel_signals_active') !== 'false';

    window.getLocalKey = (t) => `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    window.getGlobalOzeller = () => JSON.parse(localStorage.getItem('amel_global_ozeller')) || [];

    window.veriYukle = () => {
        const key = window.getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const globalListe = window.getGlobalOzeller();
        if (kaydedilmis) {
            gunlukVeriler = kaydedilmis;
            // Bugün veya gelecekse arşivlenenleri gösterme
            if(seciliTarih >= new Date().setHours(0,0,0,0)) {
                gunlukVeriler.ozeller = gunlukVeriler.ozeller.filter(o => !globalListe.find(g => g.id === o.id && g.arsiv));
            }
        } else {
            gunlukVeriler = { 
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
                ozeller: globalListe.filter(g => !g.arsiv).map(g => ({ ...g, durum: 0 })) 
            };
        }
        window.render();
    };

    window.render = () => {
        localStorage.setItem(window.getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
        document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('isToday').innerText = (window.getLocalKey(new Date()) === window.getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' }).toUpperCase();
        
        const vDiv = document.getElementById('vakitList'); vDiv.innerHTML = '';
        gunlukVeriler.vakitler.forEach((v, vIdx) => {
            let f = v.durumlar[0], p = 0;
            if (f === 1) p += 30; else if (f === 2) p += 50; else if (f === 4) p += 20;
            if (v.durumlar[1] > 0) p += 25; if (v.durumlar[2] > 0) p += 25;

            let nameClass = "vakit-isim-box";
            if (f === 3) nameClass += " eksik-bg";
            else if (f === 4) nameClass += " kaza-bg";
            else if (f === 2) nameClass += " cemaat-glow";
            else if (p >= 80) nameClass += " basari-bg";

            vDiv.innerHTML += `<div class="habit-card">
                <div class="${nameClass}" onclick="window.showSingleHeatmap(${vIdx}, 'vakit')"><span class="vakit-ad">${vakitler[vIdx]}</span></div>
                <div class="circles-row">
                    ${basliklar.map((b, bI) => `<div style="text-align:center"><div class="circle s${v.durumlar[bI]}" onclick="window.degis(${vIdx}, ${bI}, 'vakit')"></div><span style="font-size:9px; opacity:0.7;">${b}</span></div>`).join('')}
                </div>
                <div style="width:60px; text-align:right; font-size:12px; font-weight:bold;">%${p}</div>
            </div>`;
        });

        const oDiv = document.getElementById('ozelList'); oDiv.innerHTML = "";
        gunlukVeriler.ozeller.forEach((o, oIdx) => {
            let ctrl = o.tip === 'sayi' ? `<input type="number" value="${o.durum||""}" style="width:100%; background:none; border:1px solid rgba(255,255,255,0.2); color:white; text-align:center;" onchange="window.sayiGuncelle(${oIdx}, this.value)">` : `<div class="circle s${o.durum}" style="width:26px; height:26px; margin:auto;" onclick="window.degis(${oIdx}, 0, 'ozel_renk')"></div>`;
            oDiv.innerHTML += `<div style="background:var(--card); padding:8px; border-radius:10px; text-align:center;"><span class="ozel-ad" onclick="window.showSingleHeatmap('${o.ad}', 'ozel')">${o.ad}</span>${ctrl}<span onclick="window.arsivle('${o.id}')" style="font-size:8px; color:var(--red); cursor:pointer; display:block; margin-top:5px;">Arşivle</span></div>`;
        });
    };

    // TEKLİ AY TAKVİMİ (Heatmap)
    window.showSingleHeatmap = (id, tip) => {
        const grid = document.getElementById('calGrid');
        const ayStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `${tip==='vakit'?vakitler[id]:id} - ${ayStr}`;
        let sonGun = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        let h = `<div class="genel-wrapper"><table class="genel-table"><tr>`;
        for(let d=1; d<=sonGun; d++) {
            let val = JSON.parse(localStorage.getItem(window.getLocalKey(new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d))));
            let colorClass = "s0";
            if(val) {
                if(tip==='vakit') colorClass = `s${val.vakitler[id].durumlar[0]}`;
                else { let o = val.ozeller.find(x => x.ad === id); if(o) colorClass = o.tip==='sayi'?(o.durum>0?'s1':'s0'):`s${o.durum}`; }
            }
            h += `<td class="${colorClass}">${d}</td>`;
            if(d%7===0) h += `</tr><tr>`;
        }
        grid.innerHTML = h + `</tr></table></div>`;
        document.getElementById('statModal').style.display = 'block';
    };

    window.showGeneralReport = () => {
        const grid = document.getElementById('calGrid');
        const ayStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `GENEL RAPOR - ${ayStr}`;
        let sonGun = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        let table = `<div class="genel-wrapper"><table class="genel-table"><thead><tr><th>Vakit</th>`;
        for(let d=1; d<=sonGun; d++) table += `<th>${d}</th>`;
        table += `</tr></thead><tbody>`;
        vakitler.forEach((vAd, vI) => {
            table += `<tr><td>${vAd.split(" ")[0]}</td>`;
            for(let d=1; d<=sonGun; d++){
                let v = JSON.parse(localStorage.getItem(window.getLocalKey(new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d))));
                table += `<td class="s${(v && v.vakitler[vI]) ? v.vakitler[vI].durumlar[0] : 0}"></td>`;
            }
            table += `</tr>`;
        });
        grid.innerHTML = table + `</tbody></table></div>`;
        document.getElementById('statModal').style.display = 'block';
    };

    window.showYearlyReport = () => {
        const grid = document.getElementById('calGrid');
        const yil = new Date().getFullYear();
        document.getElementById('statTitle').innerHTML = `${yil} YILI ÖZETİ`;
        let kaza = [0,0,0,0,0], ozeller = {};
        for(let m=0; m<12; m++) {
            for(let d=1; d<=31; d++){
                let v = JSON.parse(localStorage.getItem(window.getLocalKey(new Date(yil,m,d))));
                if(!v) continue;
                v.vakitler.forEach((vk, i) => { if(vk.durumlar[0]===3 || vk.durumlar[0]===4) kaza[i]++; });
                v.ozeller.forEach(o => { if(!ozeller[o.ad]) ozeller[o.ad] = 0; if(o.tip==='sayi') ozeller[o.ad]+=parseFloat(o.durum||0); else if(o.durum>0) ozeller[o.ad]++; });
            }
        }
        let h = `<table style="width:100%; font-size:13px;">`;
        vakitler.forEach((v, i) => h += `<tr><td>${v}</td><td style="text-align:right; color:var(--orange);">${kaza[i]} Kaza</td></tr>`);
        h += `<tr><td colspan="2" style="border-bottom:1px solid #333; padding:10px 0;">Özel Ameller</td></tr>`;
        Object.keys(ozeller).forEach(o => h += `<tr><td>${o}</td><td style="text-align:right; color:var(--blue);">${ozeller[o]}</td></tr>`);
        grid.innerHTML = h + `</table>`;
        document.getElementById('statModal').style.display = 'block';
    };

    window.showHelp = () => {
        document.getElementById('statTitle').innerHTML = `BİLGİ & REHBER`;
        document.getElementById('calGrid').innerHTML = `<div style="font-size:12px; line-height:1.6; color:#ccc; text-align:left;">
            <p><b>1. Puanlama:</b> Farz(30), Cemaat(50), Sünnet(25), Tesbihat(25). %80 başarıda isim yeşil yanar.</p>
            <p><b>2. Renkler:</b> <b style="color:var(--red);">Kırmızı:</b> Farz terk (İsim de kırmızı yanar). <b style="color:var(--orange);">Turuncu:</b> Kaza namazı.</p>
            <p><b>3. Tıklama:</b> Vakit isimlerine basarsan o vaktin aylık takvimi açılır.</p>
            <p><b>4. Arşiv:</b> Arşivlenen ameller bugünden silinir ama yıllık istatistiklerde toplamları görünmeye devam eder.</p>
        </div>`;
        document.getElementById('statModal').style.display = 'block';
    };

    window.degis = (i, s, t) => {
        if (t === 'ozel_renk') gunlukVeriler.ozeller[i].durum = (gunlukVeriler.ozeller[i].durum + 1) % 5;
        else {
            let d = gunlukVeriler.vakitler[i].durumlar[s];
            if (s === 0) d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 4 : (d === 4) ? 3 : 0;
            else if (s === 1) d = (d === 0) ? 1 : (d === 1) ? 3 : 0;
            else d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 3 : 0;
            gunlukVeriler.vakitler[i].durumlar[s] = d;
        } window.render();
    };

    window.gitBugun = () => { seciliTarih = new Date(); window.veriYukle(); };
    window.degistirTarih = (n) => { seciliTarih.setDate(seciliTarih.getDate() + n); window.veriYukle(); };
    window.tarihSec = (v) => { if(v) { seciliTarih = new Date(v); window.veriYukle(); } };
    window.closeModal = () => document.getElementById('statModal').style.display = 'none';
    window.openSettings = () => { document.getElementById('signalToggle').checked = signalsActive; document.getElementById('settingsModal').style.display = 'block'; };
    window.closeSettings = () => document.getElementById('settingsModal').style.display = 'none';
    window.toggleSignals = (val) => { signalsActive = val; localStorage.setItem('amel_signals_active', val); window.render(); };
    window.arsivle = (id) => { if(confirm("Arşivlensin mi?")) { let g = window.getGlobalOzeller(); let idx = g.findIndex(x => x.id === id); if(idx > -1) { g[idx].arsiv = true; localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); window.veriYukle(); } } };
    window.yeniEkle = () => { const ad = document.getElementById('habInp').value; if(!ad) return; let g = window.getGlobalOzeller(); g.push({ id: 'id_'+Date.now(), ad, tip: confirm("Sayısal mı?")?'sayi':'renk', arsiv: false }); localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); document.getElementById('habInp').value=""; window.veriYukle(); };
    window.sayiGuncelle = (i, v) => { gunlukVeriler.ozeller[i].durum = v; window.render(); };
    window.exportData = () => { let all = {}; for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); if(k.startsWith('amel_')) all[k] = localStorage.getItem(k); } let b = new Blob([JSON.stringify(all)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `amel_yedek.json`; a.click(); };
    window.importData = () => { let i = document.createElement('input'); i.type='file'; i.onchange=e=>{ let fr=new FileReader(); fr.onload=()=>{ let d=JSON.parse(fr.result); Object.keys(d).forEach(k=>localStorage.setItem(k,d[k])); location.reload(); }; fr.readAsText(e.target.files[0]); }; i.click(); };

    window.veriYukle();
</script>
</body>
</html>
