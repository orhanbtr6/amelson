<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Amel Defteri V.21.12</title>
    
    <link rel="manifest" href="manifest.json">

    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .main-title { text-align: center; font-size: 18px; font-weight: bold; color: #7fbbff; margin-bottom: 10px; text-transform: uppercase; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px; border-radius: 20px; margin-bottom: 8px; }
        .date-nav { display: flex; align-items: center; gap: 5px; }
        .date-display-box { text-align: center; cursor: pointer; padding: 5px 15px; border-radius: 10px; position: relative; background: rgba(255,255,255,0.05); min-width: 100px; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; border: none; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 14px; z-index: 5; }
        .info-btn { background: var(--blue); width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; }
        .vakit-isim-box { padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 100px; text-align: center; transition: background 0.3s ease; }
        .box-default { background: rgba(127, 187, 255, 0.15); }
        .box-success { background: rgba(144, 238, 144, 0.25); border-color: rgba(144, 238, 144, 0.4); }
        .box-danger { background: rgba(231, 76, 60, 0.25); border-color: rgba(231, 76, 60, 0.4); }
        .vakit-ad { font-weight: bold; color: #fff; font-size: 0.75rem; }
        .circles-row { display: flex; gap: 15px; margin-left: 20px; align-items: center; }
        .circle-wrap { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .label-text { font-size: 8.5px; opacity: 0.8; margin-top: 3px; color: #7fbbff; }
        .s0 { background: rgba(255,255,255,0.05); } .s1 { background: var(--dark-green); } .s2 { background: var(--light-green); } .s3 { background: var(--red); } .s4 { background: var(--orange); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; overflow-y: auto; padding-top: 20px; }
        .modal-content { background: #082d42; margin: 0 auto; padding: 15px; width: 95%; max-width: 380px; border-radius: 15px; border: 1px solid var(--blue); position: relative; }
        .close-x { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 50%; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 10px; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1); }
        input[type="text"], input[type="number"] { border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; }
        .add-btn { background: var(--dark-green); color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .settings-btn { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .menu-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); width: 100%; color: white; text-align: left; font-size: 14px; }
        .ozel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 5px; }
        .ozel-card { background: var(--card); border-radius: 10px; padding: 8px 4px; border: 1px solid rgba(255,255,255,0.1); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .sayi-input { width: 90%; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); text-align: center; padding: 6px 0; border-radius: 8px; margin: 5px auto; outline: none; }
        .monthly-report-table { width: 100% !important; margin: 0 auto; table-layout: fixed; border-collapse: separate; border-spacing: 1px 1.5px; }
        .col-gun { width: 25px; text-align: center; font-size: 10px; opacity: 0.5; padding: 0; }
        .col-vakit { height: 11px; border-radius: 2px; cursor: pointer; }
        .report-selector { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .sel-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #ccc; padding: 5px 10px; border-radius: 8px; font-size: 10px; cursor: pointer; }
        .sel-btn.active { background: var(--blue); color: white; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-box { aspect-ratio: 1; border-radius: 6px; font-size: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; position: relative; }
        .cal-box b { font-size: 10px; color: #fff; }
        .cal-box small { font-size: 7px; opacity: 0.5; position: absolute; top: 2px; left: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">Amel Defteri V.21.12</div>
    <div class="nav-header">
        <div class="date-nav">
            <button class="nav-btn" onclick="degistirTarih(-1)">❮</button>
            <div class="date-display-box">
                <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
                <div id="isToday" style="font-size: 9px; color: var(--light-green); font-weight:bold;"></div>
                <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
            </div>
            <button class="nav-btn" onclick="degistirTarih(1)">❯</button>
        </div>
        <div style="display:flex; gap:5px; align-items:center;">
            <button class="nav-btn" style="background:var(--blue); font-size: 10px;" onclick="showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 10px;" onclick="showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>
    <div id="vakitList"></div>
    <div id="ozelList" class="ozel-grid"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal()">✕</button>
        <div id="statTitle"></div>
        <div id="calGrid"></div>
        <button class="add-btn" style="width:100%; background:var(--red); margin-top:15px;" onclick="closeModal()">KAPAT</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeSettings()">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar & Veri</h3>
        <button class="menu-item" onclick="exportData()">💾 Verileri Yedekle (.json)</button>
        <button class="menu-item" onclick="importData()">📂 Yedekten Geri Yükle</button>
        <button id="pwaBtn" class="menu-item" style="display:none;" onclick="installPWA()">📲 Uygulama Olarak Yükle</button>
        <div style="font-size:10px; opacity:0.5; text-align:center; margin-top:20px;">Versiyon 21.12 - 2026</div>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel ekle...">
    <button class="add-btn" onclick="yeniEkle()">EKLE</button>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
    <input type="file" id="fileInp" style="display:none" onchange="processFile(this)">
</div>

<script>
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let genRaporTipIdx = 0;
    let deferredPrompt;

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }
    function saveGlobalOzeller(l) { localStorage.setItem('amel_global_ozeller', JSON.stringify(l)); }

    function veriYukle() {
        const key = getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const globalListe = getGlobalOzeller();
        if (kaydedilmis) {
            gunlukVeriler = kaydedilmis;
            gunlukVeriler.vakitler.forEach((v, i) => v.ad = vakitler[i]);
            const kaydedilmisIdler = (kaydedilmis.ozeller || []).map(o => o.id);
            globalListe.filter(g => !g.arsiv && !kaydedilmisIdler.includes(g.id)).forEach(g => {
                gunlukVeriler.ozeller.push({ ...g, durum: 0 });
            });
        } else {
            gunlukVeriler = { 
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
                ozeller: globalListe.filter(g => !g.arsiv).map(g => ({ ...g, durum: 0 }))
            };
        }
        render();
    }

    function render() {
        localStorage.setItem(getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
        document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('isToday').innerText = (getLocalKey(new Date()) === getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' }).toUpperCase();
        
        const vDiv = document.getElementById('vakitList');
        vDiv.innerHTML = '';
        gunlukVeriler.vakitler.forEach((v, vIdx) => {
            let boxClass = "box-default";
            const farz = v.durumlar[0], sunnet = v.durumlar[1], tesbih = v.durumlar[2];
            if (farz === 3) boxClass = "box-danger";
            else if ((farz === 1 || farz === 2 || farz === 4) && (sunnet === 1 || sunnet === 2) && (tesbih === 1 || tesbih === 2)) boxClass = "box-success";

            let row = `<div class="habit-card">
                <div class="vakit-isim-box ${boxClass}"><span class="vakit-ad">${v.ad}</span></div>
                <div class="circles-row">`;
            basliklar.forEach((b, bIdx) => {
                row += `<div class="circle-wrap"><div class="circle s${v.durumlar[bIdx]}" onclick="window.degis(${vIdx}, ${bIdx}, 'vakit')"></div><span class="label-text" onclick="window.showStats('${v.ad} ${b}', 'vakit', ${vIdx}, ${bIdx})">${b}</span></div>`;
            });
            vDiv.innerHTML += row + `</div></div>`;
        });

        const oDiv = document.getElementById('ozelList');
        oDiv.innerHTML = "";
        gunlukVeriler.ozeller.forEach((o, oIdx) => {
            const globalListe = getGlobalOzeller();
            if (globalListe.find(g => g.id === o.id && g.arsiv) && (o.durum == 0 || o.durum == "")) return;
            let ctrl = o.tip === 'sayi' ? `<input type="number" value="${o.durum}" class="sayi-input" onchange="window.sayiGuncelle(${oIdx}, this.value)">` : `<div style="display:flex; justify-content:center; padding:5px;"><div class="circle s${o.durum}" onclick="window.degis(${oIdx}, 0, 'ozel_renk')"></div></div>`;
            oDiv.innerHTML += `<div class="ozel-card"><b style="font-size:11px; cursor:pointer;" onclick="window.showStats('${o.ad.replace(/'/g,"\\'")}', 'ozel', 0, 0, '${o.id}')">${o.ad}</b>${ctrl}<small onclick="window.silSecenekleri('${o.id}')" style="opacity:0.3; font-size:9px; cursor:pointer;">Arşiv</small></div>`;
        });
    }

    window.showHelp = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        document.getElementById('statTitle').innerHTML = `<h3 style="text-align:center; color:#7fbbff; margin:0; padding-right:20px;">Rehber</h3>`;
        grid.innerHTML = `<div style="padding:10px; font-size:12px; line-height:1.6; max-height:60vh; overflow-y:auto;">
            <p><b>NAMAZ İSİMLERİ:</b><br><span style="color:#90ee90">■</span> Hepsi yeşilse <b>Soft Yeşil</b> olur.<br><span style="color:#e74c3c">■</span> Farz kırmızıysa <b>Soft Kırmızı</b> olur.</p>
            <p><b>FARZ NAMAZLAR:</b><br><span class="circle s1" style="width:12px; height:12px; display:inline-block;"></span> <b>Koyu Yeşil:</b> Vaktinde kılındı.<br><span class="circle s2" style="width:12px; height:12px; display:inline-block;"></span> <b>Açık Yeşil:</b> Cemaatle kılındı.<br><span class="circle s4" style="width:12px; height:12px; display:inline-block;"></span> <b>Turuncu:</b> Kaza edildi.<br><span class="circle s3" style="width:12px; height:12px; display:inline-block;"></span> <b>Kırmızı:</b> Kazaya kaldı.</p>
            <p><b>SÜNNET VE TESBİHAT:</b><br><span class="circle s1" style="width:12px; height:12px; display:inline-block;"></span> <b>Koyu Yeşil:</b> Yapıldı.<br><span class="circle s2" style="width:12px; height:12px; display:inline-block;"></span> <b>Açık Yeşil:</b> Geniş yapıldı.<br><span class="circle s3" style="width:12px; height:12px; display:inline-block;"></span> <b>Kırmızı:</b> Yapılmadı.</p>
        </div>`;
        modal.style.display = 'block';
    };

    window.showGeneralReport = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-right:25px;"><button class="nav-btn" onclick="window.ayRaporuDegis(-1)">❮</button><span style="font-size:14px;">Aylık Rapor (${ayYilStr})</span><button class="nav-btn" onclick="window.ayRaporuDegis(1)">❯</button></div>
        <div class="report-selector">${basliklar.map((b,i)=>`<button class="sel-btn ${genRaporTipIdx===i?'active':''}" onclick="window.setGenRaporTip(${i})">${b}</button>`).join('')}</div>`;
        let th = `<table class="monthly-report-table"><thead><tr><th class="col-gun"></th><th>S</th><th>Ö</th><th>İ</th><th>A</th><th>Y</th></tr></thead><tbody>`;
        let son = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= son; d++) {
            let t = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d);
            let v = JSON.parse(localStorage.getItem(getLocalKey(t)));
            th += `<tr><td class="col-gun">${d}</td>`;
            for (let i = 0; i < 5; i++) {
                let dur = (v && v.vakitler[i]) ? (v.vakitler[i].durumlar[genRaporTipIdx] || 0) : 0;
                th += `<td class="col-vakit s${dur}" onclick="window.gitTarih(${d})"></td>`;
            }
            th += `</tr>`;
        }
        grid.innerHTML = th + `</tbody></table>`;
        modal.style.display = 'block';
    };

    window.showStats = (ad, tip, vIdx, bIdx = 0, id = '') => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; margin-bottom:10px; padding-right:25px;"><div style="display:flex; justify-content:space-between; width:100%; align-items:center;"><button class="nav-btn" onclick="window.ayDegis(-1,'${ad.replace(/'/g,"\\'")}','${tip}',${vIdx},${bIdx},'${id}')">❮</button><span>${ad}</span><button class="nav-btn" onclick="window.ayDegis(1,'${ad.replace(/'/g,"\\'")}','${tip}',${vIdx},${bIdx},'${id}')">❯</button></div><div style="font-size:12px; color:var(--blue); margin-top:5px; font-weight:bold;">${ayYilStr}</div></div>`;
        let gridHtml = `<div class="calendar-grid">`;
        let son = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= son; d++) {
            let t = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d);
            let v = JSON.parse(localStorage.getItem(getLocalKey(t)));
            let val = "", cls = "s0", lab = `<small>${d}</small>`;
            if (v) {
                if (tip === 'vakit') {
                    cls = "s" + (v.vakitler[vIdx].durumlar[bIdx] || 0);
                } else { 
                    let o = (v.ozeller || []).find(x => x.id === id || x.ad === ad); 
                    if (o && ((o.tip === 'sayi' && parseFloat(o.durum) > 0) || (o.tip !== 'sayi' && o.durum > 0))) { 
                        cls = o.tip === 'sayi' ? 's2' : 's' + o.durum; 
                        if(o.tip === 'sayi') val = `<b>${o.durum}</b>`; 
                    } 
                }
            }
            gridHtml += `<div class="cal-box ${cls}" onclick="window.gitTarih(${d})">${lab}${val}</div>`;
        }
        grid.innerHTML = gridHtml + `</div>`;
        modal.style.display = 'block';
    };

    window.showYearlyReport = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const yil = raporTarih.getFullYear();
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-right:25px;"><button class="nav-btn" onclick="window.yilDegis(-1)">❮</button><b>${yil} ÖZETİ</b><button class="nav-btn" onclick="window.yilDegis(1)">❯</button></div>`;
        let kazaSayilari = { "Sabah Namazı": 0, "Öğle Namazı": 0, "İkindi Namazı": 0, "Akşam Namazı": 0, "Yatsı Namazı": 0 };
        let arsivAmeller = {};
        for (let m = 0; m < 12; m++) {
            let son = new Date(yil, m + 1, 0).getDate();
            for (let d = 1; d <= son; d++) {
                let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(yil, m, d))));
                if (!v) continue;
                v.vakitler.forEach((vk) => { if(vk.durumlar[0] === 3) kazaSayilari[vk.ad]++; });
                if (v.ozeller) {
                    v.ozeller.forEach(vo => {
                        const globalListe = getGlobalOzeller();
                        const arsivdenBul = globalListe.find(g => g.id === vo.id && g.arsiv);
                        if (arsivdenBul) {
                            if (!arsivAmeller[vo.ad]) arsivAmeller[vo.ad] = { toplam: 0, tip: vo.tip };
                            if (vo.tip === 'sayi') arsivAmeller[vo.ad].toplam += parseFloat(vo.durum || 0);
                            else if (vo.durum > 0) arsivAmeller[vo.ad].toplam += 1;
                        }
                    });
                }
            }
        }
        let h = `<div style="max-height:60vh; overflow-y:auto; padding:5px;"><table style="width:100%; font-size:12px; margin-bottom:15px;"><thead><tr style="color:var(--red);"><th style="text-align:left;">KAZA NAMAZLARI</th><th style="text-align:right;">TOPLAM</th></tr></thead><tbody>`;
        Object.keys(kazaSayilari).forEach(v => { h += `<tr><td>${v}</td><td style="text-align:right; font-weight:bold;">${kazaSayilari[v]}</td></tr>`; });
        h += `</tbody></table><table style="width:100%; font-size:12px;"><thead><tr style="color:var(--blue);"><th style="text-align:left;">ARŞİVLENENLER</th><th style="text-align:right;">SONUÇ</th></tr></thead><tbody>`;
        const keys = Object.keys(arsivAmeller);
        if (keys.length === 0) h += `<tr><td colspan="2" style="text-align:center; opacity:0.5; padding:10px;">Arşiv verisi yok.</td></tr>`;
        else keys.sort().forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right; font-weight:bold;">${arsivAmeller[k].toplam}${arsivAmeller[k].tip === 'sayi' ? '' : ' Gün'}</td></tr>`; });
        grid.innerHTML = h + `</tbody></table></div>`;
        modal.style.display = 'block';
    };

    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('pwaBtn').style.display = 'block'; });
    window.installPWA = () => { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { document.getElementById('pwaBtn').style.display = 'none'; deferredPrompt = null; }); };
    window.openSettings = () => { document.getElementById('settingsModal').style.display = 'block'; };
    window.closeSettings = () => { document.getElementById('settingsModal').style.display = 'none'; };
    window.tarihSec = (val) => { if(val) { seciliTarih = new Date(val); veriYukle(); } };
    window.degis = (i, s, t) => {
        if (t === 'ozel_renk') gunlukVeriler.ozeller[i].durum = (gunlukVeriler.ozeller[i].durum + 1) % 5;
        else {
            let d = gunlukVeriler.vakitler[i].durumlar[s];
            if (s === 0) { if (d === 0) d = 1; else if (d === 1) d = 2; else if (d === 2) d = 4; else if (d === 4) d = 3; else d = 0; }
            else if (s === 1) { if (d === 0) d = 1; else if (d === 1) d = 3; else d = 0; }
            else if (s === 2) { if (d === 0) d = 1; else if (d === 1) d = 2; else if (d === 2) d = 3; else d = 0; }
            gunlukVeriler.vakitler[i].durumlar[s] = d;
        }
        render();
    };
    window.ayDegis = (n, ad, t, vi, bi, id) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showStats(ad, t, vi, bi, id); };
    window.ayRaporuDegis = (n) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showGeneralReport(); };
    window.yilDegis = (n) => { raporTarih.setFullYear(raporTarih.getFullYear()+n); window.showYearlyReport(); };
    window.gitTarih = (d) => { seciliTarih = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d); closeModal(); veriYukle(); };
    window.setGenRaporTip = (idx) => { genRaporTipIdx = idx; window.showGeneralReport(); };
    window.closeModal = () => { document.getElementById('statModal').style.display = 'none'; raporTarih = new Date(); };
    window.degistirTarih = (n) => { seciliTarih.setDate(seciliTarih.getDate() + n); veriYukle(); };
    window.yeniEkle = () => { const ad = document.getElementById('habInp').value; if(!ad) return; let g = getGlobalOzeller(); g.push({ id: 'id' + Date.now(), ad, tip: confirm("Sayısal veri mi?") ? 'sayi' : 'renk', arsiv: false }); saveGlobalOzeller(g); document.getElementById('habInp').value = ""; veriYukle(); };
    window.silSecenekleri = (id) => { if(confirm("Arşivlensin mi?")) { let g = getGlobalOzeller(); let idx = g.findIndex(x => x.id === id); if(idx > -1) g[idx].arsiv = true; saveGlobalOzeller(g); veriYukle(); } };
    window.sayiGuncelle = (i, v) => { gunlukVeriler.ozeller[i].durum = v; render(); };
    window.exportData = () => { let all = {}; for(let i=0; i<localStorage.length; i++){ let key = localStorage.key(i); if(key && key.startsWith('amel_')) all[key] = localStorage.getItem(key); } let blob = new Blob([JSON.stringify(all)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `amel_yedek.json`; a.click(); };
    window.importData = () => { document.getElementById('fileInp').click(); };
    window.processFile = (inp) => { let fr = new FileReader(); fr.onload = () => { let data = JSON.parse(fr.result); Object.keys(data).forEach(k => localStorage.setItem(k, data[k])); location.reload(); }; fr.readAsText(inp.files[0]); };
    veriYukle();
</script>
</body>
</html>
