<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Amel Defteri V.21.14</title>
    
    <link rel="manifest" href="manifest.json">

    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; }
        * { box-sizing: border-box; }
        
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .main-title { text-align: center; font-size: 18px; font-weight: bold; color: #7fbbff; margin-bottom: 10px; text-transform: uppercase; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px; border-radius: 20px; margin-bottom: 8px; width: 100%; }
        .date-nav { display: flex; align-items: center; gap: 5px; }
        .date-display-box { text-align: center; cursor: pointer; padding: 5px 10px; border-radius: 10px; position: relative; background: rgba(255,255,255,0.05); min-width: 90px; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; border: none; }
        
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 10px; border-radius: 12px; cursor: pointer; font-size: 13px; z-index: 5; }
        .info-btn { background: var(--blue); width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; width: 100%; }
        .vakit-isim-box { padding: 6px 5px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 90px; text-align: center; }
        .vakit-ad { font-weight: bold; color: #fff; font-size: 0.7rem; }
        .circles-row { display: flex; gap: 12px; margin-left: auto; align-items: center; }
        
        /* Ana Ekran 3'lü Izgara - Yapı Korundu */
        .ozel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 5px; width: 100%; }
        .ozel-card { background: var(--card); border-radius: 10px; padding: 8px 2px; border: 1px solid rgba(255,255,255,0.1); text-align: center; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; min-width: 0; }
        
        /* Sayısal Giriş Taşma Engeli */
        .sayi-input { width: 90%; max-width: 70px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); text-align: center; padding: 6px 0; border-radius: 8px; margin: 5px auto; outline: none; font-size: 12px; }
        
        .box-default { background: rgba(127, 187, 255, 0.15); }
        .box-success { background: rgba(144, 238, 144, 0.25); border-color: rgba(144, 238, 144, 0.4); }
        .box-danger { background: rgba(231, 76, 60, 0.25); border-color: rgba(231, 76, 60, 0.4); }
        .circle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .label-text { font-size: 8px; opacity: 0.8; margin-top: 3px; color: #7fbbff; }
        
        /* Modal ve Footer Sabitleme */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; overflow-y: auto; padding: 15px; }
        .modal-content { background: #082d42; margin: 0 auto; padding: 15px; width: 100%; max-width: 450px; border-radius: 15px; border: 1px solid var(--blue); position: relative; }
        
        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 8px; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1); border-radius: 15px 15px 0 0; }
        input[type="text"] { flex: 1; border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; min-width: 0; }
        
        .monthly-report-table { width: 100%; border-collapse: separate; border-spacing: 1px; table-layout: fixed; }
        .col-gun { width: 22px; text-align: center; font-size: 9px; opacity: 0.5; }
        .col-vakit { height: 14px; border-radius: 2px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; width: 100%; }
        .cal-box { aspect-ratio: 1; border-radius: 6px; font-size: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">Amel Defteri V.21.14</div>
    <div class="nav-header">
        <div class="date-nav">
            <button class="nav-btn" onclick="degistirTarih(-1)">❮</button>
            <div class="date-display-box">
                <div id="dispDate" style="font-weight: bold; font-size: 13px;"></div>
                <div id="isToday" style="font-size: 9px; color: var(--light-green); font-weight:bold;"></div>
                <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
            </div>
            <button class="nav-btn" onclick="degistirTarih(1)">❯</button>
        </div>
        <div style="display:flex; gap:4px; align-items:center;">
            <button class="nav-btn" style="background:var(--blue); font-size: 9px;" onclick="showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 9px;" onclick="showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>
    <div id="vakitList"></div>
    <div id="ozelList" class="ozel-grid"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <button onclick="closeModal()" style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 20px; cursor: pointer;">✕</button>
        <div id="statTitle"></div>
        <div id="calGrid"></div>
        <button class="nav-btn" style="width:100%; background:var(--red); margin-top:15px; padding: 12px;" onclick="closeModal()">KAPAT</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button onclick="closeSettings()" style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 20px; cursor: pointer;">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
        <button class="nav-btn" style="width:100%; margin-bottom:10px; text-align:left; padding:15px;" onclick="exportData()">💾 Verileri Yedekle (.json)</button>
        <button class="nav-btn" style="width:100%; margin-bottom:10px; text-align:left; padding:15px;" onclick="importData()">📂 Yedekten Geri Yükle</button>
        <div id="pwaBtn" style="display:none;"><button class="nav-btn" style="width:100%; text-align:left; padding:15px; background:var(--dark-green);" onclick="installPWA()">📲 Uygulama Olarak Yükle</button></div>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel...">
    <button class="nav-btn" style="background:var(--dark-green); padding:10px 15px; border-radius:20px;" onclick="yeniEkle()">EKLE</button>
    <button onclick="openSettings()" style="background:none; border:none; font-size:20px; cursor:pointer;">⚙️</button>
    <input type="file" id="fileInp" style="display:none" onchange="processFile(this)">
</div>

<script>
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let genRaporTipIdx = 0;
    let deferredPrompt;

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }
    function saveGlobalOzeller(l) { localStorage.setItem('amel_global_ozeller', JSON.stringify(l)); }

    function veriYukle() {
        const key = getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const globalListe = getGlobalOzeller();
        if (kaydedilmis) {
            gunlukVeriler = kaydedilmis;
            gunlukVeriler.vakitler.forEach((v, i) => v.ad = vakitler[i]);
            const kaydedilmisIdler = (kaydedilmis.ozeller || []).map(o => o.id);
            globalListe.filter(g => !g.arsiv && !kaydedilmisIdler.includes(g.id)).forEach(g => {
                gunlukVeriler.ozeller.push({ ...g, durum: 0 });
            });
        } else {
            gunlukVeriler = { 
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
                ozeller: globalListe.filter(g => !g.arsiv).map(g => ({ ...g, durum: 0 }))
            };
        }
        render();
    }

    function render() {
        localStorage.setItem(getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
        document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('isToday').innerText = (getLocalKey(new Date()) === getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' }).toUpperCase();
        
        const vDiv = document.getElementById('vakitList');
        vDiv.innerHTML = '';
        gunlukVeriler.vakitler.forEach((v, vIdx) => {
            let boxClass = "box-default";
            const farz = v.durumlar[0], sunnet = v.durumlar[1], tesbih = v.durumlar[2];
            if (farz === 3) boxClass = "box-danger";
            else if ((farz === 1 || farz === 2 || farz === 4) && (sunnet === 1 || sunnet === 2) && (tesbih === 1 || tesbih === 2)) boxClass = "box-success";

            vDiv.innerHTML += `<div class="habit-card">
                <div class="vakit-isim-box ${boxClass}"><span class="vakit-ad">${v.ad}</span></div>
                <div class="circles-row">
                    ${basliklar.map((b, bIdx) => `
                        <div style="text-align:center">
                            <div class="circle s${v.durumlar[bIdx]}" onclick="window.degis(${vIdx}, ${bIdx}, 'vakit')"></div>
                            <div class="label-text" onclick="window.showStats('${v.ad} ${b}', 'vakit', ${vIdx}, ${bIdx})">${b}</div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        });

        const oDiv = document.getElementById('ozelList');
        oDiv.innerHTML = "";
        gunlukVeriler.ozeller.forEach((o, oIdx) => {
            const globalListe = getGlobalOzeller();
            if (globalListe.find(g => g.id === o.id && g.arsiv) && (o.durum == 0 || o.durum == "")) return;
            let ctrl = o.tip === 'sayi' ? `<input type="number" value="${o.durum}" class="sayi-input" onchange="window.sayiGuncelle(${oIdx}, this.value)">` : `<div style="display:flex; justify-content:center; padding:5px;"><div class="circle s${o.durum}" onclick="window.degis(${oIdx}, 0, 'ozel_renk')"></div></div>`;
            oDiv.innerHTML += `<div class="ozel-card">
                <b style="font-size:10px; cursor:pointer;" onclick="window.showStats('${o.ad.replace(/'/g,"\\'")}', 'ozel', 0, 0, '${o.id}')">${o.ad}</b>
                ${ctrl}
                <small onclick="window.silSecenekleri('${o.id}')" style="opacity:0.3; font-size:8px; cursor:pointer;">Arşiv</small>
            </div>`;
        });
    }

    window.showHelp = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        document.getElementById('statTitle').innerHTML = `<h3 style="text-align:center; color:#7fbbff;">Rehber</h3>`;
        grid.innerHTML = `<div style="font-size:12px; line-height:1.5;">
            <p><span style="color:#90ee90">■</span> Hepsi yeşilse <b>Soft Yeşil</b> olur.<br><span style="color:#e74c3c">■</span> Farz kırmızıysa <b>Soft Kırmızı</b> olur.</p>
        </div>`;
        modal.style.display = 'block';
    };

    window.showGeneralReport = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button class="nav-btn" onclick="window.ayRaporuDegis(-1)">❮</button>
            <span>${ayYilStr}</span>
            <button class="nav-btn" onclick="window.ayRaporuDegis(1)">❯</button>
        </div>
        <div style="display:flex; justify-content:center; gap:5px; margin-bottom:10px;">
            ${basliklar.map((b,i)=>`<button class="nav-btn ${genRaporTipIdx===i?'active':''}" style="font-size:10px; background:${genRaporTipIdx===i? 'var(--blue)':'rgba(255,255,255,0.1)'}" onclick="window.setGenRaporTip(${i})">${b}</button>`).join('')}
        </div>`;
        let table = `<table class="monthly-report-table"><thead><tr><th class="col-gun"></th><th>S</th><th>Ö</th><th>İ</th><th>A</th><th>Y</th></tr></thead><tbody>`;
        let son = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= son; d++) {
            let t = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d);
            let v = JSON.parse(localStorage.getItem(getLocalKey(t)));
            table += `<tr><td class="col-gun">${d}</td>`;
            for (let i = 0; i < 5; i++) {
                let dur = (v && v.vakitler[i]) ? (v.vakitler[i].durumlar[genRaporTipIdx] || 0) : 0;
                table += `<td class="col-vakit s${dur}" onclick="window.gitTarih(${d})"></td>`;
            }
            table += `</tr>`;
        }
        grid.innerHTML = table + `</tbody></table>`;
        modal.style.display = 'block';
    };

    window.showStats = (ad, tip, vIdx, bIdx = 0, id = '') => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button class="nav-btn" onclick="window.ayDegis(-1,'${ad.replace(/'/g,"\\'")}','${tip}',${vIdx},${bIdx},'${id}')">❮</button>
            <span style="font-size:13px;">${ad}</span>
            <button class="nav-btn" onclick="window.ayDegis(1,'${ad.replace(/'/g,"\\'")}','${tip}',${vIdx},${bIdx},'${id}')">❯</button>
        </div><div style="text-align:center; font-size:11px; margin-bottom:10px;">${ayYilStr}</div>`;
        let gridHtml = `<div class="calendar-grid">`;
        let son = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= son; d++) {
            let t = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d);
            let v = JSON.parse(localStorage.getItem(getLocalKey(t)));
            let val = "", cls = "s0";
            if (v) {
                if (tip === 'vakit') cls = "s" + (v.vakitler[vIdx].durumlar[bIdx] || 0);
                else { 
                    let o = (v.ozeller || []).find(x => x.id === id || x.ad === ad); 
                    if (o && ((o.tip === 'sayi' && parseFloat(o.durum) > 0) || (o.tip !== 'sayi' && o.durum > 0))) { 
                        cls = o.tip === 'sayi' ? 's2' : 's' + o.durum; 
                        if(o.tip === 'sayi') val = `<b>${o.durum}</b>`; 
                    } 
                }
            }
            gridHtml += `<div class="cal-box ${cls}" onclick="window.gitTarih(${d})"><small style="position:absolute; top:1px; left:2px; font-size:7px; opacity:0.5;">${d}</small>${val}</div>`;
        }
        grid.innerHTML = gridHtml + `</div>`;
        modal.style.display = 'block';
    };

    window.showYearlyReport = () => {
        const modal = document.getElementById('statModal');
        const grid = document.getElementById('calGrid');
        const yil = raporTarih.getFullYear();
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <button class="nav-btn" onclick="window.yilDegis(-1)">❮</button>
            <b>${yil} ÖZETİ</b>
            <button class="nav-btn" onclick="window.yilDegis(1)">❯</button>
        </div>`;
        let kaza = { "Sabah": 0, "Öğle": 0, "İkindi": 0, "Akşam": 0, "Yatsı": 0 };
        let arsiv = {};
        for (let m = 0; m < 12; m++) {
            let son = new Date(yil, m + 1, 0).getDate();
            for (let d = 1; d <= son; d++) {
                let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(yil, m, d))));
                if (!v) continue;
                v.vakitler.forEach((vk, i) => { if(vk.durumlar[0] === 3) kaza[Object.keys(kaza)[i]]++; });
                if (v.ozeller) {
                    v.ozeller.forEach(vo => {
                        if (getGlobalOzeller().find(g => g.id === vo.id && g.arsiv)) {
                            if (!arsiv[vo.ad]) arsiv[vo.ad] = { toplam: 0, tip: vo.tip };
                            if (vo.tip === 'sayi') arsiv[vo.ad].toplam += parseFloat(vo.durum || 0);
                            else if (vo.durum > 0) arsiv[vo.ad].toplam += 1;
                        }
                    });
                }
            }
        }
        let h = `<div style="max-height:60vh; overflow-y:auto;"><table style="width:100%; font-size:12px; margin-bottom:15px;"><thead><tr style="color:var(--red);"><th style="text-align:left;">KAZA</th><th style="text-align:right;">TOPLAM</th></tr></thead><tbody>`;
        Object.keys(kaza).forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right; font-weight:bold;">${kaza[k]}</td></tr>`; });
        h += `</tbody></table><table style="width:100%; font-size:12px;"><thead><tr style="color:var(--blue);"><th style="text-align:left;">ARŞİV</th><th style="text-align:right;">SKOR</th></tr></thead><tbody>`;
        Object.keys(arsiv).sort().forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right; font-weight:bold;">${arsiv[k].toplam}${arsiv[k].tip==='sayi'?'':' G'}</td></tr>`; });
        grid.innerHTML = h + `</tbody></table></div>`;
        modal.style.display = 'block';
    };

    window.openSettings = () => { document.getElementById('settingsModal').style.display = 'block'; };
    window.closeSettings = () => { document.getElementById('settingsModal').style.display = 'none'; };
    window.closeModal = () => { document.getElementById('statModal').style.display = 'none'; raporTarih = new Date(); };
    window.tarihSec = (v) => { if(v) { seciliTarih = new Date(v); veriYukle(); } };
    window.degistirTarih = (n) => { seciliTarih.setDate(seciliTarih.getDate() + n); veriYukle(); };
    window.degis = (i, s, t) => {
        if (t === 'ozel_renk') gunlukVeriler.ozeller[i].durum = (gunlukVeriler.ozeller[i].durum + 1) % 5;
        else {
            let d = gunlukVeriler.vakitler[i].durumlar[s];
            if (s === 0) { if (d === 0) d = 1; else if (d === 1) d = 2; else if (d === 2) d = 4; else if (d === 4) d = 3; else d = 0; }
            else if (s === 1) { if (d === 0) d = 1; else if (d === 1) d = 3; else d = 0; }
            else if (s === 2) { if (d === 0) d = 1; else if (d === 1) d = 2; else if (d === 2) d = 3; else d = 0; }
            gunlukVeriler.vakitler[i].durumlar[s] = d;
        }
        render();
    };
    window.sayiGuncelle = (i, v) => { gunlukVeriler.ozeller[i].durum = v; render(); };
    window.yeniEkle = () => { const ad = document.getElementById('habInp').value; if(!ad) return; let g = getGlobalOzeller(); g.push({ id: 'id' + Date.now(), ad, tip: confirm("Sayısal veri mi?") ? 'sayi' : 'renk', arsiv: false }); saveGlobalOzeller(g); document.getElementById('habInp').value = ""; veriYukle(); };
    window.silSecenekleri = (id) => { if(confirm("Arşivlensin mi?")) { let g = getGlobalOzeller(); let idx = g.findIndex(x => x.id === id); if(idx > -1) g[idx].arsiv = true; saveGlobalOzeller(g); veriYukle(); } };
    window.ayDegis = (n, ad, t, vi, bi, id) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showStats(ad, t, vi, bi, id); };
    window.ayRaporuDegis = (n) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showGeneralReport(); };
    window.yilDegis = (n) => { raporTarih.setFullYear(raporTarih.getFullYear()+n); window.showYearlyReport(); };
    window.gitTarih = (d) => { seciliTarih = new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d); closeModal(); veriYukle(); };
    window.setGenRaporTip = (idx) => { genRaporTipIdx = idx; window.showGeneralReport(); };
    window.exportData = () => { let all = {}; for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); if(k && k.startsWith('amel_')) all[k] = localStorage.getItem(k); } let b = new Blob([JSON.stringify(all)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `amel_yedek.json`; a.click(); };
    window.importData = () => { document.getElementById('fileInp').click(); };
    window.processFile = (inp) => { let fr = new FileReader(); fr.onload = () => { let d = JSON.parse(fr.result); Object.keys(d).forEach(k => localStorage.setItem(k, d[k])); location.reload(); }; fr.readAsText(inp.files[0]); };
    
    veriYukle();
</script>
</body>
</html>
