<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b3d59">
<title>Amel Defteri V.22.23</title>

<style>
/* SENİN TÜM CSS'İN AYNI (DEĞİŞMEDİ) */
</style>
</head>

<body>

<!-- SENİN TÜM HTML YAPIN AYNI -->
<!-- SADECE MODAL ALTINA KAPAT BUTONU EKLENDİ -->

<div id="statModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal()">✕</button>
        <div id="statTitle"></div>
        <div id="calGrid"></div>

        <!-- YENİ -->
        <div style="text-align:center; margin-top:15px;">
            <button onclick="closeModal()" style="padding:6px 14px; border-radius:20px; border:none; background:#3498db; color:white; font-size:11px;">
                Kapat
            </button>
        </div>
    </div>
</div>

<div id="typeModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="document.getElementById('typeModal').style.display='none'">✕</button>

        <!-- YENİ -->
        <div style="text-align:center; margin-top:15px;">
            <button onclick="document.getElementById('typeModal').style.display='none'" style="padding:6px 14px; border-radius:20px; border:none; background:#3498db; color:white; font-size:11px;">
                Kapat
            </button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeSettings()">✕</button>

        <!-- YENİ -->
        <div style="text-align:center; margin-top:15px;">
            <button onclick="closeSettings()" style="padding:6px 14px; border-radius:20px; border:none; background:#3498db; color:white; font-size:11px;">
                Kapat
            </button>
        </div>
    </div>
</div>

<script>

/* -------------------- YENİ: UYARI DETAY -------------------- */
window.showWarningDetail = (vIdx) => {
    let wData = getWarningData(vIdx);
    if(!wData) return;

    let mesaj = `<div style="font-size:13px; line-height:1.6;">`;

    if(wData.fWarn) mesaj += "❌ Farz namazlarda son 3 gündür eksik var<br>";
    if(wData.sWarn) mesaj += "⚠️ Sünnetlerde son 3 gündür eksik var<br>";
    if(wData.tWarn) mesaj += "📿 Tesbihat son 3 gündür eksik<br>";

    mesaj += "</div>";

    document.getElementById('statTitle').innerText = "Eksik Analizi";
    document.getElementById('calGrid').innerHTML = mesaj;
    document.getElementById('statModal').style.display = 'block';
};
/* ----------------------------------------------------------- */


/* -------------------- SENİN RENDER FONKSİYONUNDA SADECE BU SATIR DEĞİŞTİ -------------------- */
/*
ESKİ:
<span class="warning-blink">⚠️</span>

YENİ:
*/
<span class="warning-blink" onclick="event.stopPropagation(); showWarningDetail(${vIdx})">⚠️</span>
/* -------------------------------------------------------------------------------------------- */


/* -------------------- YENİ: SWIPE -------------------- */
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", e => {
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
});

function handleSwipe() {
    let diff = touchStartX - touchEndX;

    if (Math.abs(diff) < 50) return;

    if (diff > 0) {
        degistirTarih(1); // sola kaydır → ileri gün
    } else {
        degistirTarih(-1); // sağa kaydır → geri gün
    }
}
/* ---------------------------------------------------- */

</script>

</body>
</html>
