<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri V.22.23</title>
    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; --today-border: #666666; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        .main-title-container { text-align: center; margin: 18px 0; cursor: pointer; }
        .main-title { display: inline-block; font-size: 22px; font-weight: 800; color: #a5d3ff; letter-spacing: 1.8px; text-transform: uppercase; text-shadow: 0 0 15px rgba(165,211,255,0.5); }
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 8px 10px; border-radius: 20px; margin-bottom: 8px; }
        .date-display-box { text-align: center; cursor: pointer; padding: 4px 10px; border-radius: 12px; position: relative; background: rgba(255,255,255,0.05); min-width: 110px; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .info-btn { background: var(--blue); width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; }
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .vakit-isim-box { padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 95px; text-align: center; background: rgba(255,255,255,0.05); position: relative; cursor: pointer; transition: all 0.3s ease; }
        .vakit-ad { font-weight: bold; font-size: 11px; color: #fff; }
        .vakit-success { background: var(--dark-green) !important; border-color: #fff !important; }
        .vakit-soft { background: var(--light-green) !important; border-color: #fff !important; color: #000 !important; }
        .vakit-danger { background: var(--red) !important; border-color: #fff !important; }
        .vakit-warn { background: var(--orange) !important; border-color: #fff !important; }
        .warning-blink { position: absolute; top: -8px; right: -5px; font-size: 14px; animation: blink 0.8s infinite; cursor: help; z-index: 5; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
        .circles-row { display: flex; gap: 8px; align-items: center; }
        .circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .label-text { font-size: 10px; font-weight: 600; opacity: 0.9; margin-top: 4px; color: #a5d3ff; display: block; text-align: center; cursor: pointer; }
        .progress-zone { width: 85px; text-align: center; margin-left: 5px; }
        .progress-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; overflow: hidden; margin: 4px 0; }
        .progress-bar { height: 100%; transition: width 0.3s; }
        .status-badge { font-size: 8px; font-weight: bold; padding: 2px 4px; border-radius: 4px; display: inline-block; text-transform: uppercase; }
        .s0 { background: rgba(255,255,255,0.05); } .s1 { background: var(--dark-green); } .s2 { background: var(--light-green); } .s3 { background: var(--red); } .s4 { background: var(--orange); }
        .genel-wrapper { width: 100%; overflow-x: auto; border-radius: 10px; background: rgba(0,0,0,0.4); padding: 5px; }
        .genel-table { border-collapse: separate; border-spacing: 2px; width: 100%; table-layout: fixed; }
        .genel-table td { height: 16px; border-radius: 2px; text-align: center; font-size: 9px; position: relative; }
        .heatmap-table td { height: 40px !important; font-size: 11px !important; font-weight: bold; }
        .day-num { position: absolute; top: 2px; left: 2px; font-size: 7px; opacity: 0.4; color: white; }
        .v-row-label-full { font-size: 9px; font-weight: bold; position: sticky; left: 0; background: #082d42; width: 65px !important; text-align: left !important; padding-left: 5px; }
        .quality-line { display: flex; gap: 2px; margin-top: 4px; height: 4px; width: 100%; }
        .q-dot { flex: 1; border-radius: 1px; height: 100%; }
        /* Yapılmış özel ameller için soft yeşil arka plan */
.ozel-kart.yapildi {
    background: rgba(144, 238, 144, 0.25) !important; /* Soft yeşil */
    background-image: none !important; /* Varsa gradyanı temizler */
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
}
        /* ÖZEL AMEL KARTI VE ARŞİV İKONU DÜZENLEMESİ */
        .ozel-kart { background: var(--card); padding: 12px 4px; border-radius: 10px; text-align: center; position: relative; }
        .ozel-name { font-size: 11px; font-weight: bold; display: block; margin-bottom: 5px; cursor: pointer; color: #a5d3ff; }
        /* Bu kısmı bul ve değerleri değiştir */
.arsiv-mini-btn {
    position: absolute;
    top: -2px;    /* 4px veya 5px olan değeri -2px yaparak yukarı taşıdık */
    right: -2px;  /* 6px veya 8px olan değeri -2px yaparak sağa taşıdık */
    font-size: 12px;
    opacity: 0.3;
    cursor: pointer;
    padding: 5px;
    transition: 0.2s;
    z-index: 5;   /* Diğer öğelerin üstünde kalması için */
}
        .arsiv-mini-btn:hover { opacity: 1; }

        .is-today-cell { outline: 2px solid var(--today-border); outline-offset: -2px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #082d42; padding: 20px; width: 90%; max-width: 400px; border-radius: 20px; border: 1px solid var(--blue); position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-mini { width: 85% !important; max-width: 350px !important; margin: auto; }
        .modal-full { width: 98% !important; max-width: 480px !important; height: auto; max-height: 90vh; overflow-y: auto; }
        .close-x { position: absolute; top: 10px; right: 10px; background: var(--red); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 8px; z-index: 1000; border-radius: 15px 15px 0 0; }
        input[type="text"] { flex: 1; border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; }
        .type-select-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .type-btn { padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-weight: bold; text-align: center; transition: all 0.2s; }
        .type-btn:hover { background: var(--blue); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dark-green); }
        input:checked + .slider:before { transform: translateX(20px); }
        .btn-close-new { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--blue); padding: 10px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 25px; width: 100%; }
        .btn-close-new:hover { background: var(--blue); color: #000; }
        /* Barın parlaması ve renklerin akması için ana animasyon */
@keyframes barParilti {
    0% { background-position: 0% 50%; box-shadow: 0 0 5px rgba(255,255,255,0.3); }
    50% { background-position: 100% 50%; box-shadow: 0 0 20px rgba(255,255,255,0.7), 0 0 30px var(--bar-ana-renk); }
    100% { background-position: 0% 50%; box-shadow: 0 0 5px rgba(255,255,255,0.3); }
}

/* Çizgili parıltı efekti için ek animasyon */
@keyframes cizgiAkis {
    from { background-position: 40px 0; }
    to { background-position: 0 0; }
}
@keyframes mermiAkis {
    0% {
        left: -100%;
        opacity: 0;
    }
    30% {
        opacity: 1;
    }
    70% {
        opacity: 1;
    }
    100% {
        left: 100%;
        opacity: 0;
    }
}    </style>
</head>
<body ontouchstart="hTS(event)" ontouchend="hTE(event)">
<div class="container">
    <div class="main-title-container" onclick="window.gitBugun()">
        <span class="main-title">Amel Defteri</span><span style="font-size:9px; opacity:0.4; vertical-align:super; margin-left:4px;">V.22.23</span>
    </div>
    <div class="nav-header">
        <button class="nav-btn" onclick="degistirTarih(-1)">❮</button>
        <div class="date-display-box">
            <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
            <div id="isToday" style="font-size: 9px; color: var(--light-green); font-weight:bold;"></div>
            <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
        </div>
        <button class="nav-btn" onclick="degistirTarih(1)">❯</button>
        <div style="display:flex; gap:4px; margin-left:5px;">
            <button class="nav-btn" style="background:var(--blue); font-size: 9px; padding: 8px;" onclick="showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 9px; padding: 8px;" onclick="showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>
    <div id="vakitList"></div>
    <div id="ozelList" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; margin-top:5px;"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <div id="statTitle" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#a5d3ff; text-transform:uppercase;"></div>
        <div id="calGrid"></div>
        <button class="btn-close-new" onclick="closeModal()">Kapat</button>
    </div>
</div>

<div id="typeModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--blue); margin-top:10px;">Amel Tipi Seçin</h3>
        <p id="pendingAmelAd" style="text-align:center; font-size:12px; opacity:0.7;"></p>
        <div class="type-select-btns">
            <div class="type-btn" onclick="finalEkle('renk')">🔵 Renk Bazlı (Daire)</div>
            <div class="type-btn" onclick="finalEkle('sayi')">🔢 Sayı Bazlı (Miktar)</div>
        </div>
        <div style="margin-top: 25px;">
            <button class="btn-close-new" onclick="document.getElementById('typeModal').style.display='none'">VAZGEÇ</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeSettings()">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
       <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:15px;">
            <span style="font-size:14px; font-weight:bold;">Farkındalık Sinyalleri (⚠️)</span>
            <label class="switch">
                <input type="checkbox" id="signalToggle" onchange="toggleSignals(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button class="nav-btn" style="width:100%; margin-bottom:10px;" onclick="exportData()">💾 Yedekle</button>
        <button class="nav-btn" style="width:100%;" onclick="importData()">📂 Geri Yükle</button>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel/görev...">
    <button class="nav-btn" style="background:var(--dark-green); font-weight:bold;" onclick="yeniEkle()">EKLE</button>
    <button id="micBtn" onclick="window.sesDinle()" style="background:none; border:none; font-size:22px; cursor:pointer; transition: 0.3s;">🎤</button>
    
    <div class="menu-item" onclick="window.analizEt()" title="Analiz">📊</div>

    <div class="nav-item" style="flex:1; display:flex; flex-direction:column; align-items:center; cursor:pointer;">
        <button onclick="event.stopPropagation(); openSettings()" style="background:none; border:none; font-size:22px;">⚙️</button>
    </div>
</div>

<div onclick="window.showModernReport()" style="position: fixed; bottom: 85px; right: 20px; width: 50px; height: 50px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 999; border: 2px solid rgba(255,255,255,0.2);">
    ⚡
</div>
<script>
    let xS = null;
    function hTS(e) { xS = e.touches[0].clientX; }
    function hTE(e) {
        if (!xS || document.getElementById('statModal').style.display === 'block') return;
        let xD = xS - e.changedTouches[0].clientX;
        if (Math.abs(xD) > 70) { 
            if (xD > 0) degistirTarih(1); else degistirTarih(-1);
        }
        xS = null;
    }
    window.showVDetail = (e, vIdx) => {
        e.stopPropagation();
        let res = "";
        for(let i=1; i<=2; i++){
            let d = new Date(seciliTarih); d.setDate(d.getDate()-i);
            let v = JSON.parse(localStorage.getItem(getLocalKey(d)));
            let eksikler = v ? v.vakitler[vIdx].durumlar.map((s,idx)=>s===0?basliklar[idx]:null).filter(n=>n) : ["Kayıt Yok"];
            res += `<p style='border-bottom:1px solid rgba(255,255,255,0.1); padding:5px;'><b>${d.getDate()}/${d.getMonth()+1}:</b> ${eksikler.length?eksikler.join(", "):"Eksik Yok"}</p>`;
        }
        document.getElementById('statTitle').innerText = vakitler[vIdx] + " Uyarı Sebebi";
        document.getElementById('calGrid').innerHTML = `<div style='font-size:13px; text-align:left;'>Bu vakit son 2 gündür aksatıldığı için uyarı veriliyor:<br><br>${res}</div>`;
        document.getElementById('statModal').style.display = 'flex';
    }
    window.showODetail = (e, oIdx) => {
        e.stopPropagation();
        let ozel = gunlukVeriler.ozeller[oIdx];
        document.getElementById('statTitle').innerText = ozel.ad + " Uyarı Sebebi";
        document.getElementById('calGrid').innerHTML = `<div style='font-size:13px; text-align:left;'>Bu amel son 2 gündür boş geçildiği için dikkat çekmek amacıyla yanıp sönüyor.</div>`;
        document.getElementById('statModal').style.display = 'flex';
    }
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let signalsActive = localStorage.getItem('amel_signals_active') !== 'false';
    let pendingName = "";
    let currentHeatmapId = null;
    let currentHeatmapType = null;
    let currentHeatmapSubIdx = null;

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }
    function toggleSignals(val) { signalsActive = val; localStorage.setItem('amel_signals_active', val); render(); }
    function isTodayCheck(d, m, y) { let today = new Date(); return d === today.getDate() && m === today.getMonth() && y === today.getFullYear(); }
    function isFuture() { let today = new Date(); today.setHours(0,0,0,0); let check = new Date(seciliTarih); check.setHours(0,0,0,0); return check > today; }

    function getWarningData(vIdx) {
        if(!signalsActive || isFuture()) return null;
        const bugunDurum = gunlukVeriler.vakitler[vIdx].durumlar;
        let streaks = [0, 0, 0];
        for(let i=1; i<=3; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.vakitler[vIdx]) {
                const dur = val.vakitler[vIdx].durumlar;
                if(dur[0] === 0 || dur[0] === 3) streaks[0]++;
                if(dur[1] === 0) streaks[1]++;
                if(dur[2] === 0) streaks[2]++;
            } else { streaks[0]++; streaks[1]++; streaks[2]++; }
        }
        let fWarn = (streaks[0] >= 3 && (bugunDurum[0] === 0 || bugunDurum[0] === 3));
        let sWarn = (streaks[1] >= 3 && bugunDurum[1] === 0);
        let tWarn = (streaks[2] >= 3 && bugunDurum[2] === 0);
        return (fWarn || sWarn || tWarn) ? {streaks, fWarn, sWarn, tWarn} : null;
    }

    function getOzelWarning(ozelIdx) {
        if(!signalsActive || isFuture()) return false;
        const ozelBugun = gunlukVeriler.ozeller[ozelIdx];
        if(!ozelBugun || (ozelBugun.durum != 0 && ozelBugun.durum !== "")) return false;
        let count = 0;
        for(let i=1; i<=2; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.ozeller) {
                let o = val.ozeller.find(x => x.ad === ozelBugun.ad);
                if(!o || o.durum == 0 || o.durum === "" || o.durum === 0) count++;
            } else { count++; }
        }
        return count >= 2;
    }
window.analizEt = function() {
    let veriler = [];
    let bugun = new Date();
    const vakitAdlari = ["Sabah", "Öğle", "İkindi", "Akşam", "Yatsı"];
    for (let i = 0; i < 30; i++) {
        let d = new Date(); d.setDate(bugun.getDate() - i);
        let k = getLocalKey(d);
        let v = JSON.parse(localStorage.getItem(k));
        if (v) veriler.push({ fark: i, veri: v });
    }
    if (veriler.length < 3) { alert("Analiz için birkaç günlük veri girişi yapılmış olmalı hocam."); return; }
    let stats = {
        son: { cemaat: 0, sunnet: 0, tesbihat: 0, kaza: [0,0,0,0,0], ozeller: {}, puan: 0, gun: 0 },
        once: { cemaat: 0, sunnet: 0, tesbihat: 0, kaza: [0,0,0,0,0], ozeller: {}, puan: 0, gun: 0 }
    };
    veriler.forEach(item => {
        let s = (item.fark < 15) ? stats.son : stats.once;
        s.gun++;
        item.veri.vakitler.forEach((v, idx) => {
            if (v.durumlar[0] === 2) s.cemaat++;
            if (v.durumlar[1] > 0) s.sunnet++;
            if (v.durumlar[2] > 0) s.tesbihat++;
            if (v.durumlar[0] === 4) s.kaza[idx]++;
            let p = (v.durumlar[0] === 1 || v.durumlar[0] === 2 ? 50 : (v.durumlar[0] === 4 ? 30 : 0));
            p += (v.durumlar[1] > 0 ? 25 : 0) + (v.durumlar[2] > 0 ? 25 : 0);
            s.puan += p;
        });
        item.veri.ozeller.forEach(o => {
            if (!s.ozeller[o.ad]) s.ozeller[o.ad] = { yapildi: 0, miktar: 0 };
            if (o.durum > 0) s.ozeller[o.ad].yapildi++;
            if (o.tip === 'sayi') s.ozeller[o.ad].miktar += Number(o.durum || 0);
        });
    });
    const sonOrt = Math.round(stats.son.puan / (stats.son.gun * 5 || 1));
    const onceOrt = Math.round(stats.once.puan / (stats.once.gun * 5 || 1));
    let h = `<div style="text-align:left; font-size:13px; color:#eee; max-height:70vh; overflow-y:auto; padding-right:5px;">`;
    h += `<h3 style="color:#a5d3ff; text-align:center; margin-bottom:15px;">📊 BÜTÜNCÜL MANEVİ ANALİZ</h3>`;
    h += `<div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:12px; margin-bottom:15px; border:1px solid rgba(255,255,255,0.1);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; opacity:0.7;">GENEL DİSİPLİN PUANI</span>
                <b style="color:${sonOrt >= onceOrt ? 'var(--light-green)' : 'var(--red)'}; font-size:18px;">%${sonOrt} ${sonOrt >= onceOrt ? '↑' : '↓'}</b>
            </div>
          </div>`;
    vakitAdlari.forEach((ad, i) => { if (stats.son.kaza[i] > stats.once.kaza[i]) h += alertBox("orange", `🟠 ${ad} Namazı Alarmı`, `Son 15 günde ${ad} vaktini vaktinde kılmak yerine "Kaza" (turuncu) olarak tamamlama eğiliminiz artmış.`); });
    if (stats.son.cemaat < stats.once.cemaat) h += alertBox("red", "🔻 Cemaat Kaybı", "Cemaatle yapılan ibadet istikrarında bir gevşeme tespit edildi.");
    if (stats.son.sunnet < stats.once.sunnet) h += alertBox("blue", "📋 Sünnet Eksikliği", "Vakitlerin içindeki sünnet oranlarında düşüş var.");
    h += `<div style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;"><b style="color:var(--blue); font-size:14px;">🎯 Özel Ameller & Alışkanlıklar</b></div>`;
    h += `<div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">`;
    for (let ad in stats.son.ozeller) {

    let dunVeri = JSON.parse(localStorage.getItem(getLocalKey(dunTarih)));

// showModernReport içindeki şu iki satırı güncelleyin:
    let bPuan = hesaplaPuan(bugunVeri, getLocalKey(seciliTarih));
    let dPuan = dunVeri ? hesaplaPuan(dunVeri, getLocalKey(dunTarih)) : 0;

    let mesaj = "";
    let mRenk = ""; 

    // --- ÖZEL BAŞLANGIÇ KONTROLÜ ---
    let simdi = new Date();
    let saat = simdi.getHours();
    
    // Kullanıcının bugün herhangi bir şeye tıklayıp tıklamadığını kontrol ediyoruz
    let toplamGiris = bugunVeri.vakitler.reduce((acc, v) => acc + v.durumlar.reduce((a, b) => a + b, 0), 0) + 
                     (bugunVeri.ozeller ? bugunVeri.ozeller.reduce((acc, o) => acc + Number(o.durum || 0), 0) : 0);

    // --- RENK VE MESAJ MANTIĞI ---
    if (saat < 13 && toplamGiris === 0) {
        mRenk = "#3498db"; // Mavi
        mesaj = "Hayırlı sabahlar! Güne güzel bir maneviyatla başlamaya ne dersin? Sabah namazını kılarak ilk nuru alalım. ✨";
    } else if (bPuan >= 100) {
        mRenk = "#2ecc71"; // Yeşil
        mesaj = "Manevi zirvedesin! Bu nuru koru 🔥🌟";
    } else if (bPuan >= 90) {
        mRenk = "#2ecc71"; // Yeşil
        mesaj = "Gayretin çok iyi, küçük bir adımla zirveye çıkabilirsin! 🚀";
    } else if (bPuan >= 80) {
        mRenk = "#3498db"; // Mavi
        mesaj = "Gayretini daha da arttır, manevi basamakları çıkmalısın! 💡";
    } else if (bPuan >= 70) {
        mRenk = "#e67e22"; // Turuncu
        mesaj = "Dikkat etmelisin, bazı ameller aksamaya başlamış. ⚠️";
    } else if (bPuan >= 50) {
        mRenk = "#9b59b6"; // Mor
        mesaj = "Toparlanma vakti! Enerjini yeniden yükseltmelisin. ✨";
    } else {
        mRenk = "#e74c3c"; // Kırmızı
        mesaj = "Acil müdahale lazım! Manevi batarya çok zayıfladı. 🚨";
    }

   // ... (Fonksiyonun başındaki puan hesaplama kısımları aynı kalıyor) ...

    let barGradient = `linear-gradient(90deg, ${mRenk}, #ffffff, ${mRenk})`; // Daha canlı bir geçiş

  
    // ... (bPuan, mRenk gibi hesaplamaların yapıldığı üst kısım aynı kalıyor)

    let h = `
    <div style="text-align:center; padding:15px; background: rgba(0,0,0,0.3); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
        <div style="font-size:11px; opacity:0.7; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:5px; color:#fff;">GÜNLÜK MANEVİ ENERJİ</div>
        <div style="font-size:42px; font-weight:900; color:${mRenk}; text-shadow: 0 0 20px ${mRenk}, 0 0 40px ${mRenk}66; transition: all 0.5s ease;">%${bPuan}</div>
        
        <div style="width:100%; height:32px; background:rgba(255,255,255,0.08); border-radius:16px; margin:20px 0; overflow:hidden; border:1px solid rgba(255,255,255,0.2); position:relative; box-shadow: 0 0 15px rgba(0,0,0,0.4);">
            
            <div style="
                width:${bPuan}%; 
                height:100%; 
                background:${mRenk}; 
                border-radius:16px; 
                transition:width 1.5s cubic-bezier(0.23, 1, 0.32, 1);
                position:absolute;
                top:0; left:0;
                box-shadow: 0 0 25px ${mRenk}88;
                z-index: 1;
                overflow: hidden;
            ">
                <div style="
                    position: absolute;
                    top: 0;
                    left: -100%;
                    width: 100%;
                    height: 100%;
                    background: linear-gradient(
                        90deg, 
                        transparent, 
                        rgba(255, 255, 255, 0) 0%, 
                        rgba(255, 255, 255, 0.6) 50%, 
                        rgba(255, 255, 255, 0) 100%
                    );
                    animation: mermiAkis 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
                "></div>
            </div>
        </div>

        <div style="background:rgba(0,0,0,0.4); padding:15px; border-radius:15px; border:1px solid ${mRenk}66; color: white; font-size:14px; line-height:1.5;">
            ${mesaj}
        </div>



        <div style="margin-top:20px; display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
            <div style="background:var(--card); padding:12px; border-radius:15px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="font-size:10px; opacity:0.5;">DÜN</div>
                <div style="font-size:20px; font-weight:bold;">%${dPuan}</div>
            </div>
            <div style="background:var(--card); padding:12px; border-radius:15px; border: 1px solid ${mRenk}44;">
                <div style="font-size:10px; opacity:0.5;">BUGÜN</div>
                <div style="font-size:20px; font-weight:bold; color:${mRenk}">%${bPuan}</div>
            </div>
        </div>
        
        <div style="margin-top:25px; text-align:left;">
            <div style="font-size:11px; font-weight:bold; margin-bottom:12px; color:var(--blue); display:flex; align-items:center; gap:5px;">
                <span>📝</span> EKSİKLER VE HATIRLATMALAR
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 5px;">
                ${getEksikler(bugunVeri)}
            </div>
        </div>
    </div>
    `;

    document.getElementById('statTitle').innerText = "GÜNLÜK ANALİZ";
    document.getElementById('calGrid').innerHTML = h;
    document.getElementById('statModal').style.display = 'flex';
};
// Yardımcı Fonksiyonlar
function hesaplaPuan(v, hedefTarihKey) {
    if (!v) return 0;
    let p = 0;
    let toplamPuanPayi = 0;

    let simdi = new Date();
    let suAnkiSaat = simdi.getHours();
    
    // BUGÜNÜN TARİHİNİ SİZİN FORMATINIZDA ALALIM (YYYY-MM-DD)
    let bugunStr = getLocalKey(simdi); 

    v.vakitler.forEach((vk, index) => {
        let f = Number(vk.durumlar[0]);
        let s = Number(vk.durumlar[1]);
        let t = Number(vk.durumlar[2]);

        // MANTIĞI SADELEŞTİRDİK:
        // Eğer hedefTarihKey bugünden küçükse (geçmişse) vakit her türlü gelmiştir.
        // Bugünse saat kontrolü yapılır.
        let vakitGeldiMi = (hedefTarihKey < bugunStr) || (index === 0) || (hedefTarihKey === bugunStr && suAnkiSaat >= vakitSaatleri[index]);

        if (vakitGeldiMi) {
            toplamPuanPayi += 18; 
            // Puanları tek tek ekle
            if (f === 1 || f === 2) p += 12; else if (f === 4) p += 6;
            if (s === 1 || s === 2) p += 4;  else if (s === 4) p += 2;
            if (t === 1 || t === 2) p += 2;  else if (t === 4) p += 1;
        }
    });

    // ÖZEL AMELLER (10 Puan Payı)
    toplamPuanPayi += 10;
    let ozeller = v.ozeller || [];
    
    // Filtreleme mantığını en basit hale getirdik: 0 değilse ve boş değilse yapıldı say.
    let yapilanOzel = ozeller.filter(o => {
        return o.durum != 0 && o.durum != "" && o.durum != null;
    }).length;

    if (ozeller.length > 0) {
        p += (yapilanOzel / ozeller.length) * 10;
    }

    if (toplamPuanPayi === 0) return 0;
    let sonuc = Math.round((p / toplamPuanPayi) * 100);
    return Math.min(sonuc, 100);
}
function getEksikler(v) {
    let e = [];
    let simdi = new Date();
    let suAnkiSaat = simdi.getHours();
    
    let bugun = new Date(); bugun.setHours(0,0,0,0);
    let secili = new Date(seciliTarih); secili.setHours(0,0,0,0);

    // Eğer bakılan gün gelecek bir günse hiçbir eksik gösterme
    if (secili > bugun) {
        return "<span style='color:#3498db;'>⏳ Bu gün henüz başlamadı.</span>";
    }

    v.vakitler.forEach((vk, index) => {
        let f = Number(vk.durumlar[0]);
        let s = Number(vk.durumlar[1]);
        let t = Number(vk.durumlar[2]);
        
        // Geçmiş gün mü yoksa bugün mü kontrolü
        let vakitGeldiMi = (secili < bugun) || (index === 0) || (suAnkiSaat >= vakitSaatleri[index]);

        if (vakitGeldiMi) {
            if (f === 0 || f === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(231,76,60,0.2); border:1px solid #e74c3c; border-radius:8px; margin:2px; font-size:11px; color:#ff7675;">🚨 ${vk.ad.split(' ')[0]} Farz</span>`);
            if (s === 0 || s === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(243,156,18,0.1); border:1px solid #f39c12; border-radius:8px; margin:2px; font-size:11px; color:#fab1a0;">🔸 ${vk.ad.split(' ')[0]} Sünnet</span>`);
            if (t === 0 || t === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); border-radius:8px; margin:2px; font-size:11px; opacity:0.8;">📿 ${vk.ad.split(' ')[0]} Tesbihat</span>`);
        }
    });

    // getEksikler fonksiyonu içindeki özel amel kısmı
    let ozeller = v.ozeller || [];
    ozeller.forEach(o => {
        // DURUM KONTROLÜ: Sadece boş veya 0 ise eksik say, 3 ise yapıldı say!
        let d = o.durum;
        let yapildiMi = (d !== 0 && d !== "0" && d !== "" && d !== null && d !== undefined);

        if (!yapildiMi) {
            e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(52,152,219,0.1); border:1px solid #3498db; border-radius:8px; margin:2px; font-size:11px; color:#74b9ff;">✨ ${o.ad}</span>`);
        }
    });
    return e.length > 0 ? e.join('') : "<span style='color:#2ecc71; font-weight:bold;'>🌟 Harika! Eksik görünmüyor.</span>";
}
const vakitSaatleri = {
    0: 4,  // Sabah (Örn: 04:00'den itibaren sorumlu)
    1: 12, // Öğle (13:00)
    2: 15, // İkindi (16:30 gibi)
    3: 18, // Akşam (19:30 gibi)
    4: 20  // Yatsı (21:00)
};
</script>
