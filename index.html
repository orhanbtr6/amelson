<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="amel_icon.png">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri PRO</title>
	<link rel="stylesheet" href="style.css">
</head>
<body ontouchstart="hTS(event)" ontouchend="hTE(event)">
<div class="container">
    <div class="main-title-container" onclick="window.gitBugun()">
        <span class="main-title">Amel Defteri Pro</span><span style="font-size:9px; opacity:0.4; vertical-align:super; margin-left:4px;">V.1.0</span>
    </div>
    <div class="nav-header">
        <button class="nav-btn" onclick="degistirTarih(-1)">❮</button>
        <div class="date-display-box">
            <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
            <div id="isToday" style="font-size: 9px; color: var(--light-green); font-weight:bold;"></div>
            <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
        </div>
        <button class="nav-btn" onclick="degistirTarih(1)">❯</button>
        <div style="display:flex; gap:4px; margin-left:5px;">
            <button class="nav-btn" style="background:var(--blue); font-size: 9px; padding: 8px;" onclick="showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 9px; padding: 8px;" onclick="showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>
    <div id="vakitList"></div>
    <div id="ozelList" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; margin-top:5px;"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <div id="statTitle" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#a5d3ff; text-transform:uppercase;"></div>
        <div id="calGrid"></div>
        <button class="btn-close-new" onclick="closeModal()">Kapat</button>
    </div>
</div>

<div id="typeModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--blue); margin-top:10px;">Amel Tipi Seçin</h3>
        <p id="pendingAmelAd" style="text-align:center; font-size:12px; opacity:0.7;"></p>
        <div class="type-select-btns">
            <div class="type-btn" onclick="finalEkle('renk')">🔵 Renk Bazlı (Daire)</div>
            <div class="type-btn" onclick="finalEkle('sayi')">🔢 Sayı Bazlı (Miktar)</div>
        </div>
        <div style="margin-top: 25px;">
            <button class="btn-close-new" onclick="document.getElementById('typeModal').style.display='none'">VAZGEÇ</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeSettings()">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
       <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:15px;">
            <span style="font-size:14px; font-weight:bold;">Farkındalık Sinyalleri (⚠️)</span>
            <label class="switch">
                <input type="checkbox" id="signalToggle" onchange="toggleSignals(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button class="nav-btn" style="width:100%; margin-bottom:10px;" onclick="exportData()">💾 Yedekle</button>
        <button class="nav-btn" style="width:100%;" onclick="importData()">📂 Geri Yükle</button>
    </div>
</div>
<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel/görev...">
    
    <button class="footer-btn" onclick="yeniEkle()">EKLE</button>
    
    <button class="footer-icon" id="micBtn" onclick="window.sesDinle()" title="Sesle Yaz">🎤</button>
    
    <div class="footer-icon" onclick="window.analizEt()" title="Analiz">📊</div>

    <button class="footer-icon" onclick="openSettings()" title="Ayarlar">⚙️</button>
</div>
<div id="analizBtn" onclick="window.showModernReport()" 
     style="position: fixed; bottom: 120px; right: 20px; width: 50px; height: 50px; 
            background: var(--blue); border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 24px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 999; 
            border: 2px solid rgba(255,255,255,0.2); cursor: move; touch-action: none;">
    ⚡
</div><script>
    let xS = null;
    function hTS(e) { xS = e.touches[0].clientX; }
    function hTE(e) {
        if (!xS || document.getElementById('statModal').style.display === 'block') return;
        let xD = xS - e.changedTouches[0].clientX;
        if (Math.abs(xD) > 70) { 
            if (xD > 0) degistirTarih(1); else degistirTarih(-1);
        }
        xS = null;
    }
    window.showVDetail = (e, vIdx) => {
        e.stopPropagation();
        let res = "";
        for(let i=1; i<=2; i++){
            let d = new Date(seciliTarih); d.setDate(d.getDate()-i);
            let v = JSON.parse(localStorage.getItem(getLocalKey(d)));
            let eksikler = v ? v.vakitler[vIdx].durumlar.map((s,idx)=>s===0?basliklar[idx]:null).filter(n=>n) : ["Kayıt Yok"];
            res += `<p style='border-bottom:1px solid rgba(255,255,255,0.1); padding:5px;'><b>${d.getDate()}/${d.getMonth()+1}:</b> ${eksikler.length?eksikler.join(", "):"Eksik Yok"}</p>`;
        }
        document.getElementById('statTitle').innerText = vakitler[vIdx] + " Uyarı Sebebi";
        document.getElementById('calGrid').innerHTML = `<div style='font-size:13px; text-align:left;'>Bu vakit son 2 gündür aksatıldığı için uyarı veriliyor:<br><br>${res}</div>`;
        document.getElementById('statModal').style.display = 'flex';
    }
    window.showODetail = (e, oIdx) => {
        e.stopPropagation();
        let ozel = gunlukVeriler.ozeller[oIdx];
        document.getElementById('statTitle').innerText = ozel.ad + " Uyarı Sebebi";
        document.getElementById('calGrid').innerHTML = `<div style='font-size:13px; text-align:left;'>Bu amel son 2 gündür boş geçildiği için dikkat çekmek amacıyla yanıp sönüyor.</div>`;
        document.getElementById('statModal').style.display = 'flex';
    }
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let signalsActive = localStorage.getItem('amel_signals_active') !== 'false';
    let pendingName = "";
    let currentHeatmapId = null;
    let currentHeatmapType = null;
    let currentHeatmapSubIdx = null;

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }
    function toggleSignals(val) { signalsActive = val; localStorage.setItem('amel_signals_active', val); render(); }
    function isTodayCheck(d, m, y) { let today = new Date(); return d === today.getDate() && m === today.getMonth() && y === today.getFullYear(); }
    function isFuture() { let today = new Date(); today.setHours(0,0,0,0); let check = new Date(seciliTarih); check.setHours(0,0,0,0); return check > today; }

    function getWarningData(vIdx) {
        const kayitliGunler = Object.keys(localStorage).filter(k => k.startsWith('amel_20')).length;
    	if (kayitliGunler < 3) return null; // 3 günden az veri varsa ünlem gösterme ve çık
		if(!signalsActive || isFuture()) return null;
        const bugunDurum = gunlukVeriler.vakitler[vIdx].durumlar;
        let streaks = [0, 0, 0];
        for(let i=1; i<=3; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.vakitler[vIdx]) {
                const dur = val.vakitler[vIdx].durumlar;
                if(dur[0] === 0 || dur[0] === 3) streaks[0]++;
                if(dur[1] === 0) streaks[1]++;
                if(dur[2] === 0) streaks[2]++;
            } else { streaks[0]++; streaks[1]++; streaks[2]++; }
        }
        let fWarn = (streaks[0] >= 3 && (bugunDurum[0] === 0 || bugunDurum[0] === 3));
        let sWarn = (streaks[1] >= 3 && bugunDurum[1] === 0);
        let tWarn = (streaks[2] >= 3 && bugunDurum[2] === 0);
        return (fWarn || sWarn || tWarn) ? {streaks, fWarn, sWarn, tWarn} : null;
    }

    function getOzelWarning(ozelIdx) {
        if(!signalsActive || isFuture()) return false;
        const ozelBugun = gunlukVeriler.ozeller[ozelIdx];
        if(!ozelBugun || (ozelBugun.durum != 0 && ozelBugun.durum !== "")) return false;
        let count = 0;
        for(let i=1; i<=2; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.ozeller) {
                let o = val.ozeller.find(x => x.ad === ozelBugun.ad);
                if(!o || o.durum == 0 || o.durum === "" || o.durum === 0) count++;
            } else { count++; }
        }
        return count >= 2;
    }
window.analizEt = function() {
    let yorumlari = [];
	let ilkGiris = localStorage.getItem('ilkGiris');
let gunFarki = (new Date().getTime() - ilkGiris) / (1000 * 60 * 60 * 24);

if (gunFarki < 3) {
    // Henüz 3 gün dolmadıysa analiz yerine teşvik mesajı göster
    yorumlari.push("🌟 **Yolculuk Başlıyor:** Manevi rehberine hoş geldin! Analizlerin sağlıklı oluşabilmesi için ilk 3 gün verilerini girmeye odaklan.");
}
    let veriler = [];
    let bugun = new Date();
    const vakitAdlari = ["Sabah", "Öğle", "İkindi", "Akşam", "Yatsı"];
    let baslangicGunu = (bugun.getHours() < 23) ? 1 : 0;

    for (let i = baslangicGunu; i < (14 + baslangicGunu); i++) {
        let d = new Date(); d.setDate(bugun.getDate() - i);
        let k = getLocalKey(d);
        let v = JSON.parse(localStorage.getItem(k));
        if (v) veriler.push({ fark: i - baslangicGunu, veri: v });
    }

    if (veriler.length < 3) { alert("Analiz için en az 3 günlük veri gerekiyor."); return; }

    let stats = {
        son: { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0, vakitler: [], ozeller: {} },
        once: { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0, vakitler: [], ozeller: {} }
    };

    for(let i=0; i<5; i++) {
        stats.son.vakitler[i] = { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0 };
        stats.once.vakitler[i] = { cemaat: 0, vaktinde: 0, kaza: 0, hic: 0, sunnet: 0, tesbihat: 0 };
    }

    veriler.forEach(item => {
        let s = (item.fark < 7) ? stats.son : stats.once;
        item.veri.vakitler.forEach((v, idx) => {
            let farzVal = parseInt(v.durumlar[0]); 
            
            // 0:boş, 1:yeşil, 2:açık yeşil, 3:turuncu, 4:kırmızı
            switch(farzVal) {
                case 1: s.vaktinde++; s.vakitler[idx].vaktinde++; break;
                case 2: s.cemaat++; s.vakitler[idx].cemaat++; break;
                case 3: 
                case 0: // Boş bırakılan da borçtur, kaza sayıldı
                    s.kaza++; s.vakitler[idx].kaza++; break;
                case 4: 
                default: s.hic++; s.vakitler[idx].hic++; break;
            }

            if (parseInt(v.durumlar[1]) > 0) { s.sunnet++; s.vakitler[idx].sunnet++; }
            if (parseInt(v.durumlar[2]) > 0) { s.tesbihat++; s.vakitler[idx].tesbihat++; }
        });

        if (item.veri.ozeller) {
            item.veri.ozeller.forEach(o => {
                if (!s.ozeller[o.ad]) s.ozeller[o.ad] = { yapildi: 0 };
                if (parseInt(o.durum) > 0) s.ozeller[o.ad].yapildi++;
            });
        }
    });

    let yorumlar = [];
    const hadislerNamaz = {
        0: "Sabah namazının iki rekatı, dünyadan ve dünyadaki her şeyden daha hayırlıdır. (Müslim)",
        1: "Kim öğle namazından önce dört, sonra da iki rekat kılmaya devam ederse Allah onu cehenneme haram kılar. (Nesâî)",
        2: "İkindi namazını terk edenin ameli boşa gider. (Buhârî)",
        3: "Akşam namazı gündüzün vitridir; acele ediniz. (Tirmizî)",
        4: "Yatsı ve sabah namazlarındaki sevabı bilselerdi, emekleyerek de olsa gelirlerdi. (Buhârî)"
    };
    // --- NAMAZ ANALİZİ ---
    let sorunluVakitler = stats.son.vakitler.map((v, i) => (v.kaza > 0 || v.hic > 0) ? vakitAdlari[i] : null).filter(n => n);
    
    if (sorunluVakitler.length > 0) {
        let vakitIndeks = vakitAdlari.indexOf(sorunluVakitler[0]);
        yorumlar.push(`⚠️ **Namaz Analizi:** Son hafta **${sorunluVakitler.join(", ")}** vakitlerinde aksamalar görülüyor. Efendimiz (sav) buyuruyor: *"${hadislerNamaz[vakitIndeks]}"*`);
    } else {
        yorumlar.push(`✅ **Maşallah:** Tüm namazlar vaktinde ikame edildi. "Namaz dinin direğidir." İstikrarın daim olsun.`);
    }

    // --- ÖZEL AMEL ANALİZİ (Gelişime Dayalı) ---
    let gevseyenler = [];
    let gelisenler = [];
    for (let ad in stats.son.ozeller) {
        let sonHafta = stats.son.ozeller[ad].yapildi;
        let oncekiHafta = (stats.once.ozeller[ad]) ? stats.once.ozeller[ad].yapildi : 0;

        if (sonHafta < oncekiHafta) {
            gevseyenler.push(ad);
        } else if (sonHafta > oncekiHafta || (sonHafta === 7 && oncekiHafta === 7)) {
            gelisenler.push(ad);
        }
    }
    if (gevseyenler.length > 0) {
        yorumlar.push(`📉 **Dikkat:** Geçen haftaya oranla **${gevseyenler.join(", ")}** amellerinde bir gevşeme var. Amellerin hayırlısı, az da olsa devamlı olanıdır.`);
    } 
    if (gelisenler.length > 0) {
        yorumlar.push(`🌟 **Gelişim:** **${gelisenler.join(", ")}** amellerindeki gayretin artmış veya tam puanla devam ediyor. Rabbimiz buyuruyor: *"İnsan için ancak çalıştığının karşılığı vardır." (Necm, 39)*`);
    }
    // --- GÖRSEL RAPOR ---
    let h = `<div style="text-align:left; color:#eee; max-height:80vh; overflow-y:auto; padding-right:10px;">`;
    h += `<h3 style="color:#2ecc71; text-align:center; font-size:20px; border-bottom:1px solid #333; padding-bottom:10px;">📊 HAFTALIK MANEVİ ANALİZ</h3>`;

    h += `<div style="background:rgba(52,152,219,0.1); padding:15px; border-radius:18px; border:1px solid #3498db; margin-bottom:20px; font-size:15px; line-height:1.6;">
            ${yorumlar.join(" <hr style='opacity:0.1; margin:10px 0;'> ")}
          </div>`;
    vakitAdlari.forEach((ad, i) => {
        let sn = stats.son.vakitler[i];
        let on = stats.once.vakitler[i];
        h += `<div style="background:var(--card); padding:12px; border-radius:15px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.1);">
                <b style="color:#3498db; font-size:17px;">${ad.toUpperCase()}</b>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:8px;">
                    <div style="font-size:12px; color:#2ecc71;">Cemaat: <b>${sn.cemaat}</b> ${getF(sn.cemaat, on.cemaat)}</div>
                    <div style="font-size:12px; color:#a3e4d7;">Vaktinde: <b>${sn.vaktinde}</b> ${getF(sn.vaktinde, on.vaktinde)}</div>
                    <div style="font-size:12px; color:#e74c3c;">Kazaya Kalmış: <b>${sn.kaza}</b> ${getF(sn.kaza, on.kaza, true)}</div>
                    <div style="font-size:12px; color:#f39c12;">Kaza Edilmiş: <b>${sn.hic}</b> ${getF(sn.hic, on.hic, true)}</div>
                </div>
              </div>`;
    });
    h += `<b style="color:#f1c40f; font-size:17px; display:block; margin:20px 0 10px 5px;">🌟 Özel Amel Durumu</b>`;
    for (let ad in stats.son.ozeller) {
        let d = stats.son.ozeller[ad];
        let ed = stats.once.ozeller[ad] || { yapildi: 0 };
        h += `<div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:15px;">${ad}</span>
                <span style="color:#2ecc71; font-weight:bold;">${d.yapildi}/7 Gün ${getF(d.yapildi, ed.yapildi)}</span>
              </div>`;
    }
    h += `</div>`;

    function getF(s, e, t = false) {
        let f = s - e; if(f === 0) return `<small style="color:#777;">(0)</small>`;
        let r = (f > 0) ? (t ? '#e74c3c' : '#2ecc71') : (t ? '#2ecc71' : '#e74c3c');
        return `<small style="color:${r}; font-weight:bold;">(${f > 0 ? '+' : ''}${f})</small>`;
    }
    document.getElementById('statTitle').innerText = "DETAYLI ANALİZ";
    document.getElementById('calGrid').innerHTML = h;
    modalAcildi(); 
    document.getElementById('statModal').style.display = 'flex';
};    function alertBox(color, title, text) {
    return `<div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:8px; border-left:4px solid var(--${color}); margin-bottom:8px;">
                <b style="font-size:12px; color:var(--${color});">${title}</b><br><span style="font-size:11px; opacity:0.8;">${text}</span>
            </div>`;
} function veriYukle() {
        const key = getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const seciliTarihStr = seciliTarih.toISOString().split('T')[0];
        const globalListe = getGlobalOzeller().filter(g => {
            if(!g.eklenmeTarihi) return !g.arsiv;
            return !g.arsiv && seciliTarihStr >= g.eklenmeTarihi;
        });
        if (kaydedilmis) {
            gunlukVeriler = kaydedilmis;
            gunlukVeriler.ozeller = gunlukVeriler.ozeller.filter(o => globalListe.some(g => g.id === o.id));
            globalListe.forEach(g => { 
                if(!gunlukVeriler.ozeller.some(o => o.id === g.id)) gunlukVeriler.ozeller.push({...g, durum: (g.tip === 'sayi' ? "" : 0)}); 
            });
        } else {
            gunlukVeriler = { 
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
                ozeller: globalListe.map(g => ({ ...g, durum: (g.tip === 'sayi' ? "" : 0) })) 
            };
        }
        render();
    }

	function render() {
    // Veriyi kaydet
    localStorage.setItem(getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
    
    // Tarih gösterimlerini güncelle
    document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
    document.getElementById('isToday').innerText = (getLocalKey(new Date()) === getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' }).toUpperCase();
    
    // KRİTİK: Anahtar kontrolünü 'amel_' olarak düzeltiyoruz (senin formatın bu)
    const sistemdeVeriVarmi = Object.keys(localStorage).some(key => key.startsWith('amel_20')); 
    
    const vDiv = document.getElementById('vakitList'); 
    vDiv.innerHTML = '';
    
    // Bugünün vaktini belirle
    const isToday = (getLocalKey(new Date()) === getLocalKey(seciliTarih));
    const siradakiVakitIdx = isToday ? gunlukVeriler.vakitler.findIndex(v => v.durumlar[0] === 0) : -1;

    // Namaz Vakitlerini Render Et
    gunlukVeriler.vakitler.forEach((v, vIdx) => {
        let p = 0; const f = v.durumlar[0], s = v.durumlar[1], t = v.durumlar[2];
        const cemaatMi = (f === 2);
        
        if ((f === 1 || f === 2) && s > 0 && (t === 1 || t === 2)) p = 100;
        else {
            if (f === 1) p += 30; else if (f === 2) p += 50; else if (f === 4) p += 20;
            if (s > 0) p += 25;
            if (t === 1 || t === 2) p += 25;
        }

        let bCol = cemaatMi ? "#90ee90" : ((f > 0 || s > 0 || t > 0) ? (p === 100 ? "#90ee90" : (p >= 50 ? "#228b22" : (p > 30 ? "#f39c12" : "#e74c3c"))) : "rgba(255,255,255,0.4)");
        
        // getWarningData'yı güvenli çağırıyoruz
        let wData = (sistemdeVeriVarmi) ? getWarningData(vIdx) : null; 
        let boxClass = (f === 1 && s > 0 && (t === 1 || t === 2)) ? "vakit-success" : (f === 2 ? "vakit-soft" : (f === 3 ? "vakit-danger" : (f === 4 ? "vakit-warn" : "")));
        let activeClass = (vIdx === siradakiVakitIdx) ? "active-vakit" : "";

        vDiv.innerHTML += `<div class="habit-card ${activeClass}">
            <div class="vakit-isim-box ${boxClass}" onclick="window.showHeatmap(${vIdx}, 'vakit')">
                ${wData ? `<span class="warning-blink" onclick="window.showVDetail(event, ${vIdx})">⚠️</span>` : ''}
                <span class="vakit-ad">${vakitler[vIdx]}</span>
            </div>

// Yardımcı Fonksiyonlar
function hesaplaPuan(v, hedefTarihKey) {
    if (!v) return 0;
    let p = 0;
    let toplamPuanPayi = 0;

    let simdi = new Date();
    let suAnkiSaat = simdi.getHours();
    let bugunStr = getLocalKey(simdi); 

    v.vakitler.forEach((vk, index) => {
        let f = Number(vk.durumlar[0]);
        let s = Number(vk.durumlar[1]);
        let t = Number(vk.durumlar[2]);

        // Vaktin gelip gelmediğini kontrol et
        let vakitGeldiMi = (hedefTarihKey < bugunStr) || (index === 0) || (hedefTarihKey === bugunStr && suAnkiSaat >= vakitSaatleri[index]);

        if (vakitGeldiMi) {
            // KRİTİK DÜZELTME: Vakit geldiyse bu 18 puan mutlaka paydaya eklenmeli!
            toplamPuanPayi += 18; 

            // Farz Puanı (12 üzerinden)
            if (f === 1 || f === 2) p += 12; 
            else if (f === 4) p += 6; // Kaza ise yarım puan (6)
            
            // Sünnet Puanı (4 üzerinden)
            if (s === 1 || s === 2) p += 4; 
            else if (s === 4) p += 2; // Sünnet kaza/sonradan ise 2
            
            // Tesbihat Puanı (2 üzerinden)
            if (t === 1 || t === 2) p += 2; 
            else if (t === 4) p += 1; // Tesbihat sonradan ise 1
        }
    });

    // Özel Ameller (10 Puanlık Sabit Pay)
    toplamPuanPayi += 10;
    let ozeller = v.ozeller || [];
    let yapilanOzel = ozeller.filter(o => {
        let d = String(o.durum).trim();
        return d !== "" && d !== "0" && d !== "null";
    }).length;

    if (ozeller.length > 0) {
        p += (yapilanOzel / ozeller.length) * 10;
    }

    if (toplamPuanPayi === 0) return 0;
    // Matematiksel olarak (Alınan Puan / Olması Gereken Puan) * 100
    return Math.min(Math.round((p / toplamPuanPayi) * 100), 100);
}
    function getEksikler(v) {

    let secili = new Date(seciliTarih); secili.setHours(0,0,0,0);

    // Eğer bakılan gün gelecek bir günse hiçbir eksik gösterme
    if (secili > bugun) {
        return "<span style='color:#3498db;'>⏳ Bu gün henüz başlamadı.</span>";

    v.vakitler.forEach((vk, index) => {

        let vakitGeldiMi = (secili < bugun) || (index === 0) || (suAnkiSaat >= vakitSaatleri[index]);

        if (vakitGeldiMi) {
            if (f === 0 || f === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(231,76,60,0.2); border:1px solid #e74c3c; border-radius:8px; margin:2px; font-size:11px; color:#ff7675;">🚨 ${vk.ad.split(' ')[0]} Farz</span>`);

            if (t === 0 || t === 3) e.push(`<span style="display:inline-block; padding:3px 8px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); border-radius:8px; margin:2px; font-size:11px; opacity:0.8;">📿 ${vk.ad.split(' ')[0]} Tesbihat</span>`);

        }

    return e.length > 0 ? e.join('') : "<span style='color:#2ecc71; font-weight:bold;'>🌟 Harika! Eksik görünmüyor.</span>";

const el = document.getElementById('analizBtn');

// --- SAYFA YÜKLENDİĞİNDE KONUMU GERİ YÜKLE ---
window.addEventListener('DOMContentLoaded', () => {
    const savedPos = JSON.parse(localStorage.getItem('analizBtnPos'));
    if (savedPos) {
        el.style.left = savedPos.x + 'px';
        el.style.top = savedPos.y + 'px';
        el.style.bottom = 'auto';
        el.style.right = 'auto';
    }
});

let isDragging = false;
let startX, startY, initialLeft, initialTop;

const dragStart = (e) => {
    const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

    isDragging = true;
    startX = clientX;
    startY = clientY;

    const rect = el.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    el.style.transition = 'none';
};

const dragMove = (e) => {
    if (!isDragging) return;

    const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

    let newX = initialLeft + (clientX - startX);
    let newY = initialTop + (clientY - startY);

    // Ekran dışına taşma kontrolü
    newX = Math.max(0, Math.min(newX, window.innerWidth - el.offsetWidth));
    newY = Math.max(0, Math.min(newY, window.innerHeight - el.offsetHeight));

    el.style.left = newX + 'px';
    el.style.top = newY + 'px';
    el.style.bottom = 'auto';
    el.style.right = 'auto';
};

const dragEnd = () => {
    if (!isDragging) return;
    isDragging = false;
    el.style.transition = 'all 0.3s ease-out';

    // --- KONUMU HAFIZAYA KAYDET ---
    const pos = {
        x: el.offsetLeft,
        y: el.offsetTop
    };
    localStorage.setItem('analizBtnPos', JSON.stringify(pos));
};

// Olay Dinleyicileri
el.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);

el.addEventListener('touchstart', dragStart, { passive: false });
document.addEventListener('touchmove', dragMove, { passive: false });
document.addEventListener('touchend', dragEnd);</script>
