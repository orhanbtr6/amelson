<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri V.22.24</title>
    <style>
        :root { 
            --bg: #0b3d59; 
            --card: rgba(255, 255, 255, 0.12); 
            --light-green: #90ee90; 
            --dark-green: #228b22; 
            --red: #e74c3c; 
            --orange: #f39c12; 
            --blue: #3498db; 
            --today-border: #666666; 
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        
        .main-title-container { text-align: center; margin: 18px 0; cursor: pointer; }
        .main-title { display: inline-block; font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--card); padding: 10px; border-radius: 12px; }
        .date-display { font-weight: bold; font-size: 16px; color: var(--blue); }
        .nav-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px 15px; }

        .card { background: var(--card); border-radius: 15px; padding: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .vakit-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .vakit-row:last-child { border-bottom: none; }
        .vakit-ad { font-weight: bold; font-size: 15px; flex: 1; }
        
        .btn-group { display: flex; gap: 6px; }
        .status-btn { width: 34px; height: 34px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .status-btn.active-1 { background: var(--light-green); color: #000; }
        .status-btn.active-2 { background: var(--dark-green); color: #fff; }
        .status-btn.active-3 { background: var(--red); color: #fff; }

        .ozel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .input-group { display: flex; gap: 8px; margin-top: 10px; }
        input[type="text"] { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px; color: white; outline: none; }
        .add-btn { background: var(--blue); border: none; border-radius: 10px; width: 40px; color: white; font-weight: bold; cursor: pointer; }

        .ozel-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ozel-label { flex: 1; font-size: 14px; }
        .ozel-action { display: flex; align-items: center; gap: 10px; }
        .circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); cursor: pointer; }
        .circle.filled { background: var(--blue); border-color: var(--blue); }
        .sayi-input { width: 50px; background: none; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; text-align: center; padding: 4px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1a1a1a; width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; position: relative; border: 1px solid var(--blue); display: flex; flex-direction: column; }
        
        /* Kapatma Butonu Stili */
        .btn-close-new { width: 100%; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--blue); cursor: pointer; font-weight: bold; margin-top: 25px; }

        .type-btn { background: var(--card); padding: 15px; border-radius: 12px; margin: 10px 0; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        .floating-menu { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(0,0,0,0.6); padding: 12px 25px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); z-index: 900; }
        .f-item { font-size: 22px; cursor: pointer; transition: 0.3s; }
        .f-item:hover { transform: scale(1.2); }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title-container" onclick="location.reload()">
        <span class="main-title">AMEL DEFTERİ</span>
    </div>

    <div class="top-row">
        <button class="nav-btn" onclick="degis(-1)">❮</button>
        <div id="dateText" class="date-display">...</div>
        <button class="nav-btn" onclick="degis(1)">❯</button>
    </div>

    <div class="card">
        <div id="vakitList"></div>
    </div>

    <div class="card">
        <div class="ozel-header">
            <span style="font-weight:bold; color:var(--blue);">Özel Ameller</span>
        </div>
        <div id="ozelList"></div>
        <div class="input-group">
            <input type="text" id="habInp" placeholder="Yeni amel ekle...">
            <button class="add-btn" id="micBtn" onclick="sesDinle()">🎤</button>
            <button class="add-btn" onclick="amelEklemeIstek()">+</button>
        </div>
    </div>
</div>

<div class="floating-menu">
    <div class="f-item" onclick="showHeatmap()">🔥</div>
    <div class="f-item" onclick="document.getElementById('settingsModal').style.display='flex'">⚙️</div>
</div>

<div id="typeModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--blue);">Amel Tipi Seçin</h3>
        <p id="pendingAmelAd" style="text-align:center; font-size:12px; opacity:0.7;"></p>
        <div class="type-btn" onclick="finalEkle('renk')">🔵 Renk Bazlı (Daire)</div>
        <div class="type-btn" onclick="finalEkle('sayi')">🔢 Sayı Bazlı (Miktar)</div>
        <button class="btn-close-new" onclick="document.getElementById('typeModal').style.display='none'">VAZGEÇ</button>
    </div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--red);">Yıllık Rapor</h3>
        <div id="statContent"></div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
        <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px;">
            <span style="font-size:14px; font-weight:bold;">Farkındalık Sinyalleri (⚠️)</span>
            <label class="switch">
                <input type="checkbox" id="signalToggle" onchange="toggleSignals(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button class="btn-close-new" onclick="document.getElementById('settingsModal').style.display='none'">KAPAT</button>
    </div>
</div>

<script>
    let seciliTarih = new Date();
    const vakitler = ["Sabah", "Öğle", "İkindi", "Akşam", "Yatsı"];
    let gunlukVeriler = { vakitler: [], ozeller: [] };
    let pendingName = "";

    const getLocalKey = (d) => "amel_" + d.toISOString().split('T')[0];
    const getGlobalOzeller = () => JSON.parse(localStorage.getItem('amel_global_ozeller')) || [];

    function veriYukle() {
        const key = getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const seciliTarihStr = seciliTarih.toISOString().split('T')[0];

        const globalListe = getGlobalOzeller().filter(g => {
            if(!g.eklenmeTarihi) return !g.arsiv;
            return !g.arsiv && seciliTarihStr >= g.eklenmeTarihi;
        });

        if (kaydedilmis) {
            gunlukVeriler = kaydedilmis;
            gunlukVeriler.ozeller = gunlukVeriler.ozeller.filter(o => globalListe.some(g => g.id === o.id));
            globalListe.forEach(g => {
                if(!gunlukVeriler.ozeller.some(o => o.id === g.id))
                    gunlukVeriler.ozeller.push({...g, durum: (g.tip === 'sayi' ? "" : 0)});
            });
        } else {
            gunlukVeriler = {
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })),
                ozeller: globalListe.map(g => ({ ...g, durum: (g.tip === 'sayi' ? "" : 0) }))
            };
        }
        render();
    }

    function render() {
        const dText = document.getElementById('dateText');
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        dText.innerText = seciliTarih.toLocaleDateString('tr-TR', options);
        
        let vHtml = "";
        gunlukVeriler.vakitler.forEach((v, idx) => {
            vHtml += `
            <div class="vakit-row">
                <div class="vakit-ad">${v.ad}</div>
                <div class="btn-group">
                    <button class="status-btn ${v.durumlar[0]===1?'active-1':''}" onclick="setV(0,${idx},1)">K</button>
                    <button class="status-btn ${v.durumlar[0]===2?'active-2':''}" onclick="setV(0,${idx},2)">C</button>
                    <button class="status-btn ${v.durumlar[0]===3?'active-3':''}" onclick="setV(0,${idx},3)">X</button>
                </div>
            </div>`;
        });
        document.getElementById('vakitList').innerHTML = vHtml;

        let oHtml = "";
        gunlukVeriler.ozeller.forEach((o, idx) => {
            oHtml += `<div class="ozel-row">
                <div class="ozel-label">${o.ad}</div>
                <div class="ozel-action">`;
            if(o.tip === 'renk') {
                oHtml += `<div class="circle ${o.durum>0?'filled':''}" onclick="toggleO(${idx})"></div>`;
            } else {
                oHtml += `<input type="number" class="sayi-input" value="${o.durum}" onchange="setO(${idx}, this.value)">`;
            }
            oHtml += `<span onclick="arsivle(${idx})" style="font-size:12px; opacity:0.4; cursor:pointer;">📦</span></div></div>`;
        });
        document.getElementById('ozelList').innerHTML = oHtml;
        kaydet();
    }

    function setV(type, idx, val) {
        gunlukVeriler.vakitler[idx].durumlar[type] = gunlukVeriler.vakitler[idx].durumlar[type] === val ? 0 : val;
        render();
    }

    function setO(idx, val) { gunlukVeriler.ozeller[idx].durum = val; render(); }
    function toggleO(idx) { gunlukVeriler.ozeller[idx].durum = gunlukVeriler.ozeller[idx].durum ? 0 : 1; render(); }

    function degis(n) { seciliTarih.setDate(seciliTarih.getDate() + n); veriYukle(); }
    function kaydet() { localStorage.setItem(getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler)); }

    function amelEklemeIstek() {
        pendingName = document.getElementById('habInp').value.trim();
        if(!pendingName) return;
        document.getElementById('pendingAmelAd').innerText = pendingName;
        document.getElementById('typeModal').style.display = 'flex';
    }

    window.finalEkle = (tip) => {
        let g = getGlobalOzeller();
        const bugunStr = seciliTarih.toISOString().split('T')[0];
        const yeni = { id: 'id_'+Date.now(), ad: pendingName, tip: tip, eklenmeTarihi: bugunStr };
        g.push(yeni);
        localStorage.setItem('amel_global_ozeller', JSON.stringify(g));
        document.getElementById('habInp').value="";
        gunlukVeriler.ozeller.push({...yeni, durum: (tip === 'sayi' ? "" : 0)});
        document.getElementById('typeModal').style.display = 'none';
        render();
    };

    function arsivle(idx) {
        if(!confirm("Bu amel arşivlensin mi? (Yıllık raporda görünür ama ana listeden kalkar)")) return;
        const targetId = gunlukVeriler.ozeller[idx].id;
        let g = getGlobalOzeller();
        const found = g.find(a => a.id === targetId);
        if(found) found.arsiv = true;
        localStorage.setItem('amel_global_ozeller', JSON.stringify(g));
        veriYukle();
    }

    window.tamamenSil = (amelAd, elementId) => {
        if (confirm(`'${amelAd}' ameline ait tüm geçmiş veriler silinecek. Emin misiniz?`)) {
            let g = getGlobalOzeller();
            g = g.filter(a => a.ad.trim() !== amelAd.trim());
            localStorage.setItem('amel_global_ozeller', JSON.stringify(g));

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key && key.startsWith('amel_')) {
                    let d = JSON.parse(localStorage.getItem(key));
                    if (d && d.ozeller) {
                        d.ozeller = d.ozeller.filter(o => o.ad.trim() !== amelAd.trim());
                        localStorage.setItem(key, JSON.stringify(d));
                    }
                }
            }

            const satir = document.getElementById(elementId);
            if (satir) {
                satir.style.transition = "all 0.4s ease";
                satir.style.opacity = "0";
                satir.style.transform = "translateX(20px)";
                setTimeout(() => satir.remove(), 400);
            }
            veriYukle();
        }
    };

    window.showHeatmap = () => {
        const kaza = { "Sabah": 0, "Öğle": 0, "İkindi": 0, "Akşam": 0, "Yatsı": 0 };
        let arsiv = {};
        const yil = seciliTarih.getFullYear();
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('amel_')) {
                const v = JSON.parse(localStorage.getItem(key));
                v.vakitler.forEach((vk, idx) => { if (vk.durumlar[0] === 3) kaza[Object.keys(kaza)[idx]]++; });
                (v.ozeller || []).forEach(vo => {
                    if (!arsiv[vo.ad]) arsiv[vo.ad] = { t: 0, tip: vo.tip };
                    if (vo.tip === 'sayi') arsiv[vo.ad].t += parseFloat(vo.durum || 0);
                    else if (vo.durum > 0) arsiv[vo.ad].t += 1;
                });
            }
        }

        let h = `<div style="max-height:55vh; overflow-y:auto;"><table style="width:100%; font-size:12px;"><thead><tr style="color:var(--red);"><th style="text-align:left;">Kaza Namazları</th><th style="text-align:right;">Adet</th></tr></thead><tbody>`;
        Object.keys(kaza).forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right;">${kaza[k]}</td></tr>`; });
        h += `</tbody></table><table style="width:100%; margin-top:15px; font-size:12px;"><thead><tr style="color:var(--blue);"><th style="text-align:left;">Özel Ameller</th><th style="text-align:right;">Değer</th></tr></thead><tbody>`;

        Object.keys(arsiv).sort().forEach((k, index) => {
            const rowId = `amel-row-${index}`;
            h += `<tr id="${rowId}">
                <td style="padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);">${k}</td>
                <td style="text-align:right; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span style="font-weight:bold; color:var(--blue);">${arsiv[k].t}</span>
                    <span onclick="tamamenSil('${k.replace(/'/g, "\\'")}', '${rowId}')" style="cursor:pointer; margin-left:15px; color:var(--red); font-size:16px;">🗑️</span>
                </td></tr>`;
        });
        h += `</tbody></table></div><button class="btn-close-new" onclick="closeModal()">KAPAT</button>`;
        document.getElementById('statContent').innerHTML = h;
        document.getElementById('statModal').style.display = 'flex';
    };

    window.sesDinle = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        const btn = document.getElementById('micBtn');
        recognition.onstart = () => { btn.innerText = "🔴"; };
        recognition.onend = () => { btn.innerText = "🎤"; };
        recognition.onresult = (event) => {
            const soz = event.results[0][0].transcript.toLowerCase();
            let vIdx = -1;
            if (soz.includes("sabah")) vIdx = 0;
            else if (soz.includes("öğle") || soz.includes("öyle")) vIdx = 1;
            else if (soz.includes("ikindi")) vIdx = 2;
            else if (soz.includes("akşam")) vIdx = 3;
            else if (soz.includes("yatsı")) vIdx = 4;

            if (vIdx !== -1) {
                if (["kılındı", "tamam", "kıldım", "ok"].some(k => soz.includes(k))) gunlukVeriler.vakitler[vIdx].durumlar[0] = 1;
                else if (["cemaat", "cami"].some(k => soz.includes(k))) gunlukVeriler.vakitler[vIdx].durumlar[0] = 2;
                render();
            } else {
                document.getElementById('habInp').value = soz;
            }
        };
        recognition.start();
    };

    function closeModal() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    function toggleSignals(val) { localStorage.setItem('signals_active', val); }
    
    // Açılış
    window.onload = () => {
        const sig = localStorage.getItem('signals_active') === 'true';
        document.getElementById('signalToggle').checked = sig;
        veriYukle();
    };
</script>

</body>
</html>
