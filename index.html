<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri V.22.23</title>
    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; --today-border: #666666; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        .main-title-container { text-align: center; margin: 18px 0; cursor: pointer; }
        .main-title { display: inline-block; font-size: 22px; font-weight: 800; color: #a5d3ff; letter-spacing: 1.8px; text-transform: uppercase; text-shadow: 0 0 15px rgba(165,211,255,0.5); }
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 8px 10px; border-radius: 20px; margin-bottom: 8px; }
        .date-display-box { text-align: center; cursor: pointer; padding: 4px 10px; border-radius: 12px; position: relative; background: rgba(255,255,255,0.05); min-width: 110px; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .info-btn { background: var(--blue); width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; }
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .vakit-isim-box { padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 95px; text-align: center; background: rgba(255,255,255,0.05); position: relative; cursor: pointer; transition: all 0.3s ease; }
        .vakit-ad { font-weight: bold; font-size: 11px; color: #fff; }
        .vakit-success { background: var(--dark-green) !important; border-color: #fff !important; }
        .vakit-soft { background: var(--light-green) !important; border-color: #fff !important; color: #000 !important; }
        .vakit-danger { background: var(--red) !important; border-color: #fff !important; }
        .vakit-warn { background: var(--orange) !important; border-color: #fff !important; }
        .warning-blink { position: absolute; top: -8px; right: -5px; font-size: 14px; animation: blink 0.8s infinite; cursor: help; z-index: 5; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
        .circles-row { display: flex; gap: 8px; align-items: center; }
        .circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .label-text { font-size: 10px; font-weight: 600; opacity: 0.9; margin-top: 4px; color: #a5d3ff; display: block; text-align: center; cursor: pointer; }
        .progress-zone { width: 85px; text-align: center; margin-left: 5px; }
        .progress-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; overflow: hidden; margin: 4px 0; }
        .progress-bar { height: 100%; transition: width 0.3s; }
        .status-badge { font-size: 8px; font-weight: bold; padding: 2px 4px; border-radius: 4px; display: inline-block; text-transform: uppercase; }
        .s0 { background: rgba(255,255,255,0.05); } .s1 { background: var(--dark-green); } .s2 { background: var(--light-green); } .s3 { background: var(--red); } .s4 { background: var(--orange); }
        .genel-wrapper { width: 100%; overflow-x: auto; border-radius: 10px; background: rgba(0,0,0,0.4); padding: 5px; }
        .genel-table { border-collapse: separate; border-spacing: 2px; width: 100%; table-layout: fixed; }
        .genel-table td { height: 16px; border-radius: 2px; text-align: center; font-size: 9px; position: relative; }
        .heatmap-table td { height: 40px !important; font-size: 11px !important; font-weight: bold; }
        .day-num { position: absolute; top: 2px; left: 2px; font-size: 7px; opacity: 0.4; color: white; }
        .v-row-label-full { font-size: 9px; font-weight: bold; position: sticky; left: 0; background: #082d42; width: 65px !important; text-align: left !important; padding-left: 5px; }
        .quality-line { display: flex; gap: 2px; margin-top: 4px; height: 4px; width: 100%; }
        .q-dot { flex: 1; border-radius: 1px; height: 100%; }
        .ozel-card { background: var(--card); padding: 10px 4px; border-radius: 10px; text-align: center; position: relative; }
        .ozel-name { font-size: 11px; font-weight: bold; display: block; margin-bottom: 5px; cursor: pointer; color: #a5d3ff; }
        .is-today-cell { outline: 2px solid var(--today-border); outline-offset: -2px; }
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); /* Arka planı biraz daha şeffaf yaptık */
            z-index: 2000; 
            display: none; 
            align-items: center; /* Dikeyde ortala */
            justify-content: center; /* Yatayda ortala */
            padding: 20px;
        }
        .modal-content { 
            background: #082d42; 
            padding: 20px; 
            width: 90%; /* Mobilde kenarlardan boşluk bırakır */
            max-width: 400px; /* Çok genişlemesini engeller */
            border-radius: 20px; 
            border: 1px solid var(--blue); 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* Derinlik hissi */
        }
        /* Sadece uyarılar için küçük kutu stili */
        .modal-mini { 
            width: 85% !important; 
            max-width: 350px !important; 
            margin: auto;
        }
        /* Diğer raporlar için tam ekran/geniş stil */
        .modal-full { 
            width: 98% !important; 
            max-width: 480px !important; 
            height: auto;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-x { position: absolute; top: 10px; right: 10px; background: var(--red); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 8px; z-index: 1000; border-radius: 15px 15px 0 0; }
        input[type="text"] { flex: 1; border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; }
        .arsiv-link { font-size: 8px; color: var(--red); opacity: 0.6; cursor: pointer; text-decoration: underline; margin-top: 4px; display: block; }
        .type-select-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .type-btn { padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-weight: bold; text-align: center; transition: all 0.2s; }
        .type-btn:hover { background: var(--blue); }
/* Kaydırmalı Buton Tasarımı */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dark-green); }
        input:checked + .slider:before { transform: translateX(20px); }
        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .btn-close-new {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--blue);
            padding: 10px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 25px;
            width: 100%; /* Mobilde tam genişlik, istersen auto yapabilirsin */
        }
        .btn-close-new:hover {
            background: var(--blue);
            color: #000;
        }
    </style>
</head>
<body ontouchstart="hTS(event)" ontouchend="hTE(event)">
<div class="container">
    <div class="main-title-container" onclick="window.gitBugun()">
        <span class="main-title">Amel Defteri</span><span style="font-size:9px; opacity:0.4; vertical-align:super; margin-left:4px;">V.22.23</span>
    </div>
    <div class="nav-header">
        <button class="nav-btn" onclick="degistirTarih(-1)">❮</button>
        <div class="date-display-box">
            <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
            <div id="isToday" style="font-size: 9px; color: var(--light-green); font-weight:bold;"></div>
            <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
        </div>
        <button class="nav-btn" onclick="degistirTarih(1)">❯</button>
        <div style="display:flex; gap:4px; margin-left:5px;">
            <button class="nav-btn" style="background:var(--blue); font-size: 9px; padding: 8px;" onclick="showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 9px; padding: 8px;" onclick="showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>
    <div id="vakitList"></div>
    <div id="ozelList" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; margin-top:5px;"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <div id="statTitle" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#a5d3ff; text-transform:uppercase;"></div>
        <div id="calGrid"></div>
        <button class="btn-close-new" onclick="closeModal()">Kapat</button>
    </div>
</div>

<div id="typeModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--blue); margin-top:10px;">Amel Tipi Seçin</h3>
        <p id="pendingAmelAd" style="text-align:center; font-size:12px; opacity:0.7;"></p>
        <div class="type-select-btns">
            <div class="type-btn" onclick="finalEkle('renk')">🔵 Renk Bazlı (Daire)</div>
            <div class="type-btn" onclick="finalEkle('sayi')">🔢 Sayı Bazlı (Miktar)</div>
        </div>
        <div style="margin-top: 25px;">
            <button class="btn-close-new" onclick="document.getElementById('typeModal').style.display='none'">VAZGEÇ</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeSettings()">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
       <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:15px;">
            <span style="font-size:14px; font-weight:bold;">Farkındalık Sinyalleri (⚠️)</span>
            <label class="switch">
                <input type="checkbox" id="signalToggle" onchange="toggleSignals(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button class="nav-btn" style="width:100%; margin-bottom:10px;" onclick="exportData()">💾 Yedekle</button>
        <button class="nav-btn" style="width:100%;" onclick="importData()">📂 Geri Yükle</button>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel/görev...">
    <button class="nav-btn" style="background:var(--dark-green); font-weight:bold;" onclick="yeniEkle()">EKLE</button>
   <button id="micBtn" onclick="window.sesDinle()" style="background:none; border:none; font-size:22px; cursor:pointer; transition: 0.3s;">🎤</button>
    <div class="menu-item" onclick="window.analizEt()" title="Analiz">🤖</div>
    <button onclick="openSettings()" style="background:none; border:none; font-size:22px;">⚙️</button>
</div>

<script>
   // Swipe (Kaydırma) Mantığı
    let xS = null;
    function hTS(e) { xS = e.touches[0].clientX; }
    function hTE(e) {
        if (!xS || document.getElementById('statModal').style.display === 'block') return;
        let xD = xS - e.changedTouches[0].clientX;
        if (Math.abs(xD) > 70) { 
            if (xD > 0) degistirTarih(1); // Sola kaydırınca sonraki gün
            else degistirTarih(-1);        // Sağa kaydırınca önceki gün
        }
        xS = null;
    }
// ⚠️ Tıklanınca açılan detay penceresi
    window.showVDetail = (e, vIdx) => {
        e.stopPropagation(); // Kartın ısı haritasını açmasını engelle
        let res = "";
        for(let i=1; i<=2; i++){
            let d = new Date(seciliTarih); d.setDate(d.getDate()-i);
            let v = JSON.parse(localStorage.getItem(getLocalKey(d)));
            // Son 2 günün eksiklerini bul
            let eksikler = v ? v.vakitler[vIdx].durumlar.map((s,idx)=>s===0?basliklar[idx]:null).filter(n=>n) : ["Kayıt Yok"];
            res += `<p style='border-bottom:1px solid rgba(255,255,255,0.1); padding:5px;'><b>${d.getDate()}/${d.getMonth()+1}:</b> ${eksikler.length?eksikler.join(", "):"Eksik Yok"}</p>`;
        }
        document.getElementById('statTitle').innerText = vakitler[vIdx] + " Uyarı Sebebi";
        document.getElementById('calGrid').innerHTML = `<div style='font-size:13px; text-align:left;'>Bu vakit son 2 gündür aksatıldığı için uyarı veriliyor:<br><br>${res}</div>`;
        document.getElementById('statModal').style.display = 'flex';
    }
// Özel Amel Uyarı Detayı
    window.showODetail = (e, oIdx) => {
        e.stopPropagation();
        let ozel = gunlukVeriler.ozeller[oIdx];
        document.getElementById('statTitle').innerText = ozel.ad + " Uyarı Sebebi";
        document.getElementById('calGrid').innerHTML = `<div style='font-size:13px; text-align:left;'>Bu amel son 2 gündür boş geçildiği için dikkat çekmek amacıyla yanıp sönüyor.</div>`;
        document.getElementById('statModal').style.display = 'flex';
    }
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let signalsActive = localStorage.getItem('amel_signals_active') !== 'false';
    let pendingName = "";
    let currentHeatmapId = null;
    let currentHeatmapType = null;
    let currentHeatmapSubIdx = null;

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }
    function toggleSignals(val) { signalsActive = val; localStorage.setItem('amel_signals_active', val); render(); }
    function isTodayCheck(d, m, y) { let today = new Date(); return d === today.getDate() && m === today.getMonth() && y === today.getFullYear(); }
    function isFuture() { let today = new Date(); today.setHours(0,0,0,0); let check = new Date(seciliTarih); check.setHours(0,0,0,0); return check > today; }

    function getWarningData(vIdx) {
        if(!signalsActive || isFuture()) return null;
        const bugunDurum = gunlukVeriler.vakitler[vIdx].durumlar;
        let streaks = [0, 0, 0];
        for(let i=1; i<=3; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.vakitler[vIdx]) {
                const dur = val.vakitler[vIdx].durumlar;
                if(dur[0] === 0 || dur[0] === 3) streaks[0]++;
                if(dur[1] === 0) streaks[1]++;
                if(dur[2] === 0) streaks[2]++;
            } else { streaks[0]++; streaks[1]++; streaks[2]++; }
        }
        let fWarn = (streaks[0] >= 3 && (bugunDurum[0] === 0 || bugunDurum[0] === 3));
        let sWarn = (streaks[1] >= 3 && bugunDurum[1] === 0);
        let tWarn = (streaks[2] >= 3 && bugunDurum[2] === 0);
        return (fWarn || sWarn || tWarn) ? {streaks, fWarn, sWarn, tWarn} : null;
    }

    function getOzelWarning(ozelIdx) {
        if(!signalsActive || isFuture()) return false;
        const ozelBugun = gunlukVeriler.ozeller[ozelIdx];
        if(!ozelBugun || (ozelBugun.durum != 0 && ozelBugun.durum !== "")) return false;
        let count = 0;
        for(let i=1; i<=2; i++) {
            let d = new Date(seciliTarih); d.setDate(d.getDate() - i);
            let val = JSON.parse(localStorage.getItem(getLocalKey(d)));
            if(val && val.ozeller) {
                let o = val.ozeller.find(x => x.ad === ozelBugun.ad);
                if(!o || o.durum == 0 || o.durum === "" || o.durum === 0) count++;
            } else { count++; }
        }
        return count >= 2;
    }
window.analizEt = function() {
    let veriler = [];
    let bugun = new Date();
    
    // Kıyaslama için toplamda son 30 günü tara
    for (let i = 0; i < 30; i++) {
        let d = new Date();
        d.setDate(bugun.getDate() - i);
        let k = getLocalKey(d);
        let v = JSON.parse(localStorage.getItem(k));
        if (v) veriler.push({ fark: i, veri: v });
    }

    if (veriler.length < 5) {
        alert("Sağlıklı bir trend analizi için en az 5 günlük veri girişi yapılmış olmalı hocam.");
        return;
    }

    // Gruplandırma: Son 15 gün vs Önceki 15 gün
    let son15 = { kaza: 0, cemaat: 0, puan: 0, say: 0 };
    let onceki15 = { kaza: 0, cemaat: 0, puan: 0, say: 0 };

    veriler.forEach(item => {
        let hedef = (item.fark < 15) ? son15 : onceki15;
        hedef.say++;
        
        item.veri.vakitler.forEach(v => {
            if (v.durumlar[0] === 3) hedef.kaza++;
            if (v.durumlar[0] === 2) hedef.cemaat++;
            
            // Puan hesaplama mantığı (Trend için ortalama puan)
            let p = 0;
            if ((v.durumlar[0] === 1 || v.durumlar[0] === 2) && v.durumlar[1] > 0 && (v.durumlar[2] === 1 || v.durumlar[2] === 2)) p = 100;
            else p = (v.durumlar[0] > 0 ? 40 : 0) + (v.durumlar[1] > 0 ? 30 : 0) + (v.durumlar[2] > 0 ? 30 : 0);
            hedef.puan += p;
        });
    });

    const sonPuanAvg = Math.round(son15.puan / (son15.say * 5 || 1));
    const oncekiPuanAvg = Math.round(onceki15.puan / (onceki15.say * 5 || 1));
    const kazaFark = son15.kaza - onceki15.kaza;
    const cemaatFark = son15.cemaat - onceki15.cemaat;

    // Arayüz Oluşturma
    let h = `<div style="text-align:left; font-size:13px; color:#eee;">`;
    h += `<h3 style="color:#a5d3ff; text-align:center; margin-bottom:15px;">📊 PERFORMANS TRENDİ</h3>`;

    // 1. Genel Durum ve Kıyaslama
    let trendIcon = sonPuanAvg >= oncekiPuanAvg ? "📈" : "📉";
    let trendRenk = sonPuanAvg >= oncekiPuanAvg ? "#90ee90" : "#e74c3c";
    
    h += `<div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between;">
                <span>Genel Puan Ortalaması:</span>
                <b style="color:${trendRenk}">${trendIcon} %${sonPuanAvg}</b>
            </div>
            <div style="font-size:10px; opacity:0.6;">Önceki 15 gün: %${oncekiPuanAvg} idi.</div>
          </div>`;

    // 2. Detaylı Farklar
    h += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
            <div style="background:rgba(231,76,60,0.1); padding:8px; border-radius:8px; border:1px solid rgba(231,76,60,0.2);">
                <div style="font-size:10px; color:var(--red);">KAZA DURUMU</div>
                <b style="font-size:16px;">${son15.kaza} Vakit</b>
                <div style="font-size:9px;">${kazaFark > 0 ? '🔺 Artış: '+kazaFark : (kazaFark < 0 ? '🟢 Azalma: '+Math.abs(kazaFark) : '➖ Değişim yok')}</div>
            </div>
            <div style="background:rgba(34,139,34,0.1); padding:8px; border-radius:8px; border:1px solid rgba(144,238,144,0.2);">
                <div style="font-size:10px; color:var(--light-green);">CEMAAT İSTİKRARI</div>
                <b style="font-size:16px;">${son15.cemaat} Vakit</b>
                <div style="font-size:9px;">${cemaatFark > 0 ? '🟢 Artış: '+cemaatFark : (cemaatFark < 0 ? '🔻 Azalma: '+Math.abs(cemaatFark) : '➖ Değişim yok')}</div>
            </div>
          </div>`;

    // 3. YZ Yorumu
    h += `<div style="background:var(--blue); padding:12px; border-radius:10px; color:white; font-size:12px; border-left:5px solid #2980b9;">
            <b>🤖 YZ Strateji Notu:</b><br>`;
    
    if (kazaFark > 0) {
        h += `Dikkat hocam! Son 15 günde kazaya kalan namaz sayısında <u>${kazaFark} vakitlik</u> bir artış var. Bu durum genelde uyku düzeneği veya günlük yoğunluktan kaynaklanır. Yarından itibaren bir vakti "odak vakit" seçip onu asla kaçırmayarak trendi geri çevirebiliriz.`;
    } else if (cemaatFark < 0) {
        h += `Cemaatle kılma sayın <u>${Math.abs(cemaatFark)} vakit</u> gerilemiş. Sosyal çevrenle veya camiye gidiş yolunla ilgili bir engel mi var? Küçük bir planlama ile bu sayıyı tekrar yukarı çekebilirsin.`;
    } else if (sonPuanAvg > oncekiPuanAvg) {
        h += `Mükemmel bir gidişat! Hem puanını yükseltmişsin hem de disiplini korumuşsun. Bu momentumu bozmadan devam edersen alışkanlıkların kalıcı birer yaşam tarzına dönüşecek.`;
    } else {
        h += `Dengeli gidiyorsun. Mevcut istikrarın iyi, ancak cemaat veya sünnet tamamlama gibi küçük alanlarda %5'lik bir iyileştirme seni "zirve" seviyesine taşıyacaktır.`;
    }
    h += `</div></div>`;

    document.getElementById('statTitle').innerText = "YZ PERFORMANS ANALİZİ";
    document.getElementById('calGrid').innerHTML = h;
    document.getElementById('statModal').style.display = 'flex';
};
    function veriYukle() {
        const key = getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        const seciliTarihStr = seciliTarih.toISOString().split('T')[0]; // 👈 Mevcut günün metni

        // Sadece eklenme tarihi bugünden küçük veya eşit olanları getir
        const globalListe = getGlobalOzeller().filter(g => {
        // Eğer amelde tarih yoksa (eskiden eklenenler), her zaman göster
            if(!g.eklenmeTarihi) return !g.arsiv;
        // Seçili tarih amelin doğum tarihinden sonraysa göster
            return !g.arsiv && seciliTarihStr >= g.eklenmeTarihi;
        });

        if (kaydedilmis) {
        gunlukVeriler = kaydedilmis;
        // Mevcut verideki özelleri global listeye göre süz
        gunlukVeriler.ozeller = gunlukVeriler.ozeller.filter(o => globalListe.some(g => g.id === o.id));
        globalListe.forEach(g => { 
            if(!gunlukVeriler.ozeller.some(o => o.id === g.id)) 
                gunlukVeriler.ozeller.push({...g, durum: (g.tip === 'sayi' ? "" : 0)}); 
        });
    } else {
        gunlukVeriler = { 
            vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
            ozeller: globalListe.map(g => ({ ...g, durum: (g.tip === 'sayi' ? "" : 0) })) 
        };
    }
    render();
}

    function render() {
        localStorage.setItem(getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
        document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('isToday').innerText = (getLocalKey(new Date()) === getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' }).toUpperCase();
        const vDiv = document.getElementById('vakitList'); vDiv.innerHTML = '';
       gunlukVeriler.vakitler.forEach((v, vIdx) => {
    let p = 0; const f = v.durumlar[0], s = v.durumlar[1], t = v.durumlar[2];
    
    // --- YENİ PUAN VE YILDIZ KONTROLÜ ---
    const cemaatMi = (f === 2);
    
    // Farz + Sünnet + Tesbihat (1 veya 2) tam ise 100 puan
    if ((f === 1 || f === 2) && s > 0 && (t === 1 || t === 2)) {
        p = 100;
    } else {
        // Tam değilse orijinal puanlama sistemin
        if (f === 1) p += 30; else if (f === 2) p += 50; else if (f === 4) p += 20;
        if (s > 0) p += 25; if (t === 1 || t === 2) p += 25;
    }

    // Renk: Cemaat ise açık yeşil, değilse puan durumuna göre senin renklerin
    let bCol = cemaatMi ? "#90ee90" : ((f > 0 || s > 0 || t > 0) ? (p === 100 ? "#90ee90" : (p >= 50 ? "#228b22" : (p > 30 ? "#f39c12" : "#e74c3c"))) : "rgba(255,255,255,0.4)");
    // -----------------------------------     
            // Uyarı verisini al
            let wData = getWarningData(vIdx);
            let boxClass = (f === 1 && s > 0 && (t === 1 || t === 2)) ? "vakit-success" : (f === 2 ? "vakit-soft" : (f === 3 ? "vakit-danger" : (f === 4 ? "vakit-warn" : "")));
            
            vDiv.innerHTML += `<div class="habit-card">
    <div class="vakit-isim-box ${boxClass}" onclick="window.showHeatmap(${vIdx}, 'vakit')">
        ${wData ? `<span class="warning-blink" onclick="window.showVDetail(event, ${vIdx})">⚠️</span>` : ''}
        <span class="vakit-ad">${vakitler[vIdx]}</span>
    </div>
    <div class="circles-row">
        ${basliklar.map((b, bI) => `<div style="text-align:center"><div class="circle s${v.durumlar[bI]}" onclick="window.degis(${vIdx}, ${bI}, 'vakit')"></div><span class="label-text" onclick="window.showHeatmap(${vIdx}, 'vakit_sub', ${bI})">${b}</span></div>`).join('')}
    </div>
    <div class="progress-zone" style="position:relative;">
        <div style="font-size:11px; font-weight:bold;">%${p}</div>
        <div class="progress-bg">
            <div class="progress-bar" style="width:${p}%; background:${bCol}"></div>
        </div>
        ${cemaatMi ? `<span style="position:absolute; top:-10px; right:-2px; font-size:14px; color:#ffeb3b; text-shadow: 0 0 3px #000;">🎖️</span>` : ''}
    </div>
</div>`;
        });
        const oDiv = document.getElementById('ozelList'); oDiv.innerHTML = "";
        gunlukVeriler.ozeller.forEach((o, oIdx) => {
            let ctrl = o.tip === 'sayi' ? `<input type="number" value="${o.durum === 0 ? "" : o.durum}" style="width:80%; background:none; border:1px solid rgba(255,255,255,0.2); color:white; text-align:center; border-radius:5px; font-size:11px;" onchange="window.sayiGuncelle(${oIdx}, this.value)">` : `<div class="circle s${o.durum}" style="width:26px; height:26px; margin:auto;" onclick="window.degis(${oIdx}, 0, 'ozel_renk')"></div>`;
            
            // Özel ameller için uyarı tıklama fonksiyonunu ekliyoruz
            let wHtml = getOzelWarning(oIdx) ? `<span class="warning-blink" style="right:2px; top:-5px;" onclick="window.showODetail(event, ${oIdx})">⚠️</span>` : '';
            
            oDiv.innerHTML += `<div class="ozel-card">${wHtml}<b class="ozel-name" onclick="window.showHeatmap('${o.ad}', 'ozel')">${o.ad}</b>${ctrl}<span class="arsiv-link" onclick="window.arsivle('${o.id}')">Arşiv</span></div>`;
        });
    }

    window.showHeatmap = (id, tip, subIdx = null) => {
        currentHeatmapId = id; currentHeatmapType = tip; currentHeatmapSubIdx = subIdx;
        let sonGun = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        let ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;"><button class="nav-btn" onclick="window.heatmapNav(-1)">❮</button><div><div style="font-size:10px; opacity:0.7">${ayYilStr}</div><div style="font-size:14px">${tip === 'vakit' ? vakitler[id] : (tip === 'vakit_sub' ? vakitler[id].split(" ")[0] + " - " + basliklar[subIdx] : id)}</div></div><button class="nav-btn" onclick="window.heatmapNav(1)">❯</button></div>`;
        let h = `<div class="genel-wrapper"><table class="genel-table heatmap-table"><tr>`;
        for(let d=1; d<=sonGun; d++) {
            let isToday = isTodayCheck(d, raporTarih.getMonth(), raporTarih.getFullYear());
            let val = JSON.parse(localStorage.getItem(getLocalKey(new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d))));
            let c = "s0", txt = "";
            if(val) {
                if(tip === 'vakit') c = `s${val.vakitler[id].durumlar[0]}`;
                else if(tip === 'vakit_sub') c = `s${val.vakitler[id].durumlar[subIdx]}`;
                else { let o = val.ozeller.find(x => x.ad === id); if(o) { c = o.tip === 'sayi' ? (o.durum > 0 ? 's1' : 's0') : `s${o.durum}`; txt = (o.tip === 'sayi' && o.durum > 0) ? o.durum : ""; } }
            }
            h += `<td class="${c} ${isToday ? 'is-today-cell' : ''}"><span class="day-num">${d}</span>${txt}</td>`;
            if(d % 7 === 0) h += `</tr><tr>`;
        }
        document.getElementById('calGrid').innerHTML = h + `</tr></table></div>`;
        document.getElementById('statModal').style.display = 'flex';
        document.querySelector('#statModal .modal-content').className = 'modal-content modal-full';
    };

    window.showGeneralReport = () => {
        const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;"><button class="nav-btn" onclick="window.ayRaporuDegis(-1)">❮</button><span>${ayYilStr}</span><button class="nav-btn" onclick="window.ayRaporuDegis(1)">❯</button></div>`;
        let sonGun = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate();
        let table = `<div class="genel-wrapper"><table class="genel-table"><thead><tr><th class="v-row-label-full">Vakit</th>`;
        for (let d = 1; d <= sonGun; d++) table += `<th style="font-size:7px;">${d}</th>`;
        table += `</tr></thead><tbody>`;
        vakitler.forEach((vAd, vIdx) => {
            table += `<tr><td class="v-row-label-full">${vAd.split(" ")[0]}</td>`;
            for (let d = 1; d <= sonGun; d++) {
                let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d))));
                table += `<td class="s${(v && v.vakitler[vIdx]) ? v.vakitler[vIdx].durumlar[0] : 0}"></td>`;
            }
            table += `</tr>`;
        });
        table += `</tbody></table></div>`;
        let today = new Date(); let dayOfW = today.getDay(); let diff = today.getDate() - dayOfW + (dayOfW === 0 ? -6 : 1);
        let monday = new Date(today.setDate(diff)); let qTrend = [[],[],[],[],[]];
        vakitler.forEach((v, vIdx) => {
            for (let i = 0; i < 7; i++) {
                let d = new Date(monday); d.setDate(monday.getDate() + i);
                let vT = JSON.parse(localStorage.getItem(getLocalKey(d)));
                let q = 'rgba(255,255,255,0.05)';
                if(vT && vT.vakitler[vIdx]) {
                    if(vT.vakitler[vIdx].durumlar[1] > 0 && vT.vakitler[vIdx].durumlar[2] > 0) q = 'var(--light-green)';
                    else if(vT.vakitler[vIdx].durumlar[1] > 0) q = 'var(--orange)';
                    else if(vT.vakitler[vIdx].durumlar[0] > 0) q = 'var(--red)';
                }
                qTrend[vIdx].push(q);
            }
        });
        let analiz = `<div style="margin-top:15px; font-size:11px;"><b>Haftalık Vakit Kalitesi:</b>`;
        vakitler.forEach((v, i) => { analiz += `<div style="margin:8px 0;">${v.split(" ")[0]} <div class="quality-line">${qTrend[i].map(c => `<div class="q-dot" style="background:${c}"></div>`).join('')}</div></div>`; });
        document.getElementById('calGrid').innerHTML = table + analiz;
        document.getElementById('statModal').style.display = 'flex';
        document.querySelector('#statModal .modal-content').className = 'modal-content modal-full';
    };

    window.yeniEkle = () => { pendingName = document.getElementById('habInp').value; if(!pendingName) return; document.getElementById('pendingAmelAd').innerText = `"${pendingName}" için tip seçiniz:`; document.getElementById('typeModal').style.display = 'flex'; };
   window.finalEkle = (tip) => { 
    let g = getGlobalOzeller(); 
    // Tarihi YYYY-MM-DD formatında alıyoruz ki kolay kıyaslayalım
    const bugunStr = seciliTarih.toISOString().split('T')[0]; 
    
    const yeni = { 
        id: 'id_'+Date.now(), 
        ad: pendingName, 
        tip: tip,
        eklenmeTarihi: bugunStr // 👈 Bu satırı ekledik
    }; 
    
    g.push(yeni); 
    localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); 
    document.getElementById('habInp').value=""; 
    gunlukVeriler.ozeller.push({...yeni, durum: (tip === 'sayi' ? "" : 0)}); 
    document.getElementById('typeModal').style.display = 'none'; 
    render(); 
};
    window.degis = (i, s, t) => { if (t === 'ozel_renk') gunlukVeriler.ozeller[i].durum = (gunlukVeriler.ozeller[i].durum + 1) % 5; else { let d = gunlukVeriler.vakitler[i].durumlar[s]; if (s === 0) d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 4 : (d === 4) ? 3 : 0; else if (s === 1) d = (d === 0) ? 1 : (d === 1) ? 3 : 0; else d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 3 : 0; gunlukVeriler.vakitler[i].durumlar[s] = d; } render(); };
    window.arsivle = (id) => { if(!confirm("Arşivlensin mi?")) return; let g = getGlobalOzeller(); let idx = g.findIndex(x => x.id === id); if(idx > -1) { g[idx].arsiv = true; localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); gunlukVeriler.ozeller = gunlukVeriler.ozeller.filter(o => o.id !== id); render(); } };
    window.degistirTarih = (n) => { seciliTarih.setDate(seciliTarih.getDate() + n); raporTarih = new Date(seciliTarih); veriYukle(); };
    window.ayRaporuDegis = (n) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showGeneralReport(); };
    window.heatmapNav = (n) => { raporTarih.setMonth(raporTarih.getMonth() + n); window.showHeatmap(currentHeatmapId, currentHeatmapType, currentHeatmapSubIdx); };
    window.tarihSec = (v) => { if(v) { seciliTarih = new Date(v); raporTarih = new Date(seciliTarih); veriYukle(); } };
    window.gitBugun = () => { seciliTarih = new Date(); raporTarih = new Date(); veriYukle(); };
    window.closeModal = () => { 
    document.getElementById('statModal').style.display = 'none'; 
    // Pencereyi kapatırken stil sınıfını temizliyoruz ki bir sonraki açılış karışmasın
    document.querySelector('#statModal .modal-content').className = 'modal-content';
    raporTarih = new Date(seciliTarih); 
};
    window.sesDinle = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Tarayıcı desteği yok.");
            return;
        }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        const btn = document.getElementById('micBtn');
        
        recognition.onstart = () => { 
            btn.style.transform = "scale(1.3)"; 
            btn.innerText = "🔴"; 
        };
        
        recognition.onend = () => { 
            btn.style.transform = "scale(1)"; 
            btn.innerText = "🎤"; 
        };

        recognition.onresult = (event) => {
            const soz = event.results[0][0].transcript.toLowerCase();
            console.log("Duyulan:", soz);
            
            let vIdx = -1;
            if (soz.includes("sabah")) vIdx = 0;
            else if (soz.includes("öğle") || soz.includes("öyle")) vIdx = 1;
            else if (soz.includes("ikindi")) vIdx = 2;
            else if (soz.includes("akşam")) vIdx = 3;
            else if (soz.includes("yatsı")) vIdx = 4;

            if (vIdx !== -1) {
                const onayKelimeleri = ["kılındı", "tamam", "kıldım", "ok", "kıl", "oldu", "yaptım"];
                const cemaatKelimeleri = ["cemaat", "cami", "toplu"];

                if (onayKelimeleri.some(k => soz.includes(k))) {
                    gunlukVeriler.vakitler[vIdx].durumlar[0] = 1; 
                    render();
                } 
                else if (cemaatKelimeleri.some(k => soz.includes(k))) {
                    gunlukVeriler.vakitler[vIdx].durumlar[0] = 2; 
                    render();
                }
            } else {
                const inputAlan = document.getElementById('habInp');
                if(inputAlan) inputAlan.value = soz;
            }
        };
        
        recognition.start();
    };
    window.openSettings = () => { 
        document.getElementById('settingsModal').style.display = 'flex'; 
        // Butonun konumunu gerçek duruma göre güncelle (Hatanın çözümü):
        document.getElementById('signalToggle').checked = signalsActive; 
    };
    window.closeSettings = () => { document.getElementById('settingsModal').style.display = 'none'; };
    window.sayiGuncelle = (i, v) => { gunlukVeriler.ozeller[i].durum = v === "" ? "" : parseFloat(v); render(); };
    window.showHelp = () => { document.getElementById('statTitle').innerHTML = `<b>DETAYLI REHBER</b>`; document.getElementById('calGrid').innerHTML = `<div style="font-size:12px; line-height:1.6; opacity:0.8;"><p><b style="color:var(--orange)">⚠️ Uyarılar:</b> Namazlar için 3 gün, ameller için 2 gün aksama olursa yanar.</p><p><b style="color:var(--light-green)">● İlerleme Puanları:</b> Farz %30, Sünnet %25, Tesbihat %25.</p><p><b style="color:var(--blue)">📊 Kalite:</b> Kırmızı (Farz), Turuncu (+Sünnet), Yeşil (+Tesbihat).</p></div>`; document.getElementById('statModal').style.display = 'flex'; };
    window.exportData = () => { let all = {}; for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); if(k.startsWith('amel_')) all[k] = localStorage.getItem(k); } let b = new Blob([JSON.stringify(all)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `amel_yedek.json`; a.click(); };
    window.importData = () => { let i = document.createElement('input'); i.type='file'; i.onchange=e=>{ let fr=new FileReader(); fr.onload=()=>{ let d=JSON.parse(fr.result); Object.keys(d).forEach(k=>localStorage.setItem(k,d[k])); location.reload(); }; fr.readAsText(e.target.files[0]); }; i.click(); };
    window.showYearlyReport = () => { const grid = document.getElementById('calGrid'); const yil = new Date().getFullYear(); document.getElementById('statTitle').innerHTML = `<b>${yil} YILI ÖZETİ</b>`; let kaza = { "Sabah": 0, "Öğle": 0, "İkindi": 0, "Akşam": 0, "Yatsı": 0 }, arsiv = {}; for (let m = 0; m < 12; m++) { for (let d = 1; d <= 31; d++) { let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(yil,m,d)))); if (!v) continue; v.vakitler.forEach((vk, i) => { if(vk.durumlar[0] === 3) kaza[Object.keys(kaza)[i]]++; }); (v.ozeller || []).forEach(vo => { if (!arsiv[vo.ad]) arsiv[vo.ad] = { t: 0, tip: vo.tip }; if (vo.tip === 'sayi') arsiv[vo.ad].t += parseFloat(vo.durum || 0); else if (vo.durum > 0) arsiv[vo.ad].t += 1; }); } } let h = `<div style="max-height:55vh; overflow-y:auto;"><table style="width:100%; font-size:12px;"><thead><tr style="color:var(--red);"><th style="text-align:left;">Kaza Namazları</th><th style="text-align:right;">Adet</th></tr></thead><tbody>`; Object.keys(kaza).forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right;">${kaza[k]}</td></tr>`; }); h += `</tbody></table><table style="width:100%; margin-top:15px; font-size:12px;"><thead><tr style="color:var(--blue);"><th style="text-align:left;">Özel Ameller</th><th style="text-align:right;">Değer</th></tr></thead><tbody>`; Object.keys(arsiv).sort().forEach(k => {
  // showHeatmap içindeki ilgili satırı bununla güncelle:
h += `<tr>
        <td style="padding:8px 0;">${k}</td>
        <td style="text-align:right;">
            ${arsiv[k].t} 
            <span onclick="tamamenSil('${k.replace(/'/g, "\\'")}')" 
                  style="cursor:pointer; margin-left:15px; color:var(--red); font-size:16px;">🗑️</span>
        </td>
      </tr>`;
}); grid.innerHTML = h + `</tbody></table></div>`; document.getElementById('statModal').style.display = 'flex'; };
    
    veriYukle();
    function tumModallariKapat() {
    // Sayfadaki tüm modal sınıfına sahip elementleri bul ve gizle
    const modallar = document.querySelectorAll('.modal');
    modallar.forEach(m => m.style.display = 'none');
}
window.tamamenSil = (amelAd) => {
    if(confirm(`'${amelAd}' her yerden silinecek. Emin misiniz?`)) {
        
        // 1. Global listeyi temizle
        let g = JSON.parse(localStorage.getItem('amel_global_ozeller')) || [];
        g = g.filter(a => a.ad.trim() !== amelAd.trim());
        localStorage.setItem('amel_global_ozeller', JSON.stringify(g));

        // 2. Tüm geçmişi tara ve temizle
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key && key.startsWith('amel_')) {
                let gunlukVeri = JSON.parse(localStorage.getItem(key));
                if (gunlukVeri && gunlukVeri.ozeller) {
                    gunlukVeri.ozeller = gunlukVeri.ozeller.filter(o => o.ad.trim() !== amelAd.trim());
                    localStorage.setItem(key, JSON.stringify(gunlukVeri));
                }
            }
        }

        // 3. ANINDA GÜNCELLEME SİHİRBBAZLIĞI
        // Önce ana ekranı tazele
        veriYukle(); 
        
        // Rapor modalını kapat ve 10 milisaniye sonra tekrar aç (Veriler sıfırlanmış olarak gelir)
        closeModal(); 
        setTimeout(() => {
            showHeatmap();
        }, 10);

        console.log("İşlem tamam.");
    }
}
</script>
</body>
</html>
