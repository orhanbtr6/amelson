<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d59">
    <title>Amel Defteri V.22.20</title>
    <style>
        :root { --bg: #0b3d59; --card: rgba(255, 255, 255, 0.12); --light-green: #90ee90; --dark-green: #228b22; --red: #e74c3c; --orange: #f39c12; --blue: #3498db; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 150px; }
        .main-title-container { text-align: center; margin: 18px 0; cursor: pointer; }
        .main-title { display: inline-block; font-size: 22px; font-weight: 800; color: #a5d3ff; letter-spacing: 1.8px; text-transform: uppercase; text-shadow: 0 0 15px rgba(165,211,255,0.5); }
        
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 8px 10px; border-radius: 20px; margin-bottom: 8px; }
        .date-display-box { text-align: center; cursor: pointer; padding: 4px 10px; border-radius: 12px; position: relative; background: rgba(255,255,255,0.05); min-width: 110px; }
        #hiddenDate { position: absolute; opacity: 0; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .info-btn { background: var(--blue); width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; }
        
        .habit-card { background: var(--card); border-radius: 15px; padding: 10px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .vakit-isim-box { padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-width: 95px; text-align: center; background: rgba(255,255,255,0.05); transition: 0.3s; }
        .vakit-ad { font-weight: bold; font-size: 11px; color: #fff; }
        
        /* Dinamik Renk Sınıfları */
        .cemaat-glow { background: rgba(144, 238, 144, 0.25) !important; border-color: var(--light-green) !important; box-shadow: 0 0 8px rgba(144, 238, 144, 0.2); }
        .kaza-bg { background: var(--orange) !important; border-color: #fff !important; }
        .basari-bg { background: var(--dark-green) !important; }

        .circles-row { display: flex; gap: 8px; align-items: center; }
        .circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .label-text { font-size: 10px; font-weight: 600; opacity: 0.9; margin-top: 4px; color: #a5d3ff; display: block; text-align: center; }
        
        .progress-zone { width: 85px; text-align: center; margin-left: 5px; }
        .progress-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; overflow: hidden; margin: 4px 0; }
        .progress-bar { height: 100%; transition: width 0.3s; }
        .status-badge { font-size: 8px; font-weight: bold; padding: 2px 4px; border-radius: 4px; display: inline-block; text-transform: uppercase; }

        .s0 { background: rgba(255,255,255,0.05); } .s1 { background: var(--dark-green); } .s2 { background: var(--light-green); } .s3 { background: var(--red); } .s4 { background: var(--orange); }

        /* Modern Toggle Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 24px; border: 1px solid rgba(255,255,255,0.2); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dark-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .genel-wrapper { width: 100%; overflow-x: auto; border-radius: 10px; background: rgba(0,0,0,0.4); padding: 5px; }
        .genel-table { border-collapse: separate; border-spacing: 2px; width: 100%; table-layout: fixed; min-width: 450px; }
        .genel-table td { height: 16px; border-radius: 2px; text-align: center; }
        .v-row-label-full { font-size: 9px; font-weight: bold; position: sticky; left: 0; background: #082d42; width: 65px !important; text-align: left !important; padding-left: 5px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; overflow-y: auto; padding: 20px 10px; }
        .modal-content { background: #082d42; margin: 0 auto; padding: 15px; width: 100%; max-width: 480px; border-radius: 15px; border: 1px solid var(--blue); position: relative; }
        .close-x { position: absolute; top: 10px; right: 10px; background: var(--red); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #051a26; padding: 12px; display: flex; align-items: center; gap: 8px; z-index: 1000; border-radius: 15px 15px 0 0; }
        input[type="text"] { flex: 1; border-radius: 20px; border: none; padding: 12px; background: rgba(255,255,255,0.1); color: white; outline: none; }
        .arsiv-link { font-size: 8px; color: var(--red); opacity: 0.6; cursor: pointer; text-decoration: underline; margin-top: 2px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title-container" onclick="window.gitBugun()">
        <span class="main-title">Amel Defteri</span><span style="font-size:9px; opacity:0.4; vertical-align:super; margin-left:4px;">V.22.20</span>
    </div>
    <div class="nav-header">
        <button class="nav-btn" onclick="degistirTarih(-1)">❮</button>
        <div class="date-display-box">
            <div id="dispDate" style="font-weight: bold; font-size: 14px;"></div>
            <div id="isToday" style="font-size: 9px; color: var(--light-green); font-weight:bold;"></div>
            <input type="date" id="hiddenDate" onchange="window.tarihSec(this.value)">
        </div>
        <button class="nav-btn" onclick="degistirTarih(1)">❯</button>
        <div style="display:flex; gap:4px; margin-left:5px;">
            <button class="nav-btn" style="background:var(--blue); font-size: 9px; padding: 8px;" onclick="showGeneralReport()">📊 GENEL</button>
            <button class="nav-btn" style="background:var(--orange); font-size: 9px; padding: 8px;" onclick="showYearlyReport()">📅 YILLIK</button>
            <button class="info-btn" onclick="window.showHelp()">i</button>
        </div>
    </div>
    <div id="vakitList"></div>
    <div id="ozelList" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; margin-top:5px;"></div>
</div>

<div id="statModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal()">✕</button>
        <div id="statTitle" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#a5d3ff;"></div>
        <div id="calGrid"></div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeSettings()">✕</button>
        <h3 style="text-align:center; color:var(--blue);">Ayarlar</h3>
        <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:15px;">
            <span style="font-size:14px;">Farkındalık Sinyalleri (⚠/🎨)</span>
            <label class="switch">
                <input type="checkbox" id="signalToggle" onchange="toggleSignals(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button class="nav-btn" style="width:100%; margin-bottom:10px;" onclick="exportData()">💾 Yedekle</button>
        <button class="nav-btn" style="width:100%;" onclick="importData()">📂 Geri Yükle</button>
    </div>
</div>

<div class="footer">
    <input type="text" id="habInp" placeholder="Yeni amel/görev...">
    <button class="nav-btn" style="background:var(--dark-green); font-weight:bold;" onclick="yeniEkle()">EKLE</button>
    <button onclick="openSettings()" style="background:none; border:none; font-size:22px;">⚙️</button>
</div>

<script>
    const vakitler = ["Sabah Namazı", "Öğle Namazı", "İkindi Namazı", "Akşam Namazı", "Yatsı Namazı"];
    const basliklar = ["Farz", "Sünnet", "Tesbihat"];
    let seciliTarih = new Date();
    let raporTarih = new Date();
    let gunlukVeriler = {};
    let signalsActive = localStorage.getItem('amel_signals_active') !== 'false';

    function getLocalKey(t) { return `amel_${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function getGlobalOzeller() { return JSON.parse(localStorage.getItem('amel_global_ozeller')) || []; }

    function toggleSignals(val) { signalsActive = val; localStorage.setItem('amel_signals_active', val); render(); }

    function veriYukle() {
        const key = getLocalKey(seciliTarih);
        const kaydedilmis = JSON.parse(localStorage.getItem(key));
        if (kaydedilmis) gunlukVeriler = kaydedilmis;
        else {
            const globalListe = getGlobalOzeller();
            gunlukVeriler = { 
                vakitler: vakitler.map(v => ({ ad: v, durumlar: [0,0,0] })), 
                ozeller: globalListe.filter(g => !g.arsiv).map(g => ({ ...g, durum: 0 })) 
            };
        }
        render();
    }

    function render() {
        localStorage.setItem(getLocalKey(seciliTarih), JSON.stringify(gunlukVeriler));
        document.getElementById('dispDate').innerText = seciliTarih.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('isToday').innerText = (getLocalKey(new Date()) === getLocalKey(seciliTarih)) ? "BUGÜN" : seciliTarih.toLocaleDateString('tr-TR', { weekday: 'long' }).toUpperCase();
        
        const vDiv = document.getElementById('vakitList'); vDiv.innerHTML = '';
        gunlukVeriler.vakitler.forEach((v, vIdx) => {
            let p = 0; const f = v.durumlar[0], s = v.durumlar[1], t = v.durumlar[2];
            if (f === 1) p += 30; else if (f === 2) p += 50; else if (f === 4) p += 20;
            if (s > 0) p += 25; if (t > 0) p += 25;
            
            let anyInput = (f > 0 || s > 0 || t > 0);
            let badge = anyInput ? (p <= 30 ? "EKSİK" : (p <= 80 ? "UYGUN" : (p <= 90 ? "TAMAMLANDI" : "BAŞARILI"))) : "BEKLEMEDE";
            let bCol = anyInput ? (p === 100 ? "#90ee90" : (p >= 50 ? "#228b22" : (p > 30 ? "#f39c12" : "#e74c3c"))) : "rgba(255,255,255,0.4)";

            // Namaz İsmi Renk Mantığı
            let nameClass = "vakit-isim-box";
            if (f === 2) nameClass += " cemaat-glow";
            else if (f === 3) nameClass += " kaza-bg";
            else if (p >= 80) nameClass += " basari-bg";

            vDiv.innerHTML += `<div class="habit-card">
                <div class="${nameClass}"><span class="vakit-ad">${vakitler[vIdx]}</span></div>
                <div class="circles-row">
                    ${basliklar.map((b, bI) => `<div style="text-align:center"><div class="circle s${v.durumlar[bI]}" onclick="window.degis(${vIdx}, ${bI}, 'vakit')"></div><span class="label-text">${b}</span></div>`).join('')}
                </div>
                <div class="progress-zone">
                    <div style="font-size:11px; font-weight:bold;">%${p}</div>
                    <div class="progress-bg"><div class="progress-bar" style="width:${p}%; background:${bCol}"></div></div>
                    <div class="status-badge" style="color:${bCol}">${badge}</div>
                </div>
            </div>`;
        });

        const oDiv = document.getElementById('ozelList'); oDiv.innerHTML = "";
        gunlukVeriler.ozeller.forEach((o, oIdx) => {
            let ctrl = o.tip === 'sayi' ? `<input type="number" value="${o.durum||""}" style="width:80%; background:none; border:1px solid rgba(255,255,255,0.2); color:white; text-align:center; border-radius:5px; font-size:11px;" onchange="window.sayiGuncelle(${oIdx}, this.value)">` : `<div class="circle s${o.durum}" style="width:26px; height:26px; margin:auto;" onclick="window.degis(${oIdx}, 0, 'ozel_renk')"></div>`;
            oDiv.innerHTML += `<div style="background:var(--card); padding:8px 2px; border-radius:10px; text-align:center; font-size:9px;">
                <b>${o.ad}</b><br>${ctrl}
                <span class="arsiv-link" onclick="window.arsivle('${o.id}')">Arşiv</span>
            </div>`;
        });
    }

    window.gitBugun = () => { seciliTarih = new Date(); veriYukle(); };
    window.degistirTarih = (n) => { seciliTarih.setDate(seciliTarih.getDate() + n); veriYukle(); };
    window.tarihSec = (v) => { if(v) { seciliTarih = new Date(v); veriYukle(); } };

    window.showHelp = () => {
        const grid = document.getElementById('calGrid'); document.getElementById('statTitle').innerHTML = `<b>TAM ÖZELLİK LİSTESİ</b>`;
        grid.innerHTML = `<div style="font-size:12px; line-height:1.5; text-align:left; color:#ccc; max-height:60vh; overflow-y:auto;">
            <p><b style="color:var(--light-green)">● Başarım Durumu:</b> Hiç veri yoksa <b>Beklemede</b> yazar. Giriş yapıldığında %0-30: Eksik, %31-80: Uygun, %81-90: Tamamlandı, %100: Başarılı.</p>
            <p><b style="color:var(--orange)">● Kaza Takibi:</b> Farzı turuncu seçtiğinizde vakit ismi Turuncu yanar. Yıllık raporda otomatik sayılır.</p>
            <p><b style="color:var(--dark-green)">● %80 Hedefi:</b> Bir vakit %80 başarıya ulaştığında ismi Yeşil yanar.</p>
            <p><b style="color:var(--light-green)">● Cemaat:</b> Farz cemaatle (açık yeşil) kılındığında vakit parlar.</p>
            <p><b style="color:var(--blue)">● Arşivleme:</b> Eklediğiniz görevleri "Arşiv" butonuyla ana ekrandan gizleyebilir, verilerini Yıllık bölümde görebilirsiniz.</p>
            <p><b style="color:var(--red)">● Yedekleme:</b> Ayarlar kısmından tüm verilerinizi JSON olarak indirip geri yükleyebilirsiniz.</p>
        </div>`;
        document.getElementById('statModal').style.display = 'block';
    };

    window.degis = (i, s, t) => {
        if (t === 'ozel_renk') gunlukVeriler.ozeller[i].durum = (gunlukVeriler.ozeller[i].durum + 1) % 5;
        else {
            let d = gunlukVeriler.vakitler[i].durumlar[s];
            if (s === 0) d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 4 : (d === 4) ? 3 : 0;
            else if (s === 1) d = (d === 0) ? 1 : (d === 1) ? 3 : 0;
            else d = (d === 0) ? 1 : (d === 1) ? 2 : (d === 2) ? 3 : 0;
            gunlukVeriler.vakitler[i].durumlar[s] = d;
        } render();
    };

    window.arsivle = (id) => { if(confirm("Arşivlensin mi?")) { let g = getGlobalOzeller(); let idx = g.findIndex(x => x.id === id); if(idx > -1) { g[idx].arsiv = true; localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); veriYukle(); } } };
    window.yeniEkle = () => { const ad = document.getElementById('habInp').value; if(!ad) return; let g = getGlobalOzeller(); g.push({ id: 'id_'+Date.now(), ad, tip: confirm("Sayısal mı?")?'sayi':'renk' }); localStorage.setItem('amel_global_ozeller', JSON.stringify(g)); document.getElementById('habInp').value=""; veriYukle(); };
    window.showGeneralReport = () => { /* Mevcut tablo mantığı korundu */ const grid = document.getElementById('calGrid'); const ayYilStr = raporTarih.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' }); document.getElementById('statTitle').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;"><button class="nav-btn" onclick="window.ayRaporuDegis(-1)">❮</button><span>${ayYilStr}</span><button class="nav-btn" onclick="window.ayRaporuDegis(1)">❯</button></div>`; let sonGun = new Date(raporTarih.getFullYear(), raporTarih.getMonth() + 1, 0).getDate(); let table = `<div class="genel-wrapper"><table class="genel-table"><thead><tr><th class="v-row-label-full">Vakit</th>`; for (let d = 1; d <= sonGun; d++) table += `<th style="font-size:7px;">${d}</th>`; table += `</tr></thead><tbody>`; vakitler.forEach((vAd, vIdx) => { table += `<tr><td class="v-row-label-full">${vAd.split(" ")[0]}</td>`; for (let d = 1; d <= sonGun; d++) { let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(raporTarih.getFullYear(), raporTarih.getMonth(), d)))); table += `<td class="s${(v && v.vakitler[vIdx]) ? v.vakitler[vIdx].durumlar[0] : 0}"></td>`; } table += `</tr>`; }); grid.innerHTML = table + `</tbody></table></div>`; document.getElementById('statModal').style.display = 'block'; };
    window.ayRaporuDegis = (n) => { raporTarih.setMonth(raporTarih.getMonth()+n); window.showGeneralReport(); };
    window.showYearlyReport = () => { const grid = document.getElementById('calGrid'); const yil = new Date().getFullYear(); document.getElementById('statTitle').innerHTML = `<b>${yil} YILI ÖZETİ</b>`; let kaza = { "Sabah": 0, "Öğle": 0, "İkindi": 0, "Akşam": 0, "Yatsı": 0 }, arsiv = {}; for (let m = 0; m < 12; m++) { for (let d = 1; d <= 31; d++) { let v = JSON.parse(localStorage.getItem(getLocalKey(new Date(yil,m,d)))); if (!v) continue; v.vakitler.forEach((vk, i) => { if(vk.durumlar[0] === 3) kaza[Object.keys(kaza)[i]]++; }); (v.ozeller || []).forEach(vo => { if (!arsiv[vo.ad]) arsiv[vo.ad] = { t: 0, tip: vo.tip }; if (vo.tip === 'sayi') arsiv[vo.ad].t += parseFloat(vo.durum || 0); else if (vo.durum > 0) arsiv[vo.ad].t += 1; }); } } let h = `<div style="max-height:55vh; overflow-y:auto;"><table style="width:100%; font-size:12px;"><thead><tr style="color:var(--red);"><th style="text-align:left;">Kaza Namazları</th><th style="text-align:right;">Adet</th></tr></thead><tbody>`; Object.keys(kaza).forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right;">${kaza[k]}</td></tr>`; }); h += `</tbody></table><table style="width:100%; margin-top:15px; font-size:12px;"><thead><tr style="color:var(--blue);"><th style="text-align:left;">Özel Ameller</th><th style="text-align:right;">Değer</th></tr></thead><tbody>`; Object.keys(arsiv).sort().forEach(k => { h += `<tr><td>${k}</td><td style="text-align:right;">${arsiv[k].t} ${arsiv[k].tip==='sayi'?'':'G'}</td></tr>`; }); grid.innerHTML = h + `</tbody></table></div>`; document.getElementById('statModal').style.display = 'block'; };
    window.closeModal = () => { document.getElementById('statModal').style.display = 'none'; raporTarih = new Date(); };
    window.openSettings = () => { document.getElementById('signalToggle').checked = signalsActive; document.getElementById('settingsModal').style.display = 'block'; };
    window.closeSettings = () => { document.getElementById('settingsModal').style.display = 'none'; };
    window.sayiGuncelle = (i, v) => { gunlukVeriler.ozeller[i].durum = v; render(); };
    window.exportData = () => { let all = {}; for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); if(k.startsWith('amel_')) all[k] = localStorage.getItem(k); } let b = new Blob([JSON.stringify(all)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `amel_yedek.json`; a.click(); };
    window.importData = () => { let i = document.createElement('input'); i.type='file'; i.onchange=e=>{ let fr=new FileReader(); fr.onload=()=>{ let d=JSON.parse(fr.result); Object.keys(d).forEach(k=>localStorage.setItem(k,d[k])); location.reload(); }; fr.readAsText(e.target.files[0]); }; i.click(); };
    
    veriYukle();
</script>
</body>
</html>
